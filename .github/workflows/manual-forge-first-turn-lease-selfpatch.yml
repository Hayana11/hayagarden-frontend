name: Manual Forge First-Turn Lease Self Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-focused-patch:
    if: github.head_ref == 'fix/manual-forge-first-turn-lease-r1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact first-turn lease wiring patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gateway_path = Path('gateway.py')
          gateway = gateway_path.read_text(encoding='utf-8')
          old = """        event_iter = iter(session.staged.send_turn(\n            first_turn_content,\n            on_stdin_flushed=on_stdin_flushed,\n            idle_heartbeat_sec=10.0,\n        ))\n"""
          new = """        from tools.lease_signer import issue_turn_lease\n        first_turn_lease = issue_turn_lease(\n            turn_id='context-window-first-turn:' + ft_req,\n            turn_mode='chat',\n            issued_from='default_policy',\n        )\n        event_iter = iter(session.staged.send_turn(\n            first_turn_content,\n            on_stdin_flushed=on_stdin_flushed,\n            idle_heartbeat_sec=10.0,\n            turn_lease=first_turn_lease,\n        ))\n"""
          if gateway.count(old) != 1:
              raise SystemExit(f'gateway anchor count drifted: {gateway.count(old)}')
          gateway_path.write_text(gateway.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_context_window_first_turn.py')
          test = test_path.read_text(encoding='utf-8')
          old_sig = """                idle_heartbeat_sec=None,\n            ):"""
          new_sig = """                idle_heartbeat_sec=None,\n                turn_lease=None,\n            ):"""
          count = test.count(old_sig)
          if count != 6:
              raise SystemExit(f'first-turn fake signature count drifted: {count}')
          test_path.write_text(test.replace(old_sig, new_sig), encoding='utf-8')
          PY

          python -m py_compile gateway.py tests/test_context_window_first_turn.py
          rm -f .github/workflows/manual-forge-first-turn-lease-selfpatch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway.py tests/test_context_window_first_turn.py .github/workflows/manual-forge-first-turn-lease-selfpatch.yml
          git commit -m 'fix(context-window): lease manual forge first turn'
          git push origin HEAD:${{ github.head_ref }}
