name: M3-01 Todo Internal MCP shadow validation

on:
  pull_request:
    paths:
      - "tools/capability_manifest.py"
      - "tools/execution_fence.py"
      - "tools/todo_internal_adapter.py"
      - "internal-mcp-server.js"
      - "tests/test_m3_01_todo_internal.py"
      - "tests/test-m3-01-todo-internal.mjs"
      - ".github/workflows/m3-01-todo-internal-shadow-validation.yml"

permissions:
  contents: read

jobs:
  base-head:
    name: ${{ matrix.label }} M3-01 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: ${{ github.event.pull_request.base.sha }}
          - label: head
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact ${{ matrix.label }} SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run existing control-plane regressions
        run: >-
          python -m unittest
          tests.test_capability_state
          tests.test_execution_fence
          tests.test_cc_capability_adapter
          tests.test_cc_resident
          tests.test_daily_runtime

      - name: Run base Todo handler and Home MCP contracts
        if: matrix.label == 'base'
        run: >-
          python -m unittest
          tests.test_product_handlers
          tests.test_mcp_http_server_p4

      - name: Run head M3-01 Python contracts
        if: matrix.label == 'head'
        run: python -m unittest tests.test_m3_01_todo_internal

      - name: Run head Internal MCP shadow
        if: matrix.label == 'head'
        run: node tests/test-m3-01-todo-internal.mjs

      - name: Build frontend without changing its live surface
        if: matrix.label == 'head'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Enforce exact changed-file fence
        if: matrix.label == 'head'
        shell: bash
        run: |
          actual="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort)"
          expected="$(printf '%s
'             '.github/workflows/m3-01-todo-internal-shadow-validation.yml'             'internal-mcp-server.js'             'tests/test-m3-01-todo-internal.mjs'             'tests/test_m3_01_todo_internal.py'             'tools/capability_manifest.py'             'tools/execution_fence.py'             'tools/todo_internal_adapter.py' | sort)"
          test "$actual" = "$expected"
          test -z "$(printf '%s
' "$actual" | grep -E '^(wake/|app.py$|tools/product_handlers.py$|tools/cc_capability_adapter.py$|tools/cc_tool_surface.py$|cc_resident.py$|chat/daily_runtime.py$)' || true)"
