name: M3-01 Todo Internal MCP shadow validation

on:
  pull_request:
    paths:
      - "tools/capability_manifest.py"
      - "tools/execution_fence.py"
      - "tools/todo_internal_adapter.py"
      - "internal-mcp-server.js"
      - "tests/test_m3_01_todo_internal.py"
      - "tests/test-m3-01-todo-internal.mjs"
      - ".github/workflows/m3-01-todo-internal-shadow-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  base-head:
    name: ${{ matrix.label }} M3-01 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: ${{ github.event.pull_request.base.sha }}
          - label: head
            ref: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact ${{ matrix.label }} SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install M2-02B test dependencies
        run: python -m pip install Flask Pillow Markdown

      - name: Prepare isolated runtime paths
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          touch /opt/frontend/.env

      - name: Run exact M2-02B matrix on both base and head
        run: >-
          python -m unittest
          tests.test_cc_runtime
          tests.test_cc_deferred_resume
          tests.test_m2_02b_surface_generation
          -v

      - name: Run existing control-plane regressions
        run: >-
          python -m unittest
          tests.test_capability_state
          tests.test_execution_fence
          tests.test_cc_capability_adapter
          tests.test_context_window_resident
          tests.test_daily_runtime

      - name: Run base Todo handler and Home MCP contracts
        if: matrix.label == 'base'
        run: >-
          python -m unittest
          tests.test_product_handlers
          tests.test_mcp_http_server_p4

      - name: Run head M3-01 Python contracts
        if: matrix.label == 'head'
        run: |
          python - <<'PY'
          import importlib.util
          import unittest

          path = 'tests/test_m3_01_todo_internal.py'
          spec = importlib.util.spec_from_file_location('m3_01_todo_internal', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(module.TodoInternalAdapterTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Run head Internal MCP shadow
        if: matrix.label == 'head'
        run: node tests/test-m3-01-todo-internal.mjs

      - name: Build frontend without changing its live surface
        if: matrix.label == 'head'
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Enforce scoped changed-file fence
        if: matrix.label == 'head'
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          ci_policy_file=".github/workflows/m3-01-todo-internal-shadow-validation.yml"
          forbidden_regex='^(wake/|app.py$|tools/product_handlers.py$|tools/cc_capability_adapter.py$|tools/cc_tool_surface.py$|cc_resident.py$|chat/daily_runtime.py)'

          scope_mode() {
            local diff="$1"
            local owned
            local workflow_only
            owned="$(printf '%s\n' "$diff" | awk '
              $0 == "tools/todo_internal_adapter.py" ||
              $0 == "internal-mcp-server.js" ||
              $0 == "tests/test_m3_01_todo_internal.py" ||
              $0 == "tests/test-m3-01-todo-internal.mjs"
            ')"
            workflow_only="$(printf '%s\n' "$diff" | awk -v workflow="$ci_policy_file" '
              NF && $0 != workflow { found=1 }
              END { print(found ? "false" : "true") }
            ')"
            if [ -n "$owned" ]; then
              printf '%s\n' "OWNED_CHANGE"
            elif [ "$workflow_only" = "true" ]; then
              printf '%s\n' "CI_POLICY_ONLY"
            else
              printf '%s\n' "REGRESSION_ONLY"
            fi
          }

          enforce_forbidden_boundary() {
            local diff="$1"
            if printf '%s\n' "$diff" | grep -E "$forbidden_regex"; then
              return 1
            fi
            return 0
          }

          retirement_compat_cleanup_applies() {
            local diff="$1"
            local stale_compat="$2"
            local target_gone="$3"
            local owned_files
            local production_owned
            [ "$stale_compat" = "true" ] || return 1
            [ "$target_gone" = "true" ] || return 1
            production_owned="$(printf '%s\n' "$diff" | awk '
              $0 == "tools/todo_internal_adapter.py" ||
              $0 == "internal-mcp-server.js"
            ')"
            [ -z "$production_owned" ] || return 1
            owned_files="$(printf '%s\n' "$diff" | awk '
              $0 == "tools/todo_internal_adapter.py" ||
              $0 == "internal-mcp-server.js" ||
              $0 == "tests/test_m3_01_todo_internal.py" ||
              $0 == "tests/test-m3-01-todo-internal.mjs"
            ' | awk 'NF' | sort -u)"
            [ "$owned_files" = "tests/test_m3_01_todo_internal.py" ] || return 1
            return 0
          }

          stale_compat_from_git() {
            local base="$1"
            local head="$2"
            local file="tests/test_m3_01_todo_internal.py"
            local patch
            local deleted
            local line
            if ! git diff --name-only "$base" "$head" | grep -qx "$file"; then
              printf '%s\n' "false"
              return 0
            fi
            patch="$(git diff "$base" "$head" -- "$file")"
            if printf '%s\n' "$patch" | grep -E '^\+[^+]' | grep -vE '^\+\s*$' >/dev/null; then
              printf '%s\n' "false"
              return 0
            fi
            deleted="$(printf '%s\n' "$patch" | grep -E '^\-[^-]' || true)"
            if [ -z "$deleted" ]; then
              printf '%s\n' "false"
              return 0
            fi
            leftover="$(printf '%s\n' "$deleted" | grep -vE 'WAKE_TO_CC_MCP|cc_wake_allowed_tools|wake\.cc_tools' || true)"
            if [ -n "$leftover" ]; then
              printf '%s\n' "false"
              return 0
            fi
            printf '%s\n' "true"
          }

          target_gone_on_tree() {
            local hits
            hits="$(grep -R -n -E 'WAKE_TO_CC_MCP|cc_wake_allowed_tools' \
              --include='*.py' --include='*.js' \
              --exclude-dir=tests --exclude-dir=node_modules --exclude-dir=app \
              --exclude-dir=.git \
              . || true)"
            if [ -n "$hits" ]; then
              printf '%s\n' "false"
              return 0
            fi
            printf '%s\n' "true"
          }

          assert_case() {
            local label="$1"
            local expected_mode="$2"
            local expected_result="$3"
            local diff="$4"
            local stale_compat="${5:-false}"
            local target_gone="${6:-false}"
            local mode
            mode="$(scope_mode "$diff")"
            if [ "$mode" != "$expected_mode" ]; then
              echo "$label: expected mode $expected_mode, got $mode"
              return 1
            fi
            case "$expected_result:$expected_mode" in
              PASS:OWNED_CHANGE)
                if retirement_compat_cleanup_applies "$diff" "$stale_compat" "$target_gone"; then
                  echo "$label: retirement-compat cleanup exception applied"
                elif ! enforce_forbidden_boundary "$diff"; then
                  echo "$label: unexpected forbidden-boundary failure"
                  return 1
                fi
                ;;
              PASS:*)
                ;;
              FAIL:OWNED_CHANGE)
                if retirement_compat_cleanup_applies "$diff" "$stale_compat" "$target_gone"; then
                  echo "$label: retirement-compat exception must not apply"
                  return 1
                fi
                if enforce_forbidden_boundary "$diff"; then
                  echo "$label: expected forbidden-boundary failure"
                  return 1
                fi
                ;;
              *)
                echo "$label: invalid synthetic expectation"
                return 1
                ;;
            esac
          }

          gallery_case=$'tools/capability_manifest.py\ntools/execution_fence.py\ntools/cc_capability_adapter.py\ntools/cc_tool_surface.py'
          m3_normal_case=$'tools/todo_internal_adapter.py\ntools/capability_manifest.py'
          m3_surface_violation_case=$'tools/todo_internal_adapter.py\ntools/cc_capability_adapter.py'
          m3_daily_violation_case=$'tests/test_m3_01_todo_internal.py\nchat/daily_runtime.py'
          m3_production_plus_wake_case=$'tools/todo_internal_adapter.py\nwake/runners.py'
          m3_test_plus_wake_unproven_case=$'tests/test_m3_01_todo_internal.py\nwake/runners.py'
          m3_retirement_compat_case=$'tests/test_m3_01_todo_internal.py\nwake/cc_tools.py\nwake/runners.py'
          policy_only_case="$ci_policy_file"

          assert_case "GALLERY_CAPABILITY_CASE" "REGRESSION_ONLY" "PASS" "$gallery_case"
          echo "GALLERY_CAPABILITY_CASE=PASS"
          assert_case "M3_01_NORMAL_CASE" "OWNED_CHANGE" "PASS" "$m3_normal_case"
          echo "M3_01_NORMAL_CASE=PASS"
          assert_case "M3_01_CC_SURFACE_VIOLATION" "OWNED_CHANGE" "FAIL" "$m3_surface_violation_case"
          echo "M3_01_CC_SURFACE_VIOLATION=PASS"
          assert_case "M3_01_DAILY_RUNTIME_VIOLATION" "OWNED_CHANGE" "FAIL" "$m3_daily_violation_case"
          echo "M3_01_DAILY_RUNTIME_VIOLATION=PASS"
          assert_case "M3_01_PRODUCTION_PLUS_WAKE" "OWNED_CHANGE" "FAIL" "$m3_production_plus_wake_case"
          echo "M3_01_PRODUCTION_PLUS_WAKE=PASS"
          assert_case "M3_01_TEST_PLUS_WAKE_UNPROVEN" "OWNED_CHANGE" "FAIL" "$m3_test_plus_wake_unproven_case" "false" "true"
          echo "M3_01_TEST_PLUS_WAKE_UNPROVEN=PASS"
          assert_case "M3_01_RETIREMENT_COMPAT_CLEANUP" "OWNED_CHANGE" "PASS" "$m3_retirement_compat_case" "true" "true"
          echo "M3_01_RETIREMENT_COMPAT_CLEANUP=PASS"
          assert_case "POLICY_ONLY_CASE" "CI_POLICY_ONLY" "PASS" "$policy_only_case"
          echo "POLICY_ONLY_CASE=PASS"
          echo "SYNTHETIC_CASES=8/8 PASS"

          stale_compat="$(stale_compat_from_git "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          target_gone="$(target_gone_on_tree)"
          echo "M3_01_STALE_COMPAT=$stale_compat"
          echo "M3_01_RETIREMENT_TARGET_GONE=$target_gone"
          mode="$(scope_mode "$actual")"
          echo "M3_01_SCOPE_MODE=$mode"
          if [ "$mode" = "OWNED_CHANGE" ]; then
            if retirement_compat_cleanup_applies "$actual" "$stale_compat" "$target_gone"; then
              echo "M3_01_RETIREMENT_COMPAT_CLEANUP=applied"
            else
              enforce_forbidden_boundary "$actual"
            fi
          fi
