name: M4-01B1 confirmation validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/confirmation_store.py"
      - "tests/test_confirmation_store.py"
      - "tests/test_m4_01b1_canonical.py"
      - ".github/workflows/m4-01b1-confirmation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    name: M4-01B1 exact-head canonical confirmation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run B1 focused and canonical integration contracts
        run: >-
          python -m pytest -q
          tests/test_confirmation_store.py
          tests/test_m4_01b1_canonical.py

      - name: Run canonical execution regressions
        run: >-
          python -m pytest -q
          tests/test_execution_fence.py
          tests/test_lease_signer.py

      - name: Enforce exact head and six-file diff fence
        shell: bash
        env:
          EXPECTED_BASE_SHA: a1e823ea86c14a81c6a490af4ed9f6f69d9dd61d
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'a1e823ea86c14a81c6a490af4ed9f6f69d9dd61d' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          actual="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/m4-01b1-confirmation-validation.yml' \
            'app/src/lib/chat.ts' \
            'app/src/screens/ChatScreen.tsx' \
            'tests/test_confirmation_store.py' \
            'tests/test_m4_01b1_canonical.py' \
            'tools/confirmation_store.py' | sort)"
          test "$actual" = "$expected"

