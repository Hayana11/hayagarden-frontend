name: M5-03A External MCP discovery validation

on:
  pull_request:
    paths:
      - 'tools/external_mcp_discovery_transport.mjs'
      - 'tests/test_external_mcp_discovery_transport.mjs'
      - '.github/workflows/m5-03a-external-mcp-discovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact main base and changed-file fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD^)" = "a2c4d2118d055323acf75022ab2acdc4c07e6988"
          test "$(git rev-parse origin/main)" = "a2c4d2118d055323acf75022ab2acdc4c07e6988"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = $'.github/workflows/m5-03a-external-mcp-discovery-validation.yml\ntests/test_external_mcp_discovery_transport.mjs\ntools/external_mcp_discovery_transport.mjs'
          git diff --check HEAD^ HEAD
          if command -v rg >/dev/null 2>&1; then
            scanner=rg
          elif command -v grep >/dev/null 2>&1; then
            scanner=grep
          else
            echo "No supported forbidden-term scanner is available" >&2
            exit 1
          fi
          echo "scope_scanner=$scanner"
          set +e
          "$scanner" -nF \
            -e 'external_server_registry' -e 'external_secret_store' -e 'fetchSecret' \
            -e 'decrypt' -e 'Authorization' -e 'oauth' -e 'callTool' -e 'tools/call' \
            -e 'claude' -e 'model.' -e 'model_' -e 'model/' -e ' model ' \
            -e 'registry.' -e 'registry_' -e 'registry/' -e ' registry ' \
            tools/external_mcp_discovery_transport.mjs
          scan_status=$?
          set -e
          echo "scope_scan_status=$scan_status"
          if test "$scan_status" -eq 0; then
            echo "forbidden term found" >&2
            exit 1
          fi
          if test "$scan_status" -ne 1; then
            echo "scope scanner failed with status $scan_status" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused real-SDK safe discovery tests
        run: node --test tests/test_external_mcp_discovery_transport.mjs
