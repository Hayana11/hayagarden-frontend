name: PR336 exact-head tools-list QA

on:
  push:
    branches:
      - qa/pr336-exact-head-tools-list

permissions:
  contents: read

jobs:
  exact-head-tools-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: f43b2e0760110fe4f3358d10a78d5e551f21aeea
          fetch-depth: 1

      - name: Verify exact target
        run: |
          test "$(git rev-parse HEAD)" = "f43b2e0760110fe4f3358d10a78d5e551f21aeea"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run existing Todo MCP contract
        run: node tests/test-m3-01-todo-internal.mjs

      - name: Verify clean afterwards
        run: test -z "$(git status --porcelain)"
