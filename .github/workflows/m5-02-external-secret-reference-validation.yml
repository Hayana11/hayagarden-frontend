name: M5-02 External Secret Reference validation

on:
  pull_request:
    paths:
      - "tools/external_secret_store.py"
      - "tests/test_external_secret_store.py"
      - ".github/workflows/m5-02-external-secret-reference-validation.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/codex/m5-02-external-secret-reference

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install cryptography

      - name: Verify exact base parent
        shell: bash
        env:
          BASE_SHA: 49c38d271d8dbbee82684f3984cd329230ce54b2
        run: |
          parent="$(git rev-parse HEAD^)"
          echo "parent=<$parent>"
          echo "expected_parent=<$BASE_SHA>"
          test "$parent" = "$BASE_SHA"

      - name: Verify diff whitespace
        shell: bash
        env:
          BASE_SHA: 49c38d271d8dbbee82684f3984cd329230ce54b2
        run: |
          diff_check="$(git -c core.whitespace=cr-at-eol diff --check "$BASE_SHA" HEAD)"
          test -z "$diff_check"

      - name: Verify changed-file fence
        shell: bash
        env:
          BASE_SHA: 49c38d271d8dbbee82684f3984cd329230ce54b2
        run: |
          actual="$(git diff --name-only "$BASE_SHA" HEAD | sort | tr '\n' ' ')"
          expected=".github/workflows/m5-02-external-secret-reference-validation.yml tests/test_external_secret_store.py tools/external_secret_store.py "
          echo "actual_files=<$actual>"
          echo "expected_files=<$expected>"
          test "$actual" = "$expected"

      - name: Run external secret focused tests
        run: python -m unittest -v tests.test_external_secret_store

      - name: Run credential vault regression
        run: python -m unittest -v tests.test_credential_vault
