name: Toolroom external surface R1

on:
  pull_request:
    paths:
      - "tools/external_mcp_surface.py"
      - "external-mcp-surface-server.js"
      - "tests/test_external_mcp_surface.py"
      - "tests/test_external_mcp_surface_server.mjs"
      - "tools/cc_capability_adapter.py"
      - "tools/execution_fence.py"
      - "tools/tool_inventory.py"
      - "app/src/screens/ToolroomScreen.tsx"
      - ".github/workflows/toolroom-external-surface.yml"

permissions:
  contents: read

jobs:
  focused-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAYAGARDEN_CONFIG_DB_PATH: /tmp/toolroom-external-surface-runtime.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python focused-test dependency
        run: python -m pip install cryptography
      - name: Run canonical external surface tests
        run: python -m unittest tests.test_external_mcp_surface tests.test_tool_inventory -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node focused-test dependency
        run: npm ci
      - name: Run local MCP server tests
        run: node --test tests/test_external_mcp_surface_server.mjs
