name: Better Mi Self Wake Common Tests TEMP

on:
  push:
    branches:
      - feature/better-mi-fitness-self-wake-r1
    paths:
      - "mobile/better-mi-fitness-sync/**"
      - ".github/workflows/better-mi-self-wake-common-test-temp.yml"

permissions:
  contents: read

concurrency:
  group: better-mi-self-wake-common-test-temp
  cancel-in-progress: true

jobs:
  common-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/better-mi-fitness-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Run composeApp common tests
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test             --stacktrace             --build-cache             --configuration-cache
