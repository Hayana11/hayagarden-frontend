name: M5-06C-B2 external runtime composition validation

on:
  push:
    branches:
      - codex/m5-06c-b2-runtime-composition-r1
    paths:
      - .github/workflows/m5-06c-b2-external-runtime-composition-validation.yml
      - tools/external_mcp_runtime.py
      - tests/test_external_mcp_runtime.py
      - tools/external_mcp_call_bridge.mjs
      - tests/test_external_mcp_call_bridge.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 2f3468e288cd432d14256b17bf07c849b72d28be
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact head, frozen base, and five-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "codex/m5-06c-b2-runtime-composition-r1"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          expected="$(printf '%s\n' \
            '.github/workflows/m5-06c-b2-external-runtime-composition-validation.yml' \
            'tests/test_external_mcp_call_bridge.mjs' \
            'tests/test_external_mcp_runtime.py' \
            'tools/external_mcp_call_bridge.mjs' \
            'tools/external_mcp_runtime.py' | sort)"
          actual="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA" HEAD
          for path in \
            tools/external_mcp_invocation.py tests/test_external_mcp_invocation.py \
            tools/external_mcp_discovery.py tests/test_external_mcp_discovery.py \
            tools/external_mcp_auth_binding.py tools/external_mcp_secret_materializer.py \
            tools/external_secret_store.py tools/external_mcp_call_transport.mjs \
            tools/external_mcp_discovery_bridge.mjs tools/external_mcp_discovery_transport.mjs \
            tools/external_server_registry.py tools/external_tool_registry.py \
            tools/external_tool_execution_fence.py tools/external_tool_side_effect_policy.py \
            tools/confirmation_store.py tools/lease_signer.py gateway.py
          do test -z "$(git diff --name-only "$BASE_SHA" HEAD -- "$path")"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install cryptography
          npm ci --no-audit --no-fund
      - name: B2 runtime and 06B Python regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest -v \
            tests.test_external_mcp_runtime \
            tests.test_external_mcp_discovery \
            tests.test_external_mcp_invocation \
            tests.test_external_server_registry \
            tests.test_external_mcp_auth_binding \
            tests.test_external_mcp_secret_materializer \
            tests.test_external_secret_store \
            tests.test_external_tool_execution_fence \
            tests.test_external_tool_side_effect_policy \
            tests.test_external_tool_registry
      - name: B2 bridge and B1 Node regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            tests/test_external_mcp_call_bridge.mjs \
            tests/test_external_mcp_call_transport.mjs \
            tests/test_external_mcp_discovery_bridge.mjs \
            tests/test_external_mcp_discovery_transport.mjs
