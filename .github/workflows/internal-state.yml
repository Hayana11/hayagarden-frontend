name: Internal state store

on:
  pull_request:
  push:
    branches: [main]

jobs:
  internal-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run internal state Phase 0 + 1A-0 tests
        run: |
          python3 -m unittest tests.test_internal_state_store tests.test_internal_state -v
