name: Internal state store

on:
  pull_request:
  push:
    branches: [main]

jobs:
  internal-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare /opt/frontend for legacy import side effects
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
      - name: Run internal state Phase 0 + 1A-0..1A-4b shadow tests
        run: |
          python3 -m unittest \
            tests.test_internal_state_store \
            tests.test_internal_state \
            tests.test_internal_state_events \
            tests.test_internal_state_events_scored \
            tests.test_internal_state_events_outcome \
            tests.test_internal_state_shadow \
            tests.test_internal_state_shadow_wiring \
            tests.test_interaction_state \
            tests.test_derived_longing_authority \
            tests.test_affect_bond_authority \
            tests.test_drive_authority \
            tests.test_crown_residual_cleanup \
            tests.test_gateway_shadow_module_resolution \
            tests.test_behavior_authority_b2_1 \
            tests.test_behavior_authority_b3_1 \
            -v
