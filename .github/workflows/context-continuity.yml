name: Context continuity guard

on:
  pull_request:
    paths:
      - "chat/context_*.py"
      - "chat/daily_*.py"
      - "chat/history_*.py"
      - "chat/day_*.py"
      - "chat/clean_window_shadow.py"
      - "chat/rolling_summary_store.py"
      - "context_usage_routes.py"
      - "context_usage_store.py"
      - "daily_context_routes.py"
      - "daily_context_bff.py"
      - "context_window_routes.py"
      - "context_window_bff.py"
      - "artifact_store.py"
      - "chat/attachment_contract.py"
      - "chat/choices_contract.py"
      - "chat/document_library.py"
      - "tools/context_*.py"
      - "tools/rolling_summary.py"
      - "tools/cc_usage_observability.py"
      - "chat/cc_vision_bridge.py"
      - "tests/test_cc_vision_bridge.py"
      - "tools/cc_jsonl_usage.py"
      - "scripts/measure_production_context.py"
      - "scripts/generate_day_handoff.py"
      - "scripts/daily_candidate_shadow_chat.py"
      - "scripts/report_cc_usage.py"
      - "scripts/replay_cc_jsonl_usage.py"
      - "wake/usage.py"
      - "wake/concern_resolution.py"
      - "tests/test_context_*.py"
      - "tests/test_history_*.py"
      - "tests/test_daily_*.py"
      - "tests/test_day_handoff.py"
      - "tests/test_generate_day_handoff.py"
      - "tests/test_clean_window_shadow.py"
      - "tests/test_file_choices_contract.py"
      - "tests/test_artifact_store_lifecycle.py"
      - "tests/test_document_library.py"
      - "tests/test_artifact_cleaner.py"
      - "tests/test_wake_*.py"
      - "tests/test_ombre_adapter.py"
      - "tests/test_memory_unification_audit.py"
      - "tests/test_relay_sanitize.py"
      - "tests/test_cc_jsonl_usage.py"
      - "tests/test_cc_usage_observability.py"
  push:
    branches: [main]
    paths:
      - "chat/context_*.py"
      - "chat/daily_*.py"
      - "chat/history_*.py"
      - "chat/day_*.py"
      - "chat/clean_window_shadow.py"
      - "chat/rolling_summary_store.py"
      - "context_usage_routes.py"
      - "context_usage_store.py"
      - "daily_context_routes.py"
      - "daily_context_bff.py"
      - "context_window_routes.py"
      - "context_window_bff.py"
      - "artifact_store.py"
      - "chat/attachment_contract.py"
      - "chat/choices_contract.py"
      - "chat/document_library.py"
      - "tools/context_*.py"
      - "tools/rolling_summary.py"
      - "tools/cc_usage_observability.py"
      - "chat/cc_vision_bridge.py"
      - "tests/test_cc_vision_bridge.py"
      - "tools/cc_jsonl_usage.py"
      - "scripts/measure_production_context.py"
      - "scripts/generate_day_handoff.py"
      - "scripts/daily_candidate_shadow_chat.py"
      - "scripts/report_cc_usage.py"
      - "scripts/replay_cc_jsonl_usage.py"
      - "wake/usage.py"
      - "wake/concern_resolution.py"
      - "tests/test_context_*.py"
      - "tests/test_history_*.py"
      - "tests/test_daily_*.py"
      - "tests/test_day_handoff.py"
      - "tests/test_generate_day_handoff.py"
      - "tests/test_clean_window_shadow.py"
      - "tests/test_file_choices_contract.py"
      - "tests/test_artifact_store_lifecycle.py"
      - "tests/test_document_library.py"
      - "tests/test_artifact_cleaner.py"
      - "tests/test_wake_*.py"
      - "tests/test_ombre_adapter.py"
      - "tests/test_memory_unification_audit.py"
      - "tests/test_relay_sanitize.py"
      - "tests/test_cc_jsonl_usage.py"
      - "tests/test_cc_usage_observability.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install route and artifact test dependencies
        run: python -m pip install Flask Pillow Markdown
      - name: Prepare /opt/frontend for runtime modules
        run: |
          sudo mkdir -p /opt
          # 生产代码硬编码 /opt/frontend；CI 里指到 checkout，避免 import 失败
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          sudo mkdir -p /opt/workspace/tools
          sudo chown -R "$USER" /opt/workspace
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
      - name: Compile context paths
        run: python -m py_compile app.py gateway.py cc_resident.py chat/system_builder.py chat/context_continuity.py chat/context_budget.py chat/context_lean.py chat/context_lean_state.py chat/clean_window_shadow.py chat/day_handoff.py chat/daily_context.py chat/context_window.py chat/daily_history.py chat/daily_runtime.py chat/cc_vision_bridge.py chat/history_assembly.py chat/history_boundary.py chat/history_legacy.py chat/rolling_summary_store.py tools/rolling_summary.py scripts/measure_production_context.py scripts/generate_day_handoff.py scripts/daily_candidate_shadow_chat.py context_usage_routes.py context_usage_store.py daily_context_routes.py daily_context_bff.py context_window_routes.py context_window_bff.py tools/context_usage_collector.py tools/cc_usage_observability.py tools/cc_jsonl_usage.py tools/cc_tool_surface.py tools/capability_manifest.py tools/lease_signer.py tools/cc_capability_adapter.py tools/execution_fence.py scripts/report_cc_usage.py scripts/replay_cc_jsonl_usage.py wake/usage.py wake/concern_resolution.py
      - name: Compile FILE+CHOICES contract
        run: python -m py_compile artifact_store.py chat/attachment_contract.py chat/choices_contract.py chat/document_library.py tools/artifact_cleaner.py tools/file_cleaner.py
      - name: Run Context Lean regressions
        run: |
          python -m unittest \
            tests.test_context_lean \
            tests.test_context_lean_golden \
            tests.test_context_lean_state_reanchor \
            tests.test_context_lean_state_stage1 \
            tests.test_context_budget \
            tests.test_context_state_integration \
            tests.test_history_assembly \
            tests.test_history_boundary \
            tests.test_relay_history_cache \
            tests.test_rolling_summary_modes \
            tests.test_cc_context_dedup \
            tests.test_cc_usage_observability \
            -v
      - name: Run FILE+CHOICES contract regressions
        run: python -m unittest tests.test_file_choices_contract tests.test_history_assembly tests.test_context_lean_golden -v
      - name: Run Artifact document lifecycle regressions
        run: |
          python -m unittest \
            tests.test_artifact_store_lifecycle \
            tests.test_document_library \
            tests.test_artifact_cleaner \
            -v
      - name: Run continuity regressions
        run: python -m unittest discover -s tests -p 'test_context_continuity.py'
      - name: Run clean window shadow regressions
        run: |
          python -m unittest \
            tests.test_day_handoff \
            tests.test_generate_day_handoff \
            tests.test_clean_window_shadow \
            -v
      - name: Run daily soft window regressions
        run: python -m unittest tests.test_daily_soft_window tests.test_daily_context_bff -v
      - name: Daily runtime R1 tests
        run: python -m unittest tests.test_daily_runtime tests.test_daily_sse_heartbeat tests.test_daily_bounded_cold tests.test_step10_continuity_fix tests.test_mapping_backlog_catchup tests.test_reality_context_h1a tests.test_cold_forge_carryover_dedup tests.test_cold_handoff_scene_ownership -v
      - name: Run context usage regressions
        run: python -m unittest tests.test_context_usage
      - name: Run CC context dedup regressions
        run: python -m unittest tests.test_cc_context_dedup
      - name: Run CC vision bridge regressions
        run: python -m unittest tests.test_cc_vision_bridge -v
      - name: Run Wake B1 runner regressions
        run: python -m unittest tests.test_wake_runners tests.test_wake_usage tests.test_provider_router
      - name: Run Wake identity regressions
        run: |
          python3 -m unittest \
            tests.test_wake_run_id \
            tests.test_dream_wake_morning \
            tests.test_self_trigger_guard \
            -v
      - name: Run Wake reply bridge regressions
        run: python -m unittest tests.test_wake_reply_bridge
      - name: Run concern resolution regressions
        run: python -m unittest tests.test_wake_concern_resolution -v
      - name: Run unified Ombre adapter regressions
        run: |
          python -m pip install python-frontmatter
          touch /opt/frontend/.env
          python -m unittest \
            tests.test_ombre_adapter \
            tests.test_memory_unification_audit \
            -v
      - name: Run relay sanitize regressions
        run: python -m unittest tests.test_relay_sanitize -v
      - name: Run CC usage observability regressions
        run: |
          python3 -m unittest \
            tests.test_cc_jsonl_usage \
            tests.test_cc_usage_observability \
            tests.test_cc_effort \
            -v
      - name: Run UH-A0 capability manifest contract
        run: python -m unittest tests.test_capability_manifest -v
      - name: Run UH-A0 turn lease signer contract
        run: python -m unittest tests.test_lease_signer -v
      - name: Run UH-A0 Claude Code capability adapter contract
        run: python -m unittest tests.test_cc_capability_adapter -v
      - name: Run UH-A0 execution fence contract
        run: python -m unittest tests.test_execution_fence -v
      - name: Run UH-A0 deferred resume provider contract
        run: python -m unittest tests.test_cc_deferred_resume tests.test_chat_write_confirmation -v
      - name: Run UH-A0 Home MCP compatibility fence contract
        run: python -m unittest tests.test_mcp_http_server_p4 -v
      - name: Validate deploy guard
        run: bash -n scripts/deploy-frontend.sh
      - name: Run production git drift regressions
        run: bash tests/test_check_production_git_drift.sh
