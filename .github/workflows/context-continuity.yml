name: Context continuity guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install route test dependency
        run: python -m pip install Flask
      - name: Prepare /opt/frontend for runtime modules
        run: |
          sudo mkdir -p /opt
          # 生产代码硬编码 /opt/frontend；CI 里指到 checkout，避免 import 失败
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          sudo mkdir -p /opt/workspace/tools
          sudo chown -R "$USER" /opt/workspace
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
      - name: Compile context paths
        run: python -m py_compile app.py gateway.py cc_resident.py chat/system_builder.py chat/context_continuity.py chat/context_budget.py chat/context_lean.py chat/context_lean_state.py chat/clean_window_shadow.py chat/day_handoff.py chat/daily_context.py chat/context_window.py chat/daily_history.py chat/daily_runtime.py chat/history_assembly.py chat/history_boundary.py chat/history_legacy.py chat/rolling_summary_store.py tools/rolling_summary.py scripts/measure_production_context.py scripts/generate_day_handoff.py scripts/daily_candidate_shadow_chat.py context_usage_routes.py context_usage_store.py daily_context_routes.py daily_context_bff.py context_window_routes.py context_window_bff.py tools/context_usage_collector.py tools/cc_usage_observability.py tools/cc_jsonl_usage.py tools/cc_tool_surface.py scripts/report_cc_usage.py scripts/replay_cc_jsonl_usage.py wake/usage.py wake/concern_resolution.py
      - name: Run Context Lean regressions
        run: |
          python -m unittest \
            tests.test_context_lean \
            tests.test_context_lean_golden \
            tests.test_context_lean_state_reanchor \
            tests.test_context_lean_state_stage1 \
            tests.test_context_budget \
            tests.test_context_state_integration \
            tests.test_history_assembly \
            tests.test_history_boundary \
            tests.test_relay_history_cache \
            tests.test_rolling_summary_modes \
            tests.test_cc_context_dedup \
            tests.test_cc_usage_observability \
            -v
      - name: Run continuity regressions
        run: python -m unittest discover -s tests -p 'test_context_continuity.py'
      - name: Run clean window shadow regressions
        run: |
          python -m unittest \
            tests.test_day_handoff \
            tests.test_generate_day_handoff \
            tests.test_clean_window_shadow \
            -v
      - name: Run daily soft window regressions
        run: python -m unittest tests.test_daily_soft_window tests.test_daily_context_bff -v
      - name: Daily runtime R1 tests
        run: python -m unittest tests.test_daily_runtime -v
      - name: Run context usage regressions
        run: python -m unittest tests.test_context_usage
      - name: Run CC context dedup regressions
        run: python -m unittest tests.test_cc_context_dedup
      - name: Run Wake B1 runner regressions
        run: python -m unittest tests.test_wake_runners tests.test_wake_usage tests.test_provider_router
      - name: Run Wake identity regressions
        run: |
          python3 -m unittest \
            tests.test_wake_run_id \
            tests.test_dream_wake_morning \
            tests.test_self_trigger_guard \
            -v
      - name: Run Wake reply bridge regressions
        run: python -m unittest tests.test_wake_reply_bridge
      - name: Run concern resolution regressions
        run: python -m unittest tests.test_wake_concern_resolution -v
      - name: Run unified Ombre adapter regressions
        run: |
          python -m pip install python-frontmatter
          touch /opt/frontend/.env
          python -m unittest \
            tests.test_ombre_adapter \
            tests.test_memory_unification_audit \
            -v
      - name: Run relay sanitize regressions
        run: python -m unittest tests.test_relay_sanitize -v
      - name: Run CC usage observability regressions
        run: |
          python3 -m unittest \
            tests.test_cc_jsonl_usage \
            tests.test_cc_usage_observability \
            -v
      - name: Validate deploy guard
        run: bash -n scripts/deploy-frontend.sh
      - name: Run production git drift regressions
        run: bash tests/test_check_production_git_drift.sh
