name: M3-02B Daily Todo provider cutover validation
on:
  pull_request:
    paths:
      - "tools/capability_manifest.py"
      - "tools/cc_capability_adapter.py"
      - "tools/cc_tool_surface.py"
      - "tests/test_m3_01_todo_internal.py"
      - "tests/test_execution_fence.py"
      - "tests/test_m3_02b_daily_todo_cutover.py"
      - ".github/workflows/m3-02b-daily-todo-provider-cutover.yml"
permissions:
  contents: read
jobs:
  exact-base-head:
    name: ${{ matrix.label }} M3-02B validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: ${{ github.event.pull_request.base.sha }}
          - label: head
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact ${{ matrix.label }} SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install Flask Pillow Markdown
      - name: Prepare isolated runtime paths
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend; fi
          touch /opt/frontend/.env
      - name: Run M2/M3 regression matrix
        run: |
          python -m unittest tests.test_cc_runtime tests.test_cc_deferred_resume tests.test_m2_02b_surface_generation tests.test_execution_fence tests.test_capability_state tests.test_cc_capability_adapter tests.test_m3_01_todo_internal tests.test_m3_02a_internal_mcp_service -v
      - name: Run M3-01 shadow and M3-02A readiness contracts
        run: |
          node tests/test-m3-01-todo-internal.mjs
          node tests/test-m3-02a-internal-mcp-readiness.mjs
      - name: Run M3-02B head-only contracts
        if: matrix.label == 'head'
        run: python -m unittest tests.test_m3_02b_daily_todo_cutover -v
      - name: Check exact base/head fingerprint contract
        shell: bash
        run: |
          actual="$(python - <<'PY'
          import tempfile
          from tools.cc_capability_adapter import build_uh_a0_spawn_plan
          with tempfile.TemporaryDirectory() as root:
              print(build_uh_a0_spawn_plan(cwd=root, write_mcp_config=False, env={})["physical_surface_fingerprint"])
          PY
          )"
          echo "$actual"
          if [ "${{ matrix.label }}" = "base" ]; then
            test "$actual" = "d9f1faa9469bd4f7cfceec47d7bb2d3850d06a6b21235881d3067be5606faa69"
          else
            test "$actual" != "d9f1faa9469bd4f7cfceec47d7bb2d3850d06a6b21235881d3067be5606faa69"
            repeat="$(python - <<'PY'
          import tempfile
          from tools.cc_capability_adapter import build_uh_a0_spawn_plan
          with tempfile.TemporaryDirectory() as root:
              print(build_uh_a0_spawn_plan(cwd=root, write_mcp_config=False, env={})["physical_surface_fingerprint"])
          PY
            )"
            test "$actual" = "$repeat"
          fi
      - name: Check exact changed-file fence and diff
        if: matrix.label == 'head'
        shell: bash
        run: |
          actual="$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/m3-02b-daily-todo-provider-cutover.yml' \
            'tests/test_m3_01_todo_internal.py' \
            'tests/test_m3_02b_daily_todo_cutover.py' \
            'tools/capability_manifest.py' \
            'tools/cc_capability_adapter.py' \
            'tools/cc_tool_surface.py' | sort)"
          test "$actual" = "$expected"
          if printf '%s\n' "$actual" | grep -E '^(tools/execution_fence.py$|cc_resident.py$|chat/daily_runtime.py$|wake/|tools/product_handlers.py$|internal-mcp-server.js$|app.py$|app/|deploy/systemd/|scripts/)' ; then exit 1; fi
          git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
