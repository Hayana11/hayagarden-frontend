name: M3-03B Daily Ledger provider cutover validation

on:
  pull_request:
    paths:
      - ".github/workflows/m3-03a-ledger-internal-validation.yml"
      - ".github/workflows/m3-03b-daily-ledger-cutover-validation.yml"
      - ".github/workflows/m3-02b-daily-todo-provider-cutover.yml"
      - "tests/test_m3_03b_daily_ledger_cutover.py"
      - "tests/test_capability_manifest.py"
      - "tests/test_m3_02b_daily_todo_cutover.py"
      - "tests/test_execution_fence.py"
      - "tests/test_cc_capability_adapter.py"
      - "tools/capability_manifest.py"
      - "tools/cc_capability_adapter.py"
      - "tools/cc_tool_surface.py"

permissions:
  contents: read

jobs:
  m3-03b:
    name: M3-03B exact head validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install Flask Pillow Markdown
      - name: Prepare isolated runtime paths
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          touch /opt/frontend/.env
      - name: Run M3-03B contracts
        run: python -m unittest tests.test_m3_03b_daily_ledger_cutover -v
      - name: Capture and assert exact target fingerprint
        run: |
          actual="$(python - <<'PY'
          from tools.cc_capability_adapter import physical_surface_fingerprint
          print(physical_surface_fingerprint())
          PY
          )"
          test "$actual" = "bb737fec7aaa5124f2adc718f1e762e607450777359d95bde50b9d0b15d875e0"
          printf 'M3-03B fingerprint=%s\n' "$actual"
      - name: Run resident and fence regressions
        run: |
          python -m unittest \
            tests.test_cc_runtime \
            tests.test_cc_deferred_resume \
            tests.test_m2_02b_surface_generation \
            tests.test_execution_fence
      - name: Run M3-02A service regression
        run: python -m unittest tests.test_m3_02a_internal_mcp_service
      - name: Check diff whitespace
        run: git diff --check
      - name: Verify exact changed-file fence
        shell: bash
        run: |
          actual="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | sort)"
          expected="$(printf '%s\n' '.github/workflows/m3-02b-daily-todo-provider-cutover.yml' '.github/workflows/m3-03a-ledger-internal-validation.yml' '.github/workflows/m3-03b-daily-ledger-cutover-validation.yml' 'tests/test_capability_manifest.py' 'tests/test_cc_capability_adapter.py' 'tests/test_execution_fence.py' 'tests/test_m3_02b_daily_todo_cutover.py' 'tests/test_m3_03b_daily_ledger_cutover.py' 'tools/capability_manifest.py' 'tools/cc_capability_adapter.py' 'tools/cc_tool_surface.py' | sort)"
          test "$actual" = "$expected"
          test -z "$(printf '%s\n' "$actual" | grep -E '^(internal-mcp-server.js$|tools/ledger_internal_adapter.py$|scripts/activate-internal-mcp.sh$|wake/|tools/product_handlers.py$|app.py$|mcp-http-server.js$|cc_resident.py$|tools/execution_fence.py$|chat/daily_runtime.py$|deploy/systemd/|UI)' || true)"
