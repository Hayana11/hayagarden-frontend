name: PR425 chat confirmation rework temporary gate

on:
  push:
    branches:
      - codex/wake-liveness-r0
  pull_request:
    branches:
      - main

jobs:
  targeted-rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install Flask Pillow Markdown cryptography
      - name: Prepare runtime import path
        run: sudo mkdir -p /opt/frontend && sudo touch /opt/frontend/memories.db
      - name: Compile changed Python files
        run: python -m py_compile cc_resident.py gateway.py tests/test_cc_jsonl_usage.py tests/test_uh_a1_step2_base_wake.py tests/test_unified_heartbeat_a1.py tests/test_chat_write_confirmation.py
      - name: Run requested regression
        run: python -m unittest tests.test_chat_write_confirmation tests.test_cc_deferred_resume tests.test_cc_jsonl_usage tests.test_unified_heartbeat_a1 -v
