name: M3-04A memory search handler validation

on:
  pull_request:
    paths:
      - "app.py"
      - "tools/product_handlers.py"
      - "tests/test_m3_04a_memory_search.py"
      - ".github/workflows/m3-04a-memory-search-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-search:
    name: M3-04A exact head validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install Flask Pillow Markdown

      - name: Prepare isolated runtime paths
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          touch /opt/frontend/.env

      - name: Run M3-04A handler and HTTP parity tests
        run: |
          python -m unittest             tests.test_m3_04a_memory_search             tests.test_product_handlers             -v

      - name: Run provider, fence, Wake, and product regressions
        run: |
          python -m unittest             tests.test_capability_manifest             tests.test_cc_capability_adapter             tests.test_execution_fence             tests.test_wake_runners             tests.test_ledger_routes             tests.test_diary_writer             tests.test_auto_diary_contract             -v

      - name: Assert unchanged physical fingerprint and providers
        run: |
          python - <<'PY'
          import tools.capability_manifest as manifest
          from tools.cc_capability_adapter import physical_surface_fingerprint
          from wake.cc_tools import WAKE_TO_CC_MCP

          assert manifest.get_capability("memory.search")["provider_bindings"] == {
              "claude_code": "mcp__home__search_memories"
          }
          assert manifest.get_capability("memory.search")["loading_policy"] == "always_load"
          assert WAKE_TO_CC_MCP["search_memories"] == "mcp__home__search_memories"
          assert physical_surface_fingerprint() == (
              "bb737fec7aaa5124f2adc718f1e762e607450777359d95bde50b9d0b15d875e0"
          )
          print("memory provider/loading/Wake/fingerprint PASS")
          PY

      - name: Check diff whitespace and forbidden files
        run: |
          git diff --check
          test -z "$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -E '^(mcp-http-server.js|internal-mcp-server.js|tools/memory_tool.py|tools/memory_library.py|tools/ombre_adapter.py|tools/capability_manifest.py|tools/cc_capability_adapter.py|tools/execution_fence.py|cc_resident.py|chat/|wake/|static/|deploy/|systemd/|scripts/)' || true)"

      - name: Verify exact M3-04A changed-file fence
        run: |
          actual="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/m3-04a-memory-search-validation.yml'             'app.py'             'tests/test_m3_04a_memory_search.py'             'tools/product_handlers.py' | sort)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
