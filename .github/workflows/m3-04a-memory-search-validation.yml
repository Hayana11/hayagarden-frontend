name: M3-04A memory search handler validation

on:
  pull_request:
    paths:
      - "app.py"
      - "tools/product_handlers.py"
      - "tests/test_m3_04a_memory_search.py"
      - ".github/workflows/m3-04a-memory-search-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memory-search:
    name: M3-04A exact head validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install Flask -r requirements.txt

      - name: Prepare isolated runtime paths
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          touch /opt/frontend/.env

      - name: Resolve pull_request validation range
        id: pull-request-range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$BASE_SHA" =~ ^0+$ || "$HEAD_SHA" =~ ^0+$ ]]; then
            echo "pull_request validation range unavailable: base=$BASE_SHA head=$HEAD_SHA" >&2
            exit 1
          fi
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null || {
            echo "pull_request validation base is not a commit: $BASE_SHA" >&2
            exit 1
          }
          git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null || {
            echo "pull_request validation head is not a commit: $HEAD_SHA" >&2
            exit 1
          }
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve workflow_dispatch validation range
        id: workflow-dispatch-range
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$HEAD_SHA" || "$HEAD_SHA" =~ ^0+$ ]]; then
            echo "workflow_dispatch validation range unavailable: head=$HEAD_SHA" >&2
            exit 1
          fi
          git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null || {
            echo "workflow_dispatch validation head is not a commit: $HEAD_SHA" >&2
            exit 1
          }
          BASE_SHA="$(git rev-parse --verify "$HEAD_SHA^")" || {
            echo "workflow_dispatch validation base unavailable: head=$HEAD_SHA has no parent" >&2
            exit 1
          }
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null || {
            echo "workflow_dispatch validation base is not a commit: $BASE_SHA" >&2
            exit 1
          }
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Run M3-04A handler and HTTP parity tests
        run: |
          python -m unittest             tests.test_m3_04a_memory_search             tests.test_product_handlers             -v

      - name: Run provider, fence, Wake, and product regressions
        run: |
          python -m unittest             tests.test_capability_manifest             tests.test_cc_capability_adapter             tests.test_execution_fence             tests.test_wake_runners             tests.test_ledger_routes             tests.test_diary_writer             tests.test_auto_diary_contract             -v

      - name: Assert unchanged physical fingerprint and providers
        run: |
          python - <<'PY'
          import tools.capability_manifest as manifest
          from tools.cc_capability_adapter import physical_surface_fingerprint
          from wake.cc_tools import WAKE_TO_CC_MCP

          assert manifest.get_capability("memory.search")["provider_bindings"] == {
              "claude_code": "mcp__capability__memory_search",
              "internal_mcp": "mcp__internal__search_memories",
              "home_mcp": "mcp__home__search_memories",
          }
          assert manifest.get_capability("memory.search")["loading_policy"] == "always_load"
          assert WAKE_TO_CC_MCP["search_memories"] == "mcp__home__search_memories"
          # Catch-up after #484 promoted health.read onto the physical
          # internal MCP surface. memory.search bindings are unchanged.
          fingerprint = physical_surface_fingerprint()
          assert fingerprint == (
              "9cc7fe0a421e341afd1b474de89d8d9989e91ff90fb9797687eec5c589c7f449"
          ), fingerprint
          print("memory provider/loading/Wake/fingerprint PASS")
          PY

      # This workflow is also triggered by shared app.py changes.
      # Keep repository-wide diff validation to whitespace only;
      # M3-owned file scope is enforced by the scoped fence below.
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ steps.pull-request-range.outputs.base_sha || steps.workflow-dispatch-range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull-request-range.outputs.head_sha || steps.workflow-dispatch-range.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "validation diff range outputs are empty" >&2
            exit 1
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Verify scoped M3-04A changed-file fence
        env:
          BASE_SHA: ${{ steps.pull-request-range.outputs.base_sha || steps.workflow-dispatch-range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull-request-range.outputs.head_sha || steps.workflow-dispatch-range.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "validation diff range outputs are empty" >&2
            exit 1
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          m3_scope_pattern="^(\.github/workflows/m3-04a-memory-search-validation\.yml|app\.py|tests/test_m3_04a_memory_search\.py|tools/product_handlers\.py)$"
          m3_related_pattern="^(\.github/workflows/m3-04a-memory-search-validation\.yml|app\.py|tests/test_m3_04a_memory_search\.py|tests/test_product_handlers\.py|tools/product_handlers\.py)$"
          m3_scope_files="$(printf '%s\n' "$changed_files" | grep -E "$m3_scope_pattern" || true)"
          m3_related_files="$(printf '%s\n' "$changed_files" | grep -E "$m3_related_pattern" || true)"
          if [[ -z "$m3_scope_files" ]]; then
            echo "M3-04A scoped changed-file fence: no owned file changed" >&2
            exit 1
          fi
          undeclared_m3_files="$(printf '%s\n' "$m3_related_files" | grep -Ev "$m3_scope_pattern" || true)"
          if [[ -n "$undeclared_m3_files" ]]; then
            echo "M3-04A scoped changed-file fence: undeclared related file(s):" >&2
            printf '%s\n' "$undeclared_m3_files" >&2
            exit 1
          fi
          printf '%s\n' "$m3_scope_files"
