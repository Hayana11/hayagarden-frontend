name: WAKE-LIVENESS-R0 rework temporary gate

on:
  push:
    branches:
      - codex/wake-liveness-r0

jobs:
  focused-rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install Flask Pillow Markdown cryptography
      - name: Prepare runtime import path
        run: sudo mkdir -p /opt/frontend
      - name: Compile changed Python files
        run: python -m py_compile cc_resident.py gateway.py tests/test_cc_jsonl_usage.py tests/test_uh_a1_step2_base_wake.py tests/test_unified_heartbeat_a1.py
      - name: Run Wake and resident regression
        run: python -m unittest tests.test_cc_jsonl_usage tests.test_uh_a1_step2_base_wake tests.test_unified_heartbeat_a1 -v
