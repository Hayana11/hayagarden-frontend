name: PR415 Fallback Focused TEMP

on:
  push:
    branches:
      - codex/cw-fallback-stale-staged-leak-r1

permissions:
  contents: read

jobs:
  fallback-focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install Flask

      - name: Prepare runtime path
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
          touch /opt/frontend/.env

      - name: Fallback focused
        run: python3 -m unittest tests.test_context_window_fallback -v

      - name: First-turn and target-prepare focused
        run: |
          python3 -m unittest \
            tests.test_context_window_first_turn \
            tests.test_context_window_target_prepare \
            -v

      - name: Joint focused gate
        run: |
          python3 -m unittest \
            tests.test_context_window_fallback \
            tests.test_context_window_first_turn \
            tests.test_context_window_target_prepare \
            -v

  base-first-turn-control:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR base
        uses: actions/checkout@v4
        with:
          ref: 18960a41ff8c25613f8aab1ad65b6d5c03d68c48

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install Flask

      - name: Prepare runtime path
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
          touch /opt/frontend/.env

      - name: Base first-turn and target-prepare control
        run: |
          git rev-parse HEAD
          python3 -m unittest \
            tests.test_context_window_first_turn \
            tests.test_context_window_target_prepare \
            -v
