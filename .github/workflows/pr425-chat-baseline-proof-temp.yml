name: PR425 baseline chat confirmation proof

on:
  push:
    branches:
      - codex/wake-liveness-r0
  pull_request:
    branches:
      - main

jobs:
  baseline-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8eb3f2604cb3f3c4f11cde0aa18f0d6f4b2d6641
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install Flask Pillow Markdown cryptography
      - name: Prepare runtime import path
        run: sudo mkdir -p /opt/frontend && sudo touch /opt/frontend/memories.db
      - name: Reproduce canonical baseline failure
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_chat_write_confirmation.DeferredConfirmationBridgeTests.test_approve_issues_exact_user_confirmation_lease_and_resumes_once -v > /tmp/pr425-baseline.log 2>&1
          status=$?
          cat /tmp/pr425-baseline.log
          test "$status" -ne 0
          grep -F "Object of type MagicMock is not JSON serializable" /tmp/pr425-baseline.log
