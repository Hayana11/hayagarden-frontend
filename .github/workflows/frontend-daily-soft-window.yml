name: Frontend Soft Window FE-R1

on:
  pull_request:
    paths:
      - 'app/**'
      - 'daily_context_bff.py'
      - 'gateway.py'
      - '.github/workflows/frontend-daily-soft-window.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'daily_context_bff.py'
      - 'gateway.py'
      - '.github/workflows/frontend-daily-soft-window.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  soft-window-fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install + build + Soft Window FE tests
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:chat-image-compression
          npm run test:file-choices-contract
          npm run test:daily-soft-window
          npm run test:daily-soft-window-machine
          npm run test:manual-context-window
          npm run test:legacy-transcript-window
          npm run test:react-shell-architecture
          npm run test:typography-semantics
          npm run test:usage-chrome78-runtime
          npm run test:page-header-geometry
          npm run test:chrome78-geometry-sweep
          npm run test:chat-cold-start
          npm run test:chat-warm-return
          npm run test:chat-capacity-header
          npm run test:task-timer-real-data-wiring
          npm run test:memory-cold-start