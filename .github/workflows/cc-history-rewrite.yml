name: CC history rewrite guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  history-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install route test dependency
        run: python -m pip install Flask
      - name: Prepare /opt/frontend for runtime modules
        run: |
          sudo mkdir -p /opt
          if [ ! -e /opt/frontend ]; then
            sudo ln -sfn "$GITHUB_WORKSPACE" /opt/frontend
          fi
          sudo mkdir -p /opt/workspace/tools
          sudo chown -R "$USER" /opt/workspace
          python - <<'PY'
          import sqlite3
          for name in ("memories.db", "commands.db"):
              sqlite3.connect(f"/opt/frontend/{name}").close()
          PY
      - name: Compile history rewrite paths
        run: python -m py_compile app.py gateway.py cc_resident.py chat/cc_history_rewrite.py
      - name: Run CC history rewrite regressions
        run: python -m unittest tests.test_cc_history_rewrite -v
