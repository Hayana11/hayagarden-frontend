name: WAKE-LIVENESS-R0 temporary focused gate

on:
  pull_request:
    paths:
      - "cc_resident.py"
      - "gateway.py"
      - "tests/test_cc_jsonl_usage.py"
      - "tests/test_uh_a1_step2_base_wake.py"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install Flask Pillow Markdown cryptography
      - name: Run Wake JSONL focused regressions
        env:
          HAYAGARDEN_CONFIG_DB_PATH: ${{ runner.temp }}/hayagarden-config.db
          HAYA_DB_PATH: ${{ runner.temp }}/hayagarden.db
        run: python -m unittest tests.test_cc_jsonl_usage tests.test_uh_a1_step2_base_wake -v
