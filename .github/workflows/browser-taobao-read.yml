name: Browser Taobao Read Contract

on:
  pull_request:
    paths:
      - 'browser-mcp-server.js'
      - 'tools/shopping_taobao_read_adapter.py'
      - 'tools/capability_manifest.py'
      - 'tools/cc_capability_adapter.py'
      - 'tools/cc_tool_surface.py'
      - 'tests/test_browser_taobao_read_p0.py'
      - 'tests/test_browser_mcp_stdio_e2e.mjs'
      - '.github/workflows/browser-taobao-read.yml'
  push:
    branches: [main]
    paths:
      - 'browser-mcp-server.js'
      - 'tools/shopping_taobao_read_adapter.py'
      - 'tools/capability_manifest.py'
      - 'tools/cc_capability_adapter.py'
      - 'tools/cc_tool_surface.py'
      - 'tests/test_browser_taobao_read_p0.py'
      - 'tests/test_browser_mcp_stdio_e2e.mjs'
      - '.github/workflows/browser-taobao-read.yml'
  workflow_dispatch:

concurrency:
  group: browser-taobao-read-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser contract Python dependencies
        run: python -m pip install Flask Pillow Markdown python-frontmatter cryptography
      - name: Run focused browser adapter regressions
        run: python -m unittest tests.test_browser_taobao_read_p0 -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node MCP SDK
        run: npm ci
      - name: Run real browser MCP stdio E2E
        run: node tests/test_browser_mcp_stdio_e2e.mjs
