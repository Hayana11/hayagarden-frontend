name: Memory Kernel CORE-0

on:
  pull_request:
    paths:
      - "tools/memory_kernel.py"
      - "tools/memory_kernel_schema.py"
      - "tools/memory_interop.py"
      - "tests/test_memory_kernel.py"
      - "tests/test_memory_kernel_legacy_isolation.py"
      - "tests/test_memory_interop.py"
      - "docs/memory-kernel-core-0.md"
      - "docs/memory-interop-v0.1.md"
      - ".github/workflows/memory-kernel-core-0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only dependencies
        run: python -m pip install ruff==0.12.12 Flask requests Markdown -r requirements.txt
      - name: Lint CORE-0
        run: >-
          python -m ruff check
          tools/memory_kernel.py tools/memory_kernel_schema.py tools/memory_interop.py
          tests/test_memory_kernel.py tests/test_memory_kernel_legacy_isolation.py
          tests/test_memory_interop.py
      - name: Semantic, migration, and legacy isolation contracts
        run: >-
          python -m unittest
          tests.test_memory_kernel tests.test_memory_kernel_legacy_isolation
          tests.test_memory_interop -v
      - name: Whitespace check
        run: git diff --check

