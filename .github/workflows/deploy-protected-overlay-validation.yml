name: Deploy protected overlay validation

on:
  pull_request:
    paths:
      - scripts/deploy-frontend.sh
      - scripts/deploy-protected-overlay.sh
      - tests/test_deploy_protected_overlay.py
      - .github/workflows/deploy-protected-overlay-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head, merge-base, and diff whitespace
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --check "$base" "$HEAD_SHA"
          expected_files="$(cat <<'EXPECTED_FILES'
.github/workflows/deploy-protected-overlay-validation.yml
app.py
app/src/lib/chat.ts
app/src/lib/systemConfig.ts
app/src/screens/ChatScreen.tsx
app/src/screens/SettingsScreen.tsx
cc_resident.py
chat/capacity_swap.py
chat/cc_model.py
chat/cc_runtime.py
chat/claude_runtime_state.py
chat/context_window_fallback.py
chat/context_window_nightly_forge.py
deploy/systemd/hayagarden-claude-runtime-update.service
deploy/systemd/hayagarden-claude-runtime-update.timer
gateway.py
scripts/deploy-frontend.sh
scripts/ensure-claude-runtime.sh
scripts/spike_claude_forge_resume.py
static/chat.html
tests/test_cc_effort.py
tests/test_cc_model.py
tests/test_cc_runtime.py
tests/test_claude_forge_integration.py
tests/test_context_window_nightly_forge.py
tools/bootstrap_claude_native_runtime.py
tools/cc_usage_observability.py
tools/claude_forge_live_gate.py
tools/claude_runtime_updater.py
tools/context_window_admin.py
EXPECTED_FILES
          )"
          actual_files="$(git diff --name-only "$base" "$HEAD_SHA" | LC_ALL=C sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "Unexpected PR file set." >&2
            diff -u <(printf '%s\\n' "$expected_files") <(printf '%s\\n' "$actual_files") >&2 || true
            exit 1
          fi

      - name: Verify source boundary
        shell: bash
        run: |
          set -euo pipefail
          helper=scripts/deploy-protected-overlay.sh
          deploy=scripts/deploy-frontend.sh
          test "$(grep -Fxc "readonly PROTECTED_OVERLAY_PATH_A='artifacts/treegpt-cache-probe-baseline.json'" "$helper")" = 1
          test "$(grep -Fxc "readonly PROTECTED_OVERLAY_PATH_B='artifacts/treegpt-cache-probe-live.json'" "$helper")" = 1
          if grep -nE '(^|[^[:alnum:]_])(eval|curl|systemctl|DEPLOYED_SHA|git[[:space:]]+(fetch|pull|push)|reset|restore|checkout)([^[:alnum:]_]|$)' "$helper"; then
            echo "forbidden deployment primitive in source-only helper" >&2
            exit 1
          fi
          if grep -nE '(^|[^[:alnum:]_])\$\@|PROTECTED_OVERLAY_PATH_[A-Z_]+[[:space:]]*=' "$helper" | grep -vE 'PROTECTED_OVERLAY_PATH_[AB][[:space:]]*='; then
            echo "caller-extensible path surface detected" >&2
            exit 1
          fi
          test "$(grep -Fxc 'source "$ROOT/scripts/deploy-protected-overlay.sh"' "$deploy")" = 0
          grep -Fq 'dirname -- "${BASH_SOURCE[0]}"' "$deploy"
          grep -Fq 'OVERLAY_HELPER="$DEPLOY_SCRIPT_DIR/deploy-protected-overlay.sh"' "$deploy"
          grep -Fq 'source "$OVERLAY_HELPER"' "$deploy"
          if grep -nE 'OVERLAY_HELPER=.*ROOT|source[[:space:]]+.*ROOT' "$deploy"; then
            echo "helper authority may use production ROOT" >&2
            exit 1
          fi

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-frontend.sh
          bash -n scripts/deploy-protected-overlay.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run behavioral and runtime tests
        shell: bash
        run: python -m unittest -v tests.test_deploy_protected_overlay
