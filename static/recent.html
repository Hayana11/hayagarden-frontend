<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>recent · 近期</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg1:#fdf8ef;--bg2:#f7f0e4;
  --card:rgba(255,255,255,0.65);--card-b:rgba(255,255,255,0.9);
  --text:#3a2e28;--muted:#9a8a7a;--hint:#b8a090;
  --primary-bg:rgba(124,106,138,0.15);--primary:#5a4a6a;--primary-dot:#7c6a8a;
  --amber:rgba(212,165,116,0.85);--amber-s:#d4a574;
  --div:rgba(210,185,155,0.2);
  --tag-off:rgba(255,255,255,0.6);--tag-off-b:rgba(210,185,155,0.3);
}
html,body{height:100%;overflow:hidden;}
body{background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--text);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;}
.hd{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:52px 18px 12px;background:rgba(253,248,239,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--div);position:sticky;top:0;z-index:30;}
.hd-left{display:flex;align-items:center;gap:10px;}
.back{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;display:flex;}
.hd-title{font-family:Georgia,'Times New Roman',serif;font-size:18px;color:var(--text);font-weight:700;}
.hd-sub{font-size:11px;color:var(--hint);margin-top:1px;letter-spacing:.4px;}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--amber);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(212,165,116,.3);}
.scroll{flex:1;overflow-y:auto;padding:14px 16px calc(72px + env(safe-area-inset-bottom,0px));}
.scroll::-webkit-scrollbar{display:none;}
.sec-t{font-size:10px;letter-spacing:3px;color:var(--hint);margin:4px 0 10px;padding:0 2px;}
.tags-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px;}
.tags-row::-webkit-scrollbar{display:none;}
.tag{flex-shrink:0;padding:6px 14px;border-radius:50px;background:var(--tag-off);border:1px solid var(--tag-off-b);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.tag.act{background:var(--primary-bg);border-color:rgba(124,106,138,.25);color:var(--primary);}
.search-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.search-box{flex:1;padding:9px 14px;border-radius:20px;border:1px solid rgba(210,185,155,.25);background:rgba(255,255,255,.6);font-size:13px;font-family:inherit;color:var(--text);outline:none;}
.search-box::placeholder{color:var(--hint);}
.search-box:focus{border-color:rgba(212,165,116,.5);}
.view-btns{display:flex;gap:4px;flex-shrink:0;}
.vbtn{padding:7px 11px;border-radius:50px;border:1px solid var(--tag-off-b);background:var(--tag-off);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;}
.vbtn.act{background:var(--primary-bg);border-color:rgba(124,106,138,.25);color:var(--primary);}
.mlabel{font-size:11px;color:var(--hint);display:flex;align-items:center;gap:8px;margin:14px 0 8px;letter-spacing:.3px;}
.mlabel::after{content:'';flex:1;height:1px;background:var(--div);}
.mitem{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--div);cursor:pointer;}
.mitem:last-child{border-bottom:none;}
.mdot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--primary-dot);margin-top:6px;}
.mdot.resolved{background:var(--amber-s);}
.mright{flex:1;min-width:0;}
.mpreview{font-size:13px;line-height:1.7;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.mitem.open .mpreview{display:none;}
.mfull{display:none;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-all;}
.mitem.open .mfull{display:block;}
.mmeta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px;}
.mtag{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--primary-bg);color:var(--primary);}
.mdate{font-size:10px;color:var(--hint);margin-left:auto;}
.mpencil{background:none;border:none;color:var(--hint);font-size:14px;cursor:pointer;padding:2px 4px;margin-left:2px;line-height:1;transition:color .15s;vertical-align:middle;}
.mpencil:hover{color:var(--amber-s);}
.medit-ta{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--amber-s);background:rgba(255,255,255,.75);font-size:13px;font-family:inherit;color:var(--text);resize:none;outline:none;min-height:80px;line-height:1.6;margin-top:4px;}
.medit-row{display:flex;gap:8px;margin-top:7px;}
.medit-save{padding:5px 14px;border:none;border-radius:8px;background:var(--amber);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;}
.medit-cancel{padding:5px 12px;border:1px solid var(--tag-off-b);border-radius:8px;background:var(--tag-off);color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;}
.mactions{display:none;padding-top:8px;gap:10px;align-items:center;}
.mitem.open .mactions{display:flex;}
.mac{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:3px;padding:4px 0;}
.mac:hover{color:var(--text);}
.mac i{font-size:14px;}
.tag-edit{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tag-edit .te{padding:4px 11px;border-radius:50px;border:1px solid var(--tag-off-b);background:var(--tag-off);color:var(--muted);font-size:11px;cursor:pointer;}
.tag-edit .te.sel{background:var(--primary-bg);border-color:rgba(124,106,138,.25);color:var(--primary);}
.hmap{display:none;}
.hmap.show{display:block;}
.hmap-month{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px;}
.hmap-t{font-size:11px;color:var(--hint);margin:10px 0 6px;letter-spacing:.3px;}
.hday{width:calc((100% - 18px)/7);aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);cursor:pointer;}
.hday:hover{border:1px solid rgba(124,106,138,.4);}
.hday.today{border:1.5px solid var(--primary-dot);color:var(--primary);font-weight:700;}
.hwd2{width:calc((100% - 18px)/7);text-align:center;font-size:9px;color:var(--hint);padding:2px 0;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(253,248,239,0.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--div);display:flex;z-index:50;padding:7px 0 calc(7px + env(safe-area-inset-bottom,0px));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:var(--hint);font-size:10px;letter-spacing:.4px;font-family:inherit;padding:4px 0;transition:color .18s;}
.ni i{font-size:21px;}
.ni.act{color:var(--primary);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center;padding:24px;}
.mo.show{display:flex;}
.mb{background:rgba(255,255,255,.97);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:82vh;display:flex;flex-direction:column;}
.mb h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;}
.mb textarea{flex:1;min-height:120px;padding:12px;border-radius:12px;border:1px solid var(--tag-off-b);background:rgba(255,255,255,.7);font-size:14px;font-family:inherit;color:var(--text);resize:none;outline:none;}
.mb textarea:focus{border-color:rgba(212,165,116,.6);}
.mb-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.mb-tag{padding:5px 12px;border-radius:50px;border:1px solid var(--tag-off-b);background:var(--tag-off);color:var(--muted);font-size:12px;cursor:pointer;}
.mb-tag.sel{background:var(--primary-bg);border-color:rgba(124,106,138,.25);color:var(--primary);}
.mb-send{padding:11px;border:none;border-radius:11px;background:var(--amber);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;}
.tbadge{font-size:10px;padding:2px 8px;border-radius:8px;}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-left">
    <button class="back" onclick="history.back()"><i class="ti ti-arrow-left"></i></button>
    <div><div class="hd-title">recent</div><div class="hd-sub">近期</div></div>
  </div>
</div>
<div class="scroll">
  <div class="sec-t">last 30 days</div>
  <div class="tags-row" id="tags-row">
    <div class="tag act" data-tag="">全部</div>
    <div class="tag" data-tag="日记">日记</div>
    <div class="tag" data-tag="想你了">想你了</div>
    <div class="tag" data-tag="漂流瓶">漂流瓶</div>
    <div class="tag" data-tag="情绪">情绪</div>
    <div class="tag" data-tag="色色">色色</div>
  </div>
  <div class="search-row">
    <input class="search-box" id="search-box" placeholder="搜索…" oninput="onSearch()">
  </div>
  <div id="list-view"></div>
</div>
<nav class="bnav">
  <a class="ni" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni" href="/calendar"><i class="ti ti-calendar"></i><span>calendar</span></a>
  <a class="ni" href="/read"><i class="ti ti-book"></i><span>read</span></a>
  <a class="ni" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>
<script>
var posts=[],drifts=[],curTag='',curSearch='';
var expandedId=null,editingId=null;
var TYPE_BADGE={
  DIARY:['rgba(212,165,116,.15)','#a07040','日记'],
  MISS:['rgba(200,100,100,.10)','#c07070','想你了']
};

document.querySelectorAll('#tags-row .tag').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('#tags-row .tag').forEach(function(x){x.classList.remove('act');});
    this.classList.add('act');curTag=this.dataset.tag;render();
  });
});
function onSearch(){curSearch=document.getElementById('search-box').value.toLowerCase();render();}

async function load(){
  var [r1,r2,r3]=await Promise.all([
    fetch('/api/posts?type=DIARY&limit=500'),
    fetch('/api/posts?type=MISS&limit=500'),
    fetch('/api/drift/mine')
  ]);
  var d1=await r1.json(),d2=await r2.json(),d3=await r3.json();
  var cutoff=Date.now()-30*864e5;
  var ts=function(s){return s?new Date(s.replace(' ','T')).getTime():0;};
  var diary=(d1.posts||[]).filter(function(p){return ts(p.created_at)>=cutoff;});
  var miss=(d2.posts||[]).filter(function(p){return ts(p.created_at)>=cutoff;});
  posts=diary.concat(miss).sort(function(a,b){return b.id-a.id;});
  drifts=(d3.bottles||[]).filter(function(b){return ts(b.created_at)>=cutoff;});
  render();
}

function filteredItems(){
  var items;
  var ts=function(s){return s?new Date(s.replace(' ','T')).getTime():0;};
  if(curTag==='漂流瓶'){
    items=drifts.map(function(b){var o=Object.assign({},b);o._isDrift=true;return o;});
  }else if(curTag==='日记'){
    items=posts.filter(function(p){return p.type==='DIARY';});
  }else if(curTag==='想你了'){
    items=posts.filter(function(p){return p.type==='MISS';});
  }else if(curTag==='情绪'||curTag==='色色'){
    items=posts.filter(function(p){return(p.tags||'').includes(curTag);});
  }else{
    var dd=drifts.map(function(b){var o=Object.assign({},b);o._isDrift=true;return o;});
    items=posts.concat(dd).sort(function(a,b){return ts(b.created_at)-ts(a.created_at);});
  }
  if(curSearch){
    items=items.filter(function(p){return(p.content||'').toLowerCase().includes(curSearch);});
  }
  return items;
}

function toggleItem(id,e){
  if(e&&e.target.closest('.mactions,.tag-edit,.mac,.medit-ta,.medit-row,.mpencil'))return;
  if(editingId===id)return;
  if(editingId!==null){editingId=null;}
  expandedId=(expandedId===id?null:id);
  render();
  setTimeout(function(){var el=document.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
function toggleDrift(uid,e){expandedId=(expandedId===uid?null:uid);render();}
function startEdit(id,e){
  e.stopPropagation();editingId=id;expandedId=id;render();
  setTimeout(function(){var ta=document.getElementById('eta-'+id);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},30);
}
function cancelEdit(e){e.stopPropagation();editingId=null;render();}
async function saveEdit(id,e){
  e.stopPropagation();
  var ta=document.getElementById('eta-'+id);if(!ta)return;
  var c=ta.value.trim();if(!c)return;
  var p=posts.find(function(x){return x.id===id;});if(p)p.content=c;
  await fetch('/api/posts/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});
  editingId=null;render();
}
function fmtDate(dt){if(!dt)return'';var d=new Date(dt.replace(' ','T'));return(d.getMonth()+1)+'.'+d.getDate();}
function monthKey(dt){if(!dt)return'';var d=new Date(dt.replace(' ','T'));return d.getFullYear()+'.'+(d.getMonth()+1);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stripThinking(s){
  s = (s||'').replace(/<thinking>[\s\S]*?<\/thinking>\s*/g,'');
  // 未闭合的<thinking>（输出被截断）：连带其后内容一起去掉，只保留前面真正写出的正文
  s = s.replace(/<thinking>[\s\S]*$/,'');
  return s.trim();
}
function dispHtml(disp){
  return disp ? escHtml(disp) : '<span style="opacity:.4;font-style:italic">（这条记录没有可显示的内容）</span>';
}
function typeBadge(p){
  var m=TYPE_BADGE[p.type];
  if(!m)return'';
  return'<span class="tbadge" style="background:'+m[0]+';color:'+m[1]+'">'+m[2]+'</span>';
}
function buildItem(p){
  var isOpen=expandedId===p.id,isEditing=editingId===p.id;
  var h='<div class="mitem'+(isOpen||isEditing?' open':'')+'" data-id="'+p.id+'" onclick="toggleItem('+p.id+',event)">';
  h+='<div class="mdot"></div><div class="mright">';
  if(isEditing){
    h+='<textarea class="medit-ta" id="eta-'+p.id+'" onclick="event.stopPropagation()">'+escHtml(p.content)+'</textarea>';
    h+='<div class="medit-row"><button class="medit-save" onclick="saveEdit('+p.id+',event)">保存</button><button class="medit-cancel" onclick="cancelEdit(event)">取消</button></div>';
  } else {
    var disp=stripThinking(p.content);
    h+='<div class="mpreview">'+dispHtml(disp)+'</div>';
    h+='<div class="mfull">'+dispHtml(disp)+'</div>';
  }
  h+='<div class="mmeta">'+typeBadge(p)+'<span class="mdate">'+fmtDate(p.created_at)+'</span>';
  if(!isEditing)h+='<button class="mpencil" onclick="startEdit('+p.id+',event)"><i class="ti ti-pencil"></i></button>';
  h+='</div></div></div>';
  return h;
}
function buildDriftItem(b){
  var uid='d'+b.id,isOpen=expandedId===uid;
  var found=b.status==='found';
  var sBg=found?'rgba(100,160,120,.15)':'rgba(212,165,116,.15)';
  var sColor=found?'#407050':'#a07040';
  var sLabel=found?'已找到':'漂流中';
  var h='<div class="mitem'+(isOpen?' open':'')+'" data-id="'+uid+'" onclick="toggleDrift(\''+uid+'\',event)">';
  h+='<div class="mdot" style="background:var(--amber-s)"></div><div class="mright">';
  var disp=stripThinking(b.content);
  h+='<div class="mpreview">'+dispHtml(disp)+'</div>';
  h+='<div class="mfull">'+dispHtml(disp)+'</div>';
  if(isOpen&&b.reply){
    var rd=stripThinking(b.reply);
    h+='<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(124,106,138,.08);font-size:12px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-all;">';
    h+='<span style="font-size:10px;color:var(--primary);display:block;margin-bottom:4px;">费奥多尔的回应</span>';
    h+=escHtml(rd)+'</div>';
  }
  h+='<div class="mmeta"><span class="tbadge" style="background:'+sBg+';color:'+sColor+'">'+sLabel+'</span>';
  h+='<span class="mdate">'+fmtDate(b.created_at)+'</span></div></div></div>';
  return h;
}
function render(){
  var list=filteredItems(),c=document.getElementById('list-view');
  if(!list.length){c.innerHTML='<div style="text-align:center;color:var(--hint);padding:32px 0;font-size:13px;">暂无记录</div>';return;}
  var html='',lm='';
  list.forEach(function(p){
    var mo=monthKey(p.created_at);
    if(mo!==lm){html+='<div class="mlabel">'+mo+'</div>';lm=mo;}
    html+=p._isDrift?buildDriftItem(p):buildItem(p);
  });
  c.innerHTML=html;
}
load();
</script>
</body>
</html>
