    if(fullText&&document.hidden) notify('Fyodor',fullText.slice(0,50));
  }catch(e){ if(!(e&&e.displayed)) console.error('retryStream',e); }
  hideTyping();
  sending=false; setSendBtn('send');
}

async function streamReply(){
  streamState.cacheRead=0; streamState.cacheCreate=0; streamState.cacheCreate5m=0; streamState.cacheCreate1h=0; streamState.inputTokens=0; streamState.outputTokens=0; streamState.elapsedSec=0; streamState.cacheSupported=null; streamState.costUsd=0; streamState.costEstimated=false;
  window._earlyThinkSummary=null;
  await clearStaleGenLock();
  var ctrl=new AbortController(); streamAbort=ctrl;
  // 空闲超时：有事件就续命，只有真死掉的连接才被掐（原来固定5分钟，生成长HTML必超）
  var _safetyTimeout=null;
  function _armSafety(ms){
    clearTimeout(_safetyTimeout);
    _safetyTimeout=setTimeout(function(){ctrl.abort();}, ms||150000);
  }
  _armSafety();
  setSendStatus('正在等待模型…','working');
  var turnBody=pendingGwUserMessageId?{user_message_id:pendingGwUserMessageId}:{};
  var resp=await fetch('/api/gw/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(turnBody),signal:ctrl.signal});
  if(!resp.ok||!resp.body) throw new Error('stream failed');
  var SSE_SEP=String.fromCharCode(10)+String.fromCharCode(10);
  var reader=resp.body.getReader(), decoder=new TextDecoder();
  var buf='', target='', shown=0, err=null;
  var streamCompleted=false;
  var streamAborted=false;
  var live=null, liveThinkWrap=null, liveThinkBody=null, liveTools=null;
  var thinkText='', cacheInfo=null, liveToolCalls=[];
  var c=document.getElementById('msgs');

  function ensureLiveRow(){
    if(live) return;
    hideTyping();
    c.insertAdjacentHTML('beforeend',
      '<div class="msg-row fy" id="live-row"><div class="bwrap">'+
        '<div id="live-memory"></div>'+
        '<div class="live-think-wrap" id="live-think-wrap" style="display:none">'+
          '<div class="live-think-hd" onclick="toggleLiveThink(this)"><i class="ti ti-brain think-brain-pulse"></i><span class="think-summary-text" style="opacity:.5;font-style:italic">思考中…</span>'+
          '<span class="live-think-cursor"></span><i class="ti ti-chevron-right lt-chevron"></i></div>'+
          '<div class="live-think-body" id="live-think-body"></div>'+
        '</div>'+
        '<div id="live-tools"></div>'+
        '<div class="bubble fy" id="live-bubble"></div>'+
      '</div></div>');
    live=document.getElementById('live-bubble');
    liveThinkWrap=document.getElementById('live-think-wrap');
    liveThinkBody=document.getElementById('live-think-body');
    liveTools=document.getElementById('live-tools');
  }

  function renderLiveTools(running){
    if(!liveTools) return;
    var wasOpen = liveTools.querySelector('.tsess.open') != null;
    liveTools.innerHTML = buildToolCallsHtml(liveToolCalls, {running:!!running, open:wasOpen});
    var atB=c.scrollHeight-c.scrollTop-c.clientHeight<120;
    if(atB) c.scrollTop=c.scrollHeight;
  }

  function maybeFetchToolCaption(idx){
    if(thinkText) return; // 有思考的轮次不请求 caption——思考流本身就是最好的摘要（省钱）
    var tc=liveToolCalls[idx];
    if(!tc || tc.running || CODE_TOOLS[tc.name] || tc.caption) return; // 代码工具的 tsess 终端行已有路径信息
    fetch('/api/gw/tool-caption',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool_name:tc.name,tool_input:tc.args||{},tool_output:String(tc.result||'').slice(0,400),success:tc.success!==false})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(!j||!j.caption) return;
      tc.caption=j.caption;
      renderLiveTools(liveToolCalls.some(function(t){return t.running;}));
    }).catch(function(){});
  }

  function finishLiveThink(){
    if(!liveThinkWrap || liveThinkWrap.classList.contains('done')) return;
    liveThinkWrap.classList.add('done');
    var st=liveThinkWrap.querySelector('.think-summary-text');
    if(st && thinkText){
      st.style.opacity=''; st.style.fontStyle='';
      st.textContent='思考了 '+thinkText.length+' 字';
      // 思考一结束就抢先生成摘要（正文还在流），结果同时缓存给流结束后的存库逻辑
      window._earlyThinkSummary = (async function(){
        try{
          var ac=new AbortController(); var tid=setTimeout(function(){ac.abort();},28000);
          var r=await fetch('/api/think/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thinking:thinkText.slice(0,3000)}),signal:ac.signal});
          clearTimeout(tid);
          var d=await r.json(); var s=(d.summary||'').trim();
          if(s && s.length<=40 && st){ st.textContent=s; }
          return s||null;
        }catch(e){ return null; }
      })();
    }
  }

  var timer=setInterval(function(){
    if(shown>=target.length) return;
    if(/<(div|details|summary|span)\b[^>]*style\s*=/i.test(target)){
      shown=target.length;
      live.innerHTML=renderContent(target,true);
    } else {
      shown=Math.min(target.length, shown+1);
      live.innerHTML=escHtml(target.slice(0,shown));
    }
    var atB=c.scrollHeight-c.scrollTop-c.clientHeight<120;
    if(atB) c.scrollTop=c.scrollHeight;
  }, Math.round(1000/TW_CPS));

  try{
    while(true){
      var chunk;
      try{ chunk=await reader.read(); }
      catch(re){
        if(re && re.name==='AbortError'){ streamAborted=true; break; }
        throw re;
      }
      if(chunk.done) break;
      _armSafety();
      buf+=decoder.decode(chunk.value,{stream:true});
      var parts=buf.split(SSE_SEP); buf=parts.pop();
      for(var i=0;i<parts.length;i++){
        var line=parts[i].trim();
        if(line.indexOf('data:')!==0) continue;
        var ev; try{ ev=JSON.parse(line.slice(5)); }catch(e){ continue; }
        if(ev.t==='memory_recall'){
          setSendStatus('正在整理记忆…','working');
          ensureLiveRow();
          var md=ev.d||{};
          if(md.count){
            var mitems=(md.items||[]).map(function(it){
              return '<div class="mem-recall-item">['+escHtml(it.type||'')+' '+escHtml(it.date||'')+'] '+escHtml(it.preview||'')+'…</div>';
            }).join('');
            document.getElementById('live-memory').innerHTML=
              '<div class="mem-recall-pill">'+
                '<button class="mem-recall-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\');this.classList.toggle(\'open\')">'+
                  '<i class="ti ti-chevron-right"></i><i class="ti ti-sparkles"></i>回忆起 '+md.count+' 条记忆'+
                '</button>'+
                '<div class="mem-recall-body">'+mitems+'</div>'+
              '</div>';
          }
        } else if(ev.t==='think'){
          setSendStatus('正在思考…','working');
          ensureLiveRow();
          thinkText+=ev.d;
          liveThinkWrap.style.display='';
          liveThinkBody.textContent=thinkText;
          var atB=c.scrollHeight-c.scrollTop-c.clientHeight<120;
          if(atB) c.scrollTop=c.scrollHeight;
        } else if(ev.t==='tool_progress'){
          setSendStatus('正在使用工具…','tools');
          ensureLiveRow();
          finishLiveThink();
          _armSafety(300000);
          var pd=ev.d||{};
          var ptxt='正在生成 '+(TOOL_LABELS[pd.name]||pd.name||'内容')+' · '+((pd.chars||0)/1024).toFixed(1)+' KB…';
          var pl=document.getElementById('tool-progress-line');
          if(!pl){
            liveTools.insertAdjacentHTML('beforeend','<div class="trace-summary-line" id="tool-progress-line"><i class="ti ti-loader-2 tool-spin"></i> <span></span></div>');
            pl=document.getElementById('tool-progress-line');
          }
          pl.querySelector('span').textContent=ptxt;
          var atB2=c.scrollHeight-c.scrollTop-c.clientHeight<120;
          if(atB2) c.scrollTop=c.scrollHeight;
        } else if(ev.t==='tool_use'){
          setSendStatus('正在调用工具…','tools');
          ensureLiveRow();
          finishLiveThink();
          _armSafety(300000);
          var d=ev.d||{};
          liveToolCalls.push({name:d.name, args:d.args, running:true});
          renderLiveTools(true);
        } else if(ev.t==='tool_result'){
          setSendStatus('工具完成 · 继续生成…','tools');
          _armSafety(300000);
          var ti=(ev.idx!==undefined && ev.idx>=0 && ev.idx<liveToolCalls.length)?ev.idx:liveToolCalls.length-1;
          if(ti>=0 && ev.d) liveToolCalls[ti]=ev.d;
          renderLiveTools(liveToolCalls.some(function(t){return t.running;}));
          maybeFetchToolCaption(ti);
          if(ti>=0 && ev.d && ev.d.name==='ws_job'){
            try{
              var jr=JSON.parse(ev.d.result||'{}');
              if(jr.id && (jr.status==='started' || jr.ok)) armWsJobPoll();
            }catch(e){}
          }
        } else if(ev.t==='notice'){
          if(ev.d) showToast(ev.d);
        } else if(ev.t==='workspace_job'){
          handleWorkspaceJobSse(ev);
        } else if(ev.t==='trace_summary'){
          setSendStatus('正在整理工具结果…','tools');
          if(liveTools && ev.d)
            liveTools.insertAdjacentHTML('beforeend',
              '<div class="trace-summary-line"><i class="ti ti-route"></i> '+escHtml(ev.d)+'</div>');
        } else if(ev.t==='tool_call'){
          setSendStatus('正在记录工具调用…','tools');
          if(ev.dup) continue; // gateway 为旧缓存前端补发的副本，新前端已渲染过
          // 兼容旧gateway：单事件=完成态
          ensureLiveRow();
          finishLiveThink();
          liveToolCalls.push(ev.d);
          renderLiveTools(true);
        } else if(ev.t==='text'){
          setSendStatus('正在生成回复…','working');
          finishLiveThink();
          target+=ev.d;
        } else if(ev.t==='usage'){
          streamState.cacheRead+=ev.cache_read||0;
          streamState.cacheCreate+=ev.cache_creation||0;
          streamState.cacheCreate5m+=ev.cache_creation_5m||0;
          streamState.cacheCreate1h+=ev.cache_creation_1h||0;
          if(ev.input_tokens) streamState.inputTokens=Math.max(streamState.inputTokens,ev.input_tokens);
          if(ev.output_tokens) streamState.outputTokens=Math.max(streamState.outputTokens,ev.output_tokens);
          if(ev.elapsed_sec) streamState.elapsedSec=Math.max(streamState.elapsedSec,ev.elapsed_sec);
          if(ev.cache_supported!==undefined) streamState.cacheSupported=ev.cache_supported;
          if(ev.cost_usd) streamState.costUsd=Number(ev.cost_usd)||0;
          if(ev.cost_estimated!==undefined) streamState.costEstimated=!!ev.cost_estimated;
        } else if(ev.t==='err'){
          setSendStatus('生成失败','error');
          ensureLiveRow();
          if(/仍在生成|generating/i.test(String(ev.d||''))) releaseGenLock(true);
          live.innerHTML='<div class="stream-err-wrap">⚠ '+escHtml(ev.d)+
            '<br><button class="stream-err-retry" onclick="retryStream()">重试</button></div>';
          err=new Error(ev.d); err.displayed=true;
        } else if(ev.t==='done'){
          setSendStatus('回复完成','working');
          streamCompleted=true;
        }
      }
      if(err) break;
    }
    while(!err && shown<target.length){ await new Promise(function(r){setTimeout(r,80);}); }
  } finally {
    clearInterval(timer);
    clearTimeout(_safetyTimeout);
    streamAbort=null;
    if(thinkText&&liveThinkWrap&&!liveThinkWrap.classList.contains('done')) finishLiveThink();
    if(streamAborted&&!streamCompleted) releaseGenLock(true);
    if(streamCompleted) pendingGwUserMessageId=null;
  }
  if(err) throw err;
  // 注：缓存信息现在跟随消息持久化(cache_info列)，由loadMsgs()重新渲染时正确显示，
  // 不再在这里临时插DOM——那样会被随后的loadMsgs()刷新整体覆盖掉。
  return {text: target, thinkBuf: thinkText};
}

// ── Drift reply notification ──
function notifyNewDriftReplies(bottles){
  var found=bottles.filter(function(b){return b.status==='found'&&b.reply;}).map(function(b){return b.id;});
  if(localStorage.getItem('driftSeen')===null){
    localStorage.setItem('driftSeen',JSON.stringify(found));
    return;
  }
  var seen=[];
  try{ seen=JSON.parse(localStorage.getItem('driftSeen')||'[]'); }catch(e){}
  var fresh=found.filter(function(id){return seen.indexOf(id)===-1;});
  if(fresh.length){
    var b=bottles.find(function(x){return x.id===fresh[0];});
    notify('漂流瓶被捡到了','费奥多尔回信："'+(b?b.reply.slice(0,50):'')+'…"');
    localStorage.setItem('driftSeen',JSON.stringify(found));
  }
}

// ── Floating bottles list ──
function timeAgo(dt){
  try{
    var d=new Date(String(dt).replace(' ','T'));
    var mins=Math.max(1,Math.round((Date.now()-d.getTime())/60000));
    if(mins<60) return mins+' 分钟前';
    var h=Math.round(mins/60); if(h<24) return h+' 小时前';
    return Math.round(h/24)+' 天前';
  }catch(e){ return ''; }
}
async function loadFloating(){
  var el=document.getElementById('drift-floating');
  el.innerHTML='';
  try{
    var r=await fetch('/api/drift/bottles');
    var d=await r.json();
    var fl=(d.bottles||[]).filter(function(b){return b.status==='floating';});
    el.innerHTML=fl.map(function(b){
      return '<div class="drift-float-item"><i class="ti ti-ripple"></i>投出于 '+timeAgo(b.created_at)+' · 还在漂\u2026</div>';
    }).join('');
  }catch(e){}
}

var sheetMsg=null, lpTimer=null;
var msgsEl=document.getElementById('msgs');
msgsEl.addEventListener('touchstart',function(e){

  if(!row||row.dataset.idx===undefined) return;

},{passive:true});

function openSheet(idx){
  var list=window.curMsgList||[];
  if(!list[idx]||!(list[idx].content||'').trim()) return;
  sheetMsg=list[idx];
  document.getElementById('sheet-ov').classList.add('show');
}
function closeSheet(){ document.getElementById('sheet-ov').classList.remove('show'); }
function showToast(t){
  var el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },1800);
}
async function sheetCopy(){
  if(!sheetMsg) return;
  try{ await navigator.clipboard.writeText(sheetMsg.content); }
  catch(e){
    var ta=document.createElement('textarea'); ta.value=sheetMsg.content;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  showToast('已复制'); closeSheet();
}
async function sheetMemory(){
  if(!sheetMsg) return;
  try{
    await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'MEMORY',content:sheetMsg.content,author:isFy(sheetMsg.author)?'fyodor':'user'})});
    showToast('已收藏到回忆 \u2661');
  }catch(e){ showToast('收藏失败'); }
  closeSheet();
}
function sheetExport(fmt){
  if(!sheetMsg||!sheetMsg.id){closeSheet();return;}
  downloadMsg(sheetMsg.id, fmt||'md');
  closeSheet();
}
async function sheetDelete(){
  if(!sheetMsg||!sheetMsg.id) { closeSheet(); return; }
  closeSheet();
  if(!confirm('删除这条消息？')) return;
  try{
    await fetch('/api/chat/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({msg_id:sheetMsg.id})});
    showToast('已删除');
    loadMsgs(true);
  }catch(e){ showToast('删除失败'); }
}
// ── Timed placeholder ──
function getTimedPlaceholder() {
  var now = new Date(); var h = now.getHours(); var day = now.getDay();
  var isWeekend = (day===0||day===6);
  if(isWeekend&&h>=6&&h<11) return '周末早安，今天不用赶了……';
  if(isWeekend&&h>=11&&h<18) return '放假快乐，有什么想说的吗……';
  if(h>=23||h<4) return '这么晚了，先睡吧，说完就关眼睛……';
  if(h>=4&&h<7) return '这么早？还是一夜没睡？……';
  if(h>=7&&h<10) return '早上好，今天从哪里开始……';
  if(h>=10&&h<13) return '上午好，有什么事吗……';
  if(h>=13&&h<15) return '吃过了吗，午后来聊聊……';
  if(h>=15&&h<18) return '下午了，还在忙吗……';
  if(h>=18&&h<21) return '晚上了，今天怎么样……';
  if(h>=21&&h<23) return '快去睡了，说最后一件事……';
  return '和岛聊聊……';
}

// ── Model selector (MODEL-1A/1B: provider-aware) ──
var _modelCatalog = [];
var _curModel = '';
var _chatProvider = '';
var _modelMode = '';
function _isClaudeCodeProvider(){ return _chatProvider === 'claude_code'; }
function _modelMeta(id){ return _modelCatalog.find(function(m){return m.id===id;}) || null; }
function _modelLabel(id){ var m=_modelMeta(id); return m ? m.label : (id.replace(/\[[^\]]*\]/g,'').trim() || id); }
function _ccPillLabel(){
  if(_modelMode === 'explicit' && _curModel) return 'Claude Code · '+_modelLabel(_curModel);
  return 'Claude Code · 默认';
}
async function initModelPill() {
  try{
    var r=await fetch('/api/config/model-catalog'); var d=await r.json();
    _modelCatalog=d.models||[];
    _chatProvider=d.provider||'';
    _modelMode=d.model_mode||'';
    _curModel=d.configured_model||d.current||'';
  }catch(e){}
  renderModelSheet(false);
  updateModelPill();
  var t=document.getElementById('txt'); if(t&&!t.disabled) t.placeholder=getTimedPlaceholder();
}
function renderModelSheet(showMore){
  var sheet=document.getElementById('model-sheet');
  if(_isClaudeCodeProvider()){
    var defSel = _modelMode !== 'explicit';
    var html = '<button class="model-opt'+(defSel?' selected':'')+'" data-model="" onclick="selectModel(this)">'+
      '<span class="mo-dot" style="background:#7c6a8a"></span>默认（跟随 Claude Code）'+
      '<span class="mo-desc">不传 --model</span></button>';
    html += _modelCatalog.map(function(m){
      var sel = _modelMode==='explicit' && m.id===_curModel;
      return '<button class="model-opt'+(sel?' selected':'')+'" data-model="'+escHtml(m.id)+'" onclick="selectModel(this)">'+
        '<span class="mo-dot" style="background:'+escHtml(m.dot||'#8a8177')+'"></span>'+escHtml(m.label||m.id)+
        (m.desc?'<span class="mo-desc">'+escHtml(m.desc)+'</span>':'')+
      '</button>';
    }).join('');
    sheet.innerHTML=html;
    return;
  }
  var primary=_modelCatalog.filter(function(m){return m.primary;});
  var more=_modelCatalog.filter(function(m){return !m.primary;});
  // 当前模型不在任何列表时（手动设过奇怪值），插到顶部让它可见可选
  if(_curModel && !_modelMeta(_curModel))
    primary=[{id:_curModel,label:_modelLabel(_curModel),desc:'（不在清单中）',thinking:'extended',dot:'#999'}].concat(primary);
  function opt(m){
    return '<button class="model-opt'+(m.id===_curModel?' selected':'')+'" data-model="'+escHtml(m.id)+'" onclick="selectModel(this)">'+
      '<span class="mo-dot" style="background:'+escHtml(m.dot||'#8a8177')+'"></span>'+escHtml(m.label)+
      (m.thinking==='extended'?' <i class="ti ti-brain" style="font-size:11px;opacity:.5"></i>':'')+
      (m.desc?'<span class="mo-desc">'+escHtml(m.desc)+'</span>':'')+
    '</button>';
  }
  var html=primary.map(opt).join('');
  if(more.length){
    html+='<button class="model-opt model-more-toggle" onclick="event.stopPropagation();renderModelSheet('+(!showMore)+')"><i class="ti ti-chevron-'+(showMore?'up':'down')+'"></i>更多模型'+(showMore?'':' ('+more.length+')')+'</button>';
    if(showMore) html+=more.map(opt).join('');
  }
  sheet.innerHTML=html;
}
function updateModelPill() {
  document.getElementById('model-label').textContent=_isClaudeCodeProvider()
    ? _ccPillLabel()
    : (_modelLabel(_curModel)||'模型');
}
function toggleModelSheet() {
  document.getElementById('model-sheet').classList.toggle('show');
  if(document.getElementById('model-sheet').classList.contains('show')) renderModelSheet(false);
}
async function selectModel(btn) {
  var m=btn.dataset.model; document.getElementById('model-sheet').classList.remove('show');
  var body;
  if(_isClaudeCodeProvider()){
    // empty dataset → default (null); same explicit id → no-op
    if((!m && _modelMode!=='explicit') || (m && m===_curModel && _modelMode==='explicit')) return;
    body = {model: m ? m : null};
  } else {
    if(m===_curModel) return;
    body = {model: m};
  }
  try{
    var r=await fetch('/api/config/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(r.ok && d.ok!==false){
      _modelMode=d.model_mode||(_isClaudeCodeProvider()?(body.model?'explicit':'default'):'');
      _curModel=d.configured_model||d.model||'';
      renderModelSheet(false);updateModelPill();
      showToast(_isClaudeCodeProvider() ? '下一条消息起生效' : ('已切换到 '+_modelLabel(_curModel)));
    } else showToast('切换失败');
  }catch(e){showToast('切换失败');}
}
document.addEventListener('click',function(e){
  var sheet=document.getElementById('model-sheet');
  if(sheet&&sheet.classList.contains('show')&&!document.getElementById('model-pill').contains(e.target)) sheet.classList.remove('show');
});
initModelPill();
