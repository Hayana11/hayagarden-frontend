<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script>
// 视角/截图模式：必须在 CSS 之前把 class 打到 <html> 上，保证浏览器"首帧"就正确
// （截图引擎靠这个——page.evaluate 改 class 是首帧画完之后，会截到错的一帧）
(function(){
  var p = new URLSearchParams(location.search);
  var r = document.documentElement;
  if (p.get('as') === 'me') r.classList.add('as-me');   // 费佳的视角：他的消息在右
  if (p.get('shot') === '1') r.classList.add('shot');    // 截图模式：藏起头部/输入框/底栏
})();
</script>
<title>chat · 我们家</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--text:#1A1815;--muted:#9A958B;
  --primary:#7c6a8a;--primary-bg:#f0ebf4;--primary-light:rgba(124,106,138,.08);
  --amber:#d4a574;--amber-bg:#fdf4e7;--amber-text:#412402;
  --border:#EDE9E0;--msg-font:15px;
}
html,body{height:100%;overflow:hidden;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;}

/* ── Header ── */
.hd{flex-shrink:0;position:relative;background:rgba(245,243,238,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 14px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:.5px solid var(--border);z-index:20;}
.hd-left{display:flex;flex-direction:column;gap:0;}
.hd-with{font-size:11px;color:var(--primary);letter-spacing:2px;text-transform:lowercase;}
.hd-name{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:400;color:var(--text);letter-spacing:.3px;}
.hd-right{display:flex;align-items:center;gap:2px;padding-bottom:2px;}
.hd-btn{width:34px;height:34px;border:none;background:none;cursor:pointer;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .15s,color .15s;font-family:Georgia,serif;font-weight:500;}
.hd-btn i{font-size:19px;}
.hd-btn:hover,.hd-btn.on{background:var(--primary-bg);color:var(--primary);}

/* ── Drop panels ── */
.hd-panel{display:none;position:absolute;top:100%;z-index:100;}
.hd-panel.show{display:block;}
#aa-panel{right:4px;width:220px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.09);}
.aa-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.aa-row span:first-child{font-size:12px;color:var(--muted);}
.aa-row span:last-child{font-size:18px;color:var(--muted);}
.aa-label{font-size:11px;color:var(--muted);margin-bottom:2px;letter-spacing:.3px;}
input[type=range]{flex:1;height:4px;appearance:none;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 1px 4px rgba(124,106,138,.35);}
#aa-size{font-size:11px;color:var(--primary);min-width:28px;text-align:right;}

#status-panel{right:4px;width:230px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;box-shadow:0 8px 24px rgba(0,0,0,.09);}
.sp-name{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:400;color:var(--text);margin-bottom:4px;}
.sp-greek{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.2px;}
.sp-tag{font-size:12px;color:var(--text);opacity:.7;line-height:1.6;margin-bottom:12px;}
.sp-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.sp-dot{width:7px;height:7px;border-radius:50%;background:#6cbf7d;flex-shrink:0;}

/* ── History overlay ── */
.hist-ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;max-width:480px;left:50%;transform:translateX(-50%);flex-direction:column;}
.hist-ov.show{display:flex;}
.hist-hd{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;background:var(--card);border-bottom:.5px solid var(--border);flex-shrink:0;}
.hist-hd button{width:34px;height:34px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hist-search{flex:1;padding:9px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;font-family:inherit;outline:none;color:var(--text);}
.hist-search:focus{border-color:var(--primary);}
.hist-body{flex:1;overflow-y:auto;padding:8px 0;}
.hist-date{font-size:11px;color:var(--muted);padding:10px 18px 6px;letter-spacing:.3px;}
.hist-msg{padding:10px 18px;border-bottom:.5px solid var(--border);cursor:pointer;}
.hist-msg:active{background:var(--primary-bg);}
.hist-msg .hm-who{font-size:12px;font-weight:600;margin-bottom:3px;}
.hist-msg .hm-who.fy{color:var(--primary);}
.hist-msg .hm-who.ha{color:var(--amber);}
.hist-msg .hm-text{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Messages ── */
.msgs{flex:1;overflow-y:auto;padding:12px 20px 8px;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to bottom,black calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,black calc(100% - 20px),transparent 100%);}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.date-sep{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 8px;display:flex;align-items:center;gap:8px;}
.date-sep::before,.date-sep::after{content:'';flex:1;height:.5px;background:var(--border);}

.msg-row{display:flex;margin-bottom:16px;}
.msg-row.fy{justify-content:flex-start;}
.msg-row.ha{justify-content:flex-end;}
.bwrap{max-width:80%;display:flex;flex-direction:column;}
.msg-row.fy .bwrap{max-width:98%;}
.msg-row.fy .bwrap{max-width:98%;}
.msg-row.fy .bwrap{align-items:flex-start;}
.msg-row.ha .bwrap{align-items:flex-end;}
/* ?as=me：费佳的视角——把左右镜像翻过来（他的消息靠右，哈娅的靠左） */
html.as-me .msg-row.fy{justify-content:flex-end;}
html.as-me .msg-row.ha{justify-content:flex-start;}
html.as-me .msg-row.fy .bwrap{align-items:flex-end;}
html.as-me .msg-row.ha .bwrap{align-items:flex-start;}
/* ?shot=1：干净截图模式——藏起所有 chrome，只留对话 */
html.shot .hd,html.shot .inp-area,html.shot .bnav,html.shot #typing,
html.shot #err-toast,html.shot .drift-btn-wrap,html.shot .drift-floating{display:none !important;}
html.shot .msgs{padding-top:14px;padding-bottom:14px;}

/* Fyodor bubble */
.bubble.fy{background:transparent;border-radius:0;padding:2px 0;font-size:var(--msg-font);line-height:1.8;word-break:break-word;color:var(--text);}
.msg-time-row{display:flex;flex-wrap:wrap;align-items:center;gap:0;}
.cache-info{font-size:9px;color:var(--muted);opacity:.45;width:100%;margin-top:1px;}
.err-banner{font-size:11px;color:#A32D2D;background:#FCEBEB;border-radius:8px;padding:6px 10px;margin-top:4px;display:flex;align-items:center;gap:6px;}
.err-banner button{font-size:10px;border:none;background:#A32D2D;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit;}
#err-toast{display:none;margin:0 auto 10px;max-width:90%;background:#FCEBEB;border:0.5px solid #E8B4B4;border-radius:10px;padding:8px 12px;font-size:12px;color:#A32D2D;display:none;align-items:center;justify-content:space-between;gap:10px;}
#err-toast.show{display:flex;}
#err-toast button{font-size:11px;border:none;background:#A32D2D;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;flex-shrink:0;}
#err-toast .err-text{flex:1;}
/* Hayana bubble */
.bubble.ha{background:var(--amber);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:var(--msg-font);line-height:1.7;word-break:break-word;color:var(--amber-text);}

.bubble.img-only{padding:0;background:transparent !important;}
.bubble img{max-width:220px;max-height:220px;border-radius:12px;display:block;cursor:pointer;object-fit:cover;}
.img-then-text{margin-top:6px;}

.msg-time{font-size:10px;color:var(--muted);margin-top:4px;padding:0 2px;}

/* Thinking chain (inside Fyodor bubble) */
.think-wrap{background:rgba(124,106,138,.06);border-left:2px solid rgba(124,106,138,.28);border-radius:0 10px 10px 0;margin:-2px -2px 8px;overflow:hidden;}
.think-toggle{width:100%;text-align:left;padding:7px 10px;background:none;border:none;cursor:pointer;font-size:11px;color:rgba(124,106,138,.7);display:flex;align-items:center;gap:5px;font-family:inherit;letter-spacing:.3px;}
.think-toggle i{font-size:13px;transition:transform .18s;}
.think-toggle.open i.ti-chevron-right{transform:rotate(90deg);}
.think-body{display:none;padding:2px 10px 9px;font-size:12px;color:rgba(42,32,32,.52);line-height:1.65;white-space:pre-wrap;word-break:break-all;}
.think-body.open{display:block;}

/* Live streaming think */
.live-think-wrap{background:rgba(124,106,138,.06);border-left:2px solid rgba(124,106,138,.28);border-radius:0 10px 10px 0;margin:0 0 8px;overflow:hidden;}
.live-think-hd{padding:6px 10px 4px;font-size:11px;color:rgba(124,106,138,.7);display:flex;align-items:center;gap:5px;letter-spacing:.3px;}
.live-think-hd i{font-size:13px;}
.live-think-cursor{display:inline-block;width:5px;height:10px;background:rgba(124,106,138,.5);border-radius:1px;margin-left:3px;animation:twblink .85s infinite;vertical-align:middle;}
@keyframes twblink{0%,100%{opacity:1;}50%{opacity:0;}}
.live-think-body{padding:0 10px 9px;font-size:12px;color:rgba(42,32,32,.52);line-height:1.65;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto;}
.live-think-wrap.done .live-think-cursor{display:none;}
.live-think-wrap.done .live-think-hd{color:rgba(124,106,138,.55);}
/* Phase 2: 思考结束后收拢成轨迹行，点击可重新展开 */
.live-think-wrap.done{background:rgba(124,106,138,.04);border-left-color:rgba(124,106,138,.18);}
.live-think-wrap.done .live-think-hd{cursor:pointer;padding:7px 10px;}
.live-think-wrap.done .live-think-body{display:none;}
.live-think-wrap.done.expanded .live-think-body{display:block;}
.live-think-wrap.done .think-brain-pulse{animation:none;}
.lt-chevron{display:none;margin-left:auto;font-size:12px;opacity:.55;transition:transform .18s;}
.live-think-wrap.done .lt-chevron{display:inline-block;}
.live-think-wrap.done.expanded .lt-chevron{transform:rotate(90deg);}
/* Live tool card (streaming) */
.live-tool-card{background:rgba(212,165,116,.07);border-left:2px solid rgba(212,165,116,.4);border-radius:0 10px 10px 0;padding:7px 10px;margin:0 0 8px;font-size:11px;color:rgba(212,165,116,.9);}
.live-tool-name{font-weight:600;font-size:12px;margin-bottom:2px;}
.live-tool-result{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Tool call cards */
.tool-card{background:rgba(212,165,116,.06);border-left:2px solid rgba(212,165,116,.4);border-radius:10px;margin:0 -2px 8px;overflow:hidden;}
.tool-card-toggle{width:100%;text-align:left;padding:7px 10px;background:none;border:none;cursor:pointer;font-size:11px;color:rgba(212,165,116,.85);display:flex;align-items:center;gap:5px;font-family:inherit;letter-spacing:.3px;}
.tool-card-toggle i{font-size:13px;transition:transform .18s;}
.tool-card-toggle.open i.ti-chevron-right{transform:rotate(90deg);}
.tool-card-body{display:none;padding:2px 10px 9px;font-size:12px;color:rgba(42,32,32,.52);line-height:1.65;word-break:break-all;white-space:pre-wrap;}
.tool-card-body.open{display:block;}
/* Simple tool pill（日常工具调用：开灯/存记忆/发留言板这种，一行一条） */
.tool-pill{background:var(--card);border:1px solid rgba(212,165,116,.28);border-radius:12px;margin:0 -2px 8px;overflow:hidden;}
.tpill-toggle{width:100%;text-align:left;padding:9px 12px;background:none;border:none;cursor:pointer;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;font-family:inherit;}
.tpill-toggle>i.ti-chevron-right{font-size:12px;color:var(--muted);transition:transform .18s;flex-shrink:0;}
.tpill-toggle.open>i.ti-chevron-right{transform:rotate(90deg);}
.tpill-toggle>i:not(.ti-chevron-right){font-size:15px;color:rgba(212,165,116,.85);flex-shrink:0;}
.tpill-kw{color:rgba(212,165,116,.95);font-weight:500;}
/* Artifact card（费佳生成的 HTML/Markdown/Word 产物） */
.artifact-card{background:var(--card);border:1px solid rgba(212,165,116,.28);border-radius:12px;margin:0 -2px 8px;padding:11px 12px;display:flex;align-items:center;gap:10px;}
.job-card{background:var(--card);border:1px solid rgba(120,140,180,.25);border-radius:10px;margin:6px 0;padding:10px 12px;font-size:12.5px;}
.job-card.ok{border-color:rgba(90,160,110,.35);}
.job-card.fail{border-color:rgba(200,90,90,.35);}
.job-card.run{border-color:rgba(120,140,180,.35);}
.job-card-hd{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px;}
.job-card-st{opacity:.7;font-weight:500;}
.job-card-id{opacity:.65;font-size:11px;margin-bottom:4px;}
.job-card-log{margin:0;max-height:140px;overflow:auto;font-size:11px;white-space:pre-wrap;opacity:.85;background:rgba(0,0,0,.04);padding:6px 8px;border-radius:6px;}
.app-card{background:var(--card);border:1px solid rgba(90,150,180,.28);border-radius:10px;margin:6px 0;padding:10px 12px;font-size:12.5px;}
.app-card-hd{display:flex;align-items:center;gap:7px;font-weight:600;margin-bottom:4px;color:var(--text);}
.app-card-meta{color:var(--muted);font-size:11px;margin-bottom:8px;word-break:break-all;}
.app-card-action{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border:1px solid rgba(90,150,180,.35);background:rgba(90,150,180,.12);color:var(--text);border-radius:8px;padding:6px 10px;font-size:11.5px;}
.app-card-action:hover{background:rgba(90,150,180,.2);}
.inline-workspace-link{display:inline-flex;align-items:center;gap:3px;color:rgba(64,120,155,.95);text-decoration:none;border-bottom:1px solid rgba(64,120,155,.35);}
.inline-workspace-link:hover{border-bottom-color:rgba(64,120,155,.75);}
.artifact-icon{width:34px;height:34px;border-radius:9px;background:rgba(212,165,116,.14);color:rgba(212,165,116,.95);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.artifact-info{flex:1;min-width:0;}
.artifact-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.artifact-meta{font-size:10.5px;color:var(--muted);margin-top:1px;}
.artifact-action{flex-shrink:0;font-size:11.5px;padding:6px 12px;border-radius:9px;background:rgba(212,165,116,.14);color:rgba(212,165,116,.95);border:none;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.artifact-action:hover{background:rgba(212,165,116,.24);}
/* 选择器按钮组（choices 有值时渲染）——不用 flex gap（Chrome78 不支持），靠 margin */
.choices-wrap{margin:4px 0 2px;}
.choice-btn{display:block;width:100%;text-align:left;margin-bottom:6px;padding:9px 13px;border:1px solid rgba(212,165,116,.35);border-radius:11px;background:var(--card);color:var(--text);font-size:13.5px;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s;}
.choice-btn:last-child{margin-bottom:0;}
.choice-btn:hover{background:rgba(212,165,116,.12);}
.choice-btn.chosen{background:rgba(212,165,116,.22);border-color:rgba(212,165,116,.7);font-weight:600;}
.choice-btn.disabled{opacity:.55;cursor:default;}
/* 待发送文件预览条 */
.doc-preview-strip{display:none;padding:6px 12px 0;}
.doc-chip{display:inline-flex;align-items:center;background:rgba(212,165,116,.12);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--text);max-width:100%;}
.doc-chip i{color:rgba(212,165,116,.9);margin-right:5px;}
.doc-chip .dname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.doc-chip .rm{margin-left:8px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;}

/* 联网搜索来源卡片 */
.ws-answer{font-size:12.5px;line-height:1.6;color:var(--text);background:rgba(212,165,116,.08);border-radius:9px;padding:8px 10px;margin-bottom:8px;}
.ws-cards{display:flex;flex-direction:column;gap:6px;}
.ws-card{display:block;text-decoration:none;background:var(--card);border:1px solid rgba(212,165,116,.22);border-radius:10px;padding:8px 10px;color:inherit;transition:border-color .15s,background .15s;}
a.ws-card:hover{border-color:rgba(212,165,116,.5);background:rgba(212,165,116,.06);}
.ws-card-title{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ws-card-snip{font-size:11px;color:var(--muted);line-height:1.5;margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ws-card-host{font-size:10.5px;color:rgba(212,165,116,.9);margin-top:4px;display:flex;align-items:center;gap:3px;}
.ws-card-host .ti{font-size:11px;}
.ws-src-note{font-size:10px;color:var(--muted);opacity:.6;margin-top:6px;text-align:right;}

/* 位置卡片（高德逆地理） */
.loc-card{background:var(--card);border:1px solid rgba(212,165,116,.28);border-radius:12px;padding:11px 12px;}
.loc-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);line-height:1.4;}
.loc-head .ti{font-size:15px;color:rgba(212,165,116,.95);flex-shrink:0;}
.loc-poi{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
.loc-meta{font-size:11px;color:var(--muted);opacity:.85;margin-top:4px;}
.loc-open{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:11.5px;padding:6px 11px;border-radius:9px;background:rgba(212,165,116,.14);color:rgba(212,165,116,.95);text-decoration:none;}
.loc-open:hover{background:rgba(212,165,116,.24);}
.loc-open .ti{font-size:12px;}

/* 网页阅读卡片（Playwright 截图+正文） */
.wp-card{background:var(--card);border:1px solid rgba(212,165,116,.28);border-radius:12px;overflow:hidden;}
.wp-shot{display:block;width:100%;max-height:220px;object-fit:cover;object-position:top;background:rgba(212,165,116,.06);border-bottom:1px solid rgba(212,165,116,.18);}
.wp-body{padding:10px 12px;}
.wp-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;}
.wp-url{font-size:11px;color:rgba(212,165,116,.9);margin-top:3px;display:inline-flex;align-items:center;gap:3px;text-decoration:none;word-break:break-all;}
.wp-url .ti{font-size:11px;flex-shrink:0;}
.wp-text{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:7px;max-height:120px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;white-space:pre-wrap;}

/* 聊天截图卡片 */
.shot-card{display:flex;flex-direction:column;gap:6px;}
.shot-card .shot-cap{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.shot-card .shot-cap .ti{font-size:13px;color:rgba(212,165,116,.9);}
.shot-card img{max-width:260px;width:100%;border-radius:12px;border:1px solid rgba(212,165,116,.28);display:block;cursor:pointer;box-shadow:0 3px 12px rgba(43,38,30,.1);}
/* 内联相册照片（费佳"突然想起"随消息发来的画面） */
.gallery-inline{display:block;margin:8px 0 2px;}
.gallery-inline img{max-width:240px;width:100%;border-radius:14px;border:1px solid rgba(212,165,116,.3);box-shadow:0 4px 16px rgba(43,38,30,.14);display:block;}
/* 倒计时任务浮窗（费佳给你下的任务） */
.cmd-float{position:fixed;right:10px;bottom:150px;z-index:60;}
.cmd-card{background:var(--card);border:1px solid rgba(212,165,116,.4);border-radius:16px;box-shadow:0 8px 28px rgba(43,38,30,.18);padding:12px 14px;width:212px;transition:background .5s,border-color .5s;}
.cmd-card.over{background:#fff3e6;border-color:#e6a35c;}
.cmd-top{display:flex;align-items:center;gap:7px;}
.cmd-icon{font-size:16px;color:var(--amber);flex-shrink:0;}
.cmd-card.over .cmd-icon{color:#c9702e;}
.cmd-title{flex:1;font-size:13px;font-weight:600;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmd-queue{font-size:10px;color:var(--muted);background:rgba(212,165,116,.16);border-radius:8px;padding:1px 6px;flex-shrink:0;}
.cmd-sub{font-size:10.5px;color:var(--muted);margin-top:3px;}
.cmd-time{font-size:31px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.5px;margin:5px 0 7px;line-height:1;}
.cmd-card.over .cmd-time{color:#c9702e;}
.cmd-bar{height:4px;background:rgba(212,165,116,.16);border-radius:3px;overflow:hidden;}
.cmd-barfill{height:100%;background:var(--amber);border-radius:3px;transform-origin:left;transform:scaleX(0);}
.cmd-card.over .cmd-barfill{background:#e6a35c;}
.cmd-acts{display:flex;gap:8px;margin-top:11px;}
.cmd-done{flex:1;border:none;background:var(--amber);color:#fff;font-size:12.5px;font-weight:600;padding:8px 0;border-radius:10px;cursor:pointer;font-family:inherit;}
.cmd-cancel{position:relative;overflow:hidden;border:1px solid var(--border);background:none;color:var(--muted);font-size:11.5px;padding:8px 11px;border-radius:10px;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none;touch-action:none;}
.cmd-cancel-fill{position:absolute;inset:0;background:rgba(201,112,46,.2);transform-origin:left;transform:scaleX(0);}
.cmd-cancel.holding .cmd-cancel-fill{transform:scaleX(1);transition:transform 1.1s linear;}
.cmd-cancel>span:last-child{position:relative;}

/* Tool Session card（一次回复里所有工具调用的汇总卡片） */
.tsess{background:rgba(212,165,116,.05);border-left:2px solid rgba(212,165,116,.35);border-radius:0 8px 8px 0;margin:0 0 8px;overflow:hidden;}
html[data-theme=dark] .tsess{background:rgba(212,165,116,.04);border-left-color:rgba(212,165,116,.3);}
.tsess-hd{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;}
.tsess-check{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(212,165,116,.7);font-size:12px;}
.tsess.running .tsess-check{color:rgba(212,165,116,.9);}
.tsess.failed .tsess-check{color:#c0645a;}
.tsess-title{font-size:11px;font-weight:400;color:var(--muted);flex:1;letter-spacing:.2px;}
.tsess-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.tsess-expand{color:var(--muted);font-size:13px;transition:transform .18s;flex-shrink:0;opacity:.5;}
.tsess.open .tsess-expand{transform:rotate(180deg);}
.tsess-term-wrap{display:none;}
.tsess.open .tsess-term-wrap{display:block;}
.tsess-term-hd{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font-size:10px;color:var(--muted);opacity:.6;}
.tsess-term{background:#1c1a17;border-radius:8px;margin:0 8px 6px;padding:8px 10px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;line-height:1.7;max-height:220px;overflow-y:auto;}
.tsess-term-line{color:rgba(232,226,220,.78);white-space:pre-wrap;word-break:break-all;}
.tsess-term-line.cmd{color:rgba(212,165,116,.8);}
.tsess-term-line.ok::before{content:'✓ ';color:rgba(212,165,116,.8);}
.tsess-term-line.fail::before{content:'✗ ';color:#c0645a;}
.tsess-term-line.run::before{content:'⟳ ';color:rgba(212,165,116,.9);display:inline-block;}
@keyframes tool-spin-kf{to{transform:rotate(360deg)}}
.tool-spin{display:inline-block;animation:tool-spin-kf 1s linear infinite;}
.tool-pill.running .tpill-toggle span{opacity:.75;}
.trace-summary-line{margin:4px 0 2px;font-size:12.5px;color:var(--ink-soft,#8a8177);opacity:.85;display:flex;align-items:center;gap:5px;}
.trace-summary-line .ti{font-size:13px;opacity:.7;}
/* 记忆召回标签：和 think/tool 同族的轨迹行 */
.mem-recall-pill{background:rgba(106,124,138,.06);border-left:2px solid rgba(106,124,138,.3);border-radius:0 10px 10px 0;margin:0 0 8px;overflow:hidden;}
.mem-recall-toggle{width:100%;text-align:left;padding:7px 10px;background:none;border:none;cursor:pointer;font-size:11px;color:rgba(106,124,138,.85);display:flex;align-items:center;gap:5px;font-family:inherit;letter-spacing:.3px;}
.mem-recall-toggle i{font-size:13px;transition:transform .18s;}
.mem-recall-toggle.open i.ti-chevron-right{transform:rotate(90deg);}
.mem-recall-body{display:none;padding:2px 10px 9px;font-size:11.5px;color:rgba(42,32,32,.55);line-height:1.6;}
.mem-recall-body.open{display:block;}
.mem-recall-item{margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;}
.tsess-files{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 7px;}
.tsess-file-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(212,165,116,.08);border-radius:6px;padding:2px 7px;font-size:10px;color:var(--muted);}
.tsess-file-chip .fp{color:rgba(212,165,116,.8);}
.tsess-file-chip .fm{color:#c0645a;}
.tsess-bar-wrap{padding:0 10px 7px;display:flex;align-items:center;gap:6px;}
.tsess-bar{flex:1;height:2px;border-radius:1px;background:rgba(212,165,116,.1);overflow:hidden;}
.tsess-bar-fill{height:100%;background:rgba(212,165,116,.5);border-radius:1px;transition:width .25s;}
.tsess.running .tsess-bar-fill{background:rgba(212,165,116,.7);animation:tsess-pulse 1.5s ease-in-out infinite;}
@keyframes tsess-pulse{0%,100%{opacity:.5}50%{opacity:1}}
.tsess-bar-txt{font-size:10px;color:var(--muted);white-space:nowrap;opacity:.6;}
.tsess:not(.running):not(.open) .tsess-bar-wrap{display:none;}

/* Empty / loading */
.empty-tip{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px;line-height:2.4;}

/* ── Cache info & stream error ── */
.cache-info{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);opacity:.68;width:100%;margin-top:3px;padding:0 4px;}
.cache-info .ci-item{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
.cache-info .ci-hit{color:rgba(86,150,112,.95);}
.cache-info .ci-build{color:rgba(170,128,72,.95);}
.cache-info .ci-miss{color:rgba(145,120,160,.9);}
.cache-info .ci-off{opacity:.72;}
.cache-info .ci-cost{color:rgba(170,108,88,.92);font-variant-numeric:tabular-nums;}
.cache-info .ci-cost{color:rgba(170,108,88,.92);font-variant-numeric:tabular-nums;}
.cache-info .ci-cost{color:rgba(170,108,88,.92);font-variant-numeric:tabular-nums;}
.stream-err-wrap{padding:10px 14px;color:#c0392b;}
.stream-err-retry{display:inline-block;margin-top:6px;font-size:12px;cursor:pointer;background:none;border:1px solid #c0392b;color:#c0392b;border-radius:4px;padding:3px 10px;}

/* ── Typing indicator ── */
#typing{display:none;padding:0 20px 4px;flex-shrink:0;}
.typing-line{display:flex;align-items:center;gap:9px;min-height:18px;}
.typing-dots{display:inline-flex;gap:5px;align-items:center;padding:4px 0;background:transparent;border-radius:0;flex:0 0 auto;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:rgba(124,106,138,.5);display:block;}
.send-status{font-size:12px;line-height:1.25;color:rgba(86,72,96,.68);white-space:nowrap;}
.send-status.status-sending{color:rgba(126,92,145,.82);}
.send-status.status-working{color:rgba(86,72,96,.72);}
.send-status.status-tools{color:rgba(94,124,96,.88);}
.send-status.status-error{color:#c0392b;}
.typing-dots span:nth-child(1){animation:dp 1.2s infinite 0s;}
.typing-dots span:nth-child(2){animation:dp 1.2s infinite .22s;}
.typing-dots span:nth-child(3){animation:dp 1.2s infinite .44s;}
@keyframes dp{0%,80%,100%{opacity:.3;transform:scale(1)}40%{opacity:1;transform:scale(1.25)}}

/* ── Input ── */
.inp-area{flex-shrink:0;background:rgba(245,243,238,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:none;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));}
.inp-author{font-size:11px;color:var(--muted);margin-bottom:5px;padding:0 2px;display:flex;align-items:center;gap:6px;}
.inp-author-btn{border:none;background:none;cursor:pointer;font-size:11px;font-family:inherit;letter-spacing:.3px;padding:2px 8px;border-radius:8px;transition:background .15s,color .15s;}
.inp-author-btn.fy{color:var(--primary);background:var(--primary-bg);}
.inp-author-btn.ha{color:var(--amber);background:var(--amber-bg);}
.inp-card{background:var(--card);border-radius:20px;border:1px solid var(--border);padding:10px 12px 8px;box-shadow:0 2px 6px rgba(43,38,30,.05);display:flex;flex-direction:column;gap:6px;}
.inp-bottom-row{display:flex;align-items:center;justify-content:space-between;}
.inp-bottom-left{display:flex;align-items:center;gap:6px;}
.inp-row{display:flex;align-items:center;gap:6px;}
.inp-attach{flex-shrink:0;width:28px;height:28px;border:none;background:var(--surface-soft,#ECEAE4);cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s,color .15s;}
.inp-attach:active{background:var(--border);}
.img-preview-strip{display:none;margin-bottom:7px;}
.img-preview-strip .thumb-wrap{position:relative;display:inline-block;}
.img-preview-strip img{width:54px;height:54px;object-fit:cover;border-radius:9px;display:block;border:1.5px solid var(--border);}
.img-preview-strip .rm{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:#888;color:#fff;border:none;font-size:12px;line-height:17px;text-align:center;cursor:pointer;padding:0;}
.inp-txt{flex:1;border:none;border-radius:0;padding:0 4px;font-size:15px;font-family:inherit;color:var(--text);background:transparent;outline:none;resize:none;line-height:1.6;min-height:24px;max-height:120px;overflow-y:auto;-webkit-appearance:none;}
.inp-txt:focus{outline:none;}
.inp-txt::placeholder{color:var(--muted-soft,#C0BBB4);font-size:13px;}
.inp-send{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:opacity .15s,transform .15s;box-shadow:0 3px 10px rgba(124,106,138,.35);}
.inp-send:active{opacity:.75;transform:scale(.9);}
.inp-send:disabled{opacity:.4;cursor:default;}

/* ── Bottom nav ── */
.bnav{flex-shrink:0;background:rgba(245,243,238,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:.5px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b8b0b8;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:2px 0;transition:color .18s;}
.ni i{font-size:21px;}
.ni.act{color:var(--primary);}

/* ── Lightbox ── */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center;}
.lb.show{display:flex;}
.lb img{max-width:94vw;max-height:86vh;border-radius:12px;object-fit:contain;}
.lb-close{position:absolute;top:18px;right:18px;color:#fff;font-size:26px;cursor:pointer;opacity:.8;}

/* ── Blocked state ── */
.inp-area.blocked .inp-txt{background:#f5f3f0;color:var(--muted);cursor:not-allowed;pointer-events:none;}
.inp-area.blocked .inp-send{display:none;}
.inp-area.blocked .inp-attach{opacity:.3;pointer-events:none;}
.drift-btn-wrap{display:none;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.inp-area.blocked .drift-btn-wrap{display:flex;}
.drift-hint{font-size:9px;color:var(--muted);letter-spacing:.2px;white-space:nowrap;}
.drift-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--amber-bg);color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:opacity .15s,transform .15s;box-shadow:0 2px 8px rgba(212,165,116,.3);}
.drift-btn:active{opacity:.75;transform:scale(.9);}
/* ── Drift modal ── */
.drift-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:400;align-items:center;justify-content:center;}
.drift-modal.show{display:flex;}
.drift-card{background:#fffcf7;border-radius:20px;padding:28px 22px 22px;width:min(360px,88vw);box-shadow:0 16px 48px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:14px;}
.drift-card-title{font-family:Georgia,'Times New Roman',serif;font-size:17px;color:var(--amber-text);text-align:center;letter-spacing:.4px;}
.drift-card-sub{font-size:11px;color:var(--muted);text-align:center;margin-top:-8px;}
.drift-textarea{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);background:var(--card);resize:none;outline:none;line-height:1.65;min-height:110px;}
.drift-textarea:focus{border-color:var(--amber);}
.drift-send-btn{padding:12px;border-radius:12px;border:none;background:var(--amber);color:var(--amber-text);font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;transition:opacity .15s;}
.drift-send-btn:active,.drift-send-btn:disabled{opacity:.6;}
.drift-sent-msg{display:none;text-align:center;font-size:13px;color:var(--muted);line-height:1.8;padding:8px 0;}
/* ── Drift bubble ── */
.drift-badge{font-size:10px;color:var(--amber);margin-bottom:5px;display:flex;align-items:center;gap:4px;opacity:.8;}
.drift-badge i{font-size:12px;}
.bubble.drift{background:linear-gradient(135deg,rgba(212,165,116,.12),rgba(124,106,138,.08));border:1px solid rgba(212,165,116,.25);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:var(--msg-font);line-height:1.7;word-break:break-all;color:var(--text);}
.bubble.drift.sent{border-radius:16px 16px 4px 16px;}

/* ── Code blocks ── */
.code-block{background:#1e1c1b;border-radius:10px;margin:8px 0;overflow:hidden;}
.code-block-hd{display:flex;align-items:center;justify-content:space-between;padding:5px 11px;background:#252220;font-size:11px;color:#7a6e6e;}
.code-block-lang{font-family:'SF Mono','Fira Code',Menlo,monospace;letter-spacing:.4px;text-transform:lowercase;}
.code-copy-btn{border:none;background:none;color:#7a6e6e;cursor:pointer;font-size:11px;padding:2px 7px;border-radius:5px;font-family:inherit;}
.code-copy-btn:hover{background:rgba(255,255,255,.08);color:#bbb;}
pre.code-pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:12px;line-height:1.65;font-family:'SF Mono','Fira Code',Menlo,monospace;color:#c8c0b8;white-space:pre;}
.diff-add{color:#7ec694;background:rgba(126,198,148,.12);display:block;}
.diff-del{color:#e06c75;background:rgba(224,108,117,.12);display:block;}
.diff-hunk{color:#61afef;display:block;}
.diff-meta{color:#888;display:block;}
.diff-ctx{display:block;}
/* ── Download menu ── */
.msg-actions{position:relative;}
.dl-menu{position:absolute;bottom:calc(100% + 4px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:50;min-width:88px;display:none;}
.dl-menu.show{display:block;}
.dl-item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 12px;font-size:12px;border:none;background:none;color:var(--text);cursor:pointer;border-radius:7px;white-space:nowrap;font-family:inherit;}
.dl-item:hover,.dl-item:active{background:var(--primary-bg);}
/* ── Dark mode ── */
html[data-theme=dark]{--bg:#161312;--card:#211d1c;--text:#e8e2dc;--muted:#9a8d8d;--primary:#a392b5;--primary-bg:#2c2733;--primary-light:rgba(163,146,181,.13);--amber:#d4a574;--amber-bg:#352a1d;--amber-text:#3a2402;--border:#332d2b;}
html[data-theme=dark] .hd,html[data-theme=dark] .inp-area,html[data-theme=dark] .bnav{background:rgba(26,22,21,.97);}
html[data-theme=dark] .think-body{color:rgba(232,226,220,.5);}
html[data-theme=dark] .live-think-body{color:rgba(232,226,220,.5);}
html[data-theme=dark] .tool-card-body{color:rgba(232,226,220,.5);}
html[data-theme=dark] .drift-card{background:#262120;}
html[data-theme=dark] .drift-card-title{color:#e8d9c4;}
html[data-theme=dark] .inp-area.blocked .inp-txt{background:#262120;}
html[data-theme=dark] .ni{color:#6a5f5f;}
/* ── Action sheet ── */
.sheet-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:flex-end;justify-content:center;}
.sheet-ov.show{display:flex;}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px));}
.sheet-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 10px;border:none;background:none;font-size:15px;font-family:inherit;color:var(--text);cursor:pointer;border-radius:10px;}
.sheet-btn:active{background:var(--primary-light);}
.sheet-btn i{font-size:19px;color:var(--muted);}
.sheet-cancel{justify-content:center;color:var(--muted);}
.sheet-danger{color:#e05a5a;}
.sheet-danger i{color:#e05a5a;}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(42,32,32,.88);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.toast-err{background:rgba(180,50,40,.92);}
/* ── Floating bottles list ── */
.drift-floating{display:flex;flex-direction:column;gap:6px;max-height:130px;overflow-y:auto;}
.drift-float-item{font-size:11px;color:var(--muted);background:var(--primary-light);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:6px;}
.drift-float-item i{font-size:13px;color:var(--amber);opacity:.7;}

/* Msg actions */
.bwrap{position:relative;}
.msg-time-row{display:flex;align-items:center;gap:5px;margin-top:3px;}
.msg-actions{display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .15s;}
.msg-row:hover .msg-actions{opacity:1;}
.mac-btn{width:20px;height:20px;border:none;background:none;cursor:pointer;color:#b8a090;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:color .12s;padding:0;}
.mac-btn:hover{color:#d4a574;}
.bubble.editing{outline:1.5px solid var(--amber) !important;cursor:text;}
.branch-bar{display:inline-flex;align-items:center;gap:2px;user-select:none;margin-left:4px;}
.branch-nav{cursor:pointer;padding:2px 5px;font-size:13px;opacity:.4;border-radius:3px;}
.branch-nav:hover{opacity:.7;}
.branch-count{font-family:monospace;font-size:10px;opacity:.4;min-width:20px;text-align:center;}

/* model selector */
.model-pill{position:relative;z-index:150;}
.model-pill-btn{display:flex;align-items:center;gap:4px;padding:0 8px;height:28px;border-radius:14px;border:1px solid var(--border);background:var(--surface-soft,#ECEAE4);cursor:pointer;font-size:11px;font-family:inherit;color:var(--muted);letter-spacing:.2px;transition:background .15s,color .15s;flex-shrink:0;}
.model-pill-btn:active,.model-pill-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary);}
.model-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;}

// Panel toggle
function togglePanel(id, btnId) {
  ['aa-panel','status-panel'].forEach(function(p){
    if(p !== id) {
      document.getElementById(p).classList.remove('show');
    }
  });
  ['aa-btn','sp-btn'].forEach(function(b){
    if(b !== btnId) document.getElementById(b).classList.remove('on');
  });
  var el = document.getElementById(id);
  var btn = document.getElementById(btnId);
  el.classList.toggle('show');
  btn.classList.toggle('on', el.classList.contains('show'));
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.hd')) {
    document.getElementById('aa-panel').classList.remove('show');
    document.getElementById('status-panel').classList.remove('show');
    document.getElementById('aa-btn').classList.remove('on');
    document.getElementById('sp-btn').classList.remove('on');

});

// History
async function openHistory() {
  document.getElementById('hist-ov').classList.add('show');
  document.getElementById('hist-search').value = '';
  var r = await fetch('/api/chat/messages?limit=500');
  var d = await r.json();
  allHist = (d.messages || []).reverse();
  renderHist(allHist);
}
function closeHistory() {
  document.getElementById('hist-ov').classList.remove('show');
}
function jumpToMsg(id) {
  closeHistory();
  setTimeout(function(){ loadAroundAndFocus(id); }, 200);
}
function filterHist(q) {
  if (!q.trim()) { renderHist(allHist); return; }
  var lq = q.toLowerCase();
  renderHist(allHist.filter(m => (m.content||'').toLowerCase().includes(lq)));
}
function renderHist(list) {
  var body = document.getElementById('hist-body');
  if (!list.length) { body.innerHTML = '<div class="empty-tip">nothing found</div>'; return; }
  var html = '', lastDate = '';
  list.forEach(function(m) {
    var dk = dayKey(m.created_at);
    if (dk !== lastDate) {
      html += '<div class="hist-date">' + dayLabel(m.created_at) + '</div>';
      lastDate = dk;
    }
    var fy = isFy(m.author);
    html += '<div class="hist-msg" data-id="'+m.id+'" onclick="jumpToMsg('+m.id+')">' +
      '<div class="hm-who ' + (fy?'fy':'ha') + '">' + (fy?'Fyodor':'Haya') + ' · ' + fmtTime(m.created_at) + '</div>' +
      '<div class="hm-text">' + escHtml((m.content||'').slice(0,80)) + '</div>' +
    '</div>';
  });
  body.innerHTML = html;
}

// Utilities
function isFy(a){ return ['fyodor','claude','assistant'].includes(String(a).toLowerCase()); }
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function escCode(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderCodeBlock(lang, code){
  var isDiff = lang==='diff' || (!lang && /^[\-\+@]{1,3}/.test(code.replace(/^\s+/,'')));
  var id = 'cb'+(Math.random()*1e9|0).toString(36);
  var hd = '<div class="code-block-hd"><span class="code-block-lang">'+escCode(lang||'code')+'</span>'+
    '<button class="code-copy-btn" onclick="copyCb(\''+id+'\',event)">复制</button></div>';
  if(isDiff){
    var lhtml = code.replace(/\r/g,'').split('\n').map(function(l){
      if(l[0]==='+'&&l.slice(0,3)!=='+++') return '<span class="diff-add">'+escCode(l)+'</span>';
      if(l[0]==='-'&&l.slice(0,3)!=='---') return '<span class="diff-del">'+escCode(l)+'</span>';
      if(l[0]==='@') return '<span class="diff-hunk">'+escCode(l)+'</span>';
      if(l.slice(0,3)==='---'||l.slice(0,3)==='+++') return '<span class="diff-meta">'+escCode(l)+'</span>';
      return '<span class="diff-ctx">'+escCode(l)+'</span>';
    }).join('\n');
    return '<div class="code-block">'+hd+'<pre class="code-pre" id="'+id+'" data-raw="'+escCode(code)+'">'+lhtml+'</pre></div>';
  }
  return '<div class="code-block">'+hd+'<pre class="code-pre" id="'+id+'" data-raw="'+escCode(code)+'">'+escCode(code)+'</pre></div>';
}

function copyCb(id, e){
  if(e) e.stopPropagation();
  var el = document.getElementById(id);
  if(!el) return;
  var text = el.dataset.raw || el.textContent || '';
  try{ navigator.clipboard.writeText(text); }catch(_){
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  showToast('已复制代码');
}

// 内联相册标记 [[gallery:pid]] → 一张真实照片（第3步·主动回忆时费佳把画面随消息发出）
function injectGalleryTokens(html){
  return String(html).replace(/\[\[gallery:([A-Za-z0-9_-]+)\]\]/g, function(_, pid){
    var url = '/api/gallery/photo/' + pid;
    return '<a class="gallery-inline" href="'+url+'" target="_blank" rel="noopener">'+
           '<img src="'+url+'" alt="收藏的画面" loading="lazy"></a>';
  });
}

function linkWorkspaceUrls(html){
  return String(html).replace(/(https?:\/\/[^\s<"]*\/api\/gw\/workspace\/apps\/[^\s<"]+|\/api\/gw\/workspace\/apps\/[A-Za-z0-9_-]+\/proxy\/[^\s<"]*)/g, function(url){
    var tail = '';
    while(/[，。,.!！?？)）\]】]$/.test(url)){ tail = url.slice(-1) + tail; url = url.slice(0,-1); }
    return '<a class="inline-workspace-link" href="'+escAttr(url)+'" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>'+escHtml(url)+'</a>'+escHtml(tail);
  });
}
function renderContent(s, isFyodor){
  if(isFyodor && /<(div|details|summary|span)\b[^>]*style\s*=/i.test(s)){
    return injectGalleryTokens(s.replace(/(^[^<]+|>[^<]*(?=<|$))/g, function(m){ return m.replace(/\n/g,'<br>'); }));
  }
  var result='', lastIdx=0;
  var re=/```(\w*)\r?\n?([\s\S]*?)```/g, m;
  while((m=re.exec(s))!==null){
    var before=s.slice(lastIdx,m.index);
    if(before) result+=linkWorkspaceUrls(escHtml(before));
    result+=renderCodeBlock((m[1]||'').trim(), m[2]);
    lastIdx=m.index+m[0].length;
  }
  var after=s.slice(lastIdx);
  if(after) result+=linkWorkspaceUrls(escHtml(after));
  return injectGalleryTokens(result);
}

var dlMenuActive=null;
function showDlMenu(btn, mid){
  if(dlMenuActive){dlMenuActive.remove();dlMenuActive=null;}
  var menu=document.createElement('div');
  menu.className='dl-menu show';
  menu.innerHTML=
    '<button class="dl-item" onclick="downloadMsg('+mid+',\'txt\')">📄 .txt</button>'+
    '<button class="dl-item" onclick="downloadMsg('+mid+',\'md\')">📝 .md</button>'+
    '<button class="dl-item" onclick="downloadMsg('+mid+',\'html\')">🌐 .html</button>';
  btn.closest('.msg-actions').appendChild(menu);
  dlMenuActive=menu;
  setTimeout(function(){
    document.addEventListener('click',function once(){menu.remove();if(dlMenuActive===menu)dlMenuActive=null;document.removeEventListener('click',once);});
  },0);
}

function downloadMsg(mid, fmt){
  if(dlMenuActive){dlMenuActive.remove();dlMenuActive=null;}
  var msg=null;
  (window.curMsgList||[]).forEach(function(m){if(m.id==mid)msg=m;});
  if(!msg)return;
  var content=msg.content||'';
  var dt=(msg.created_at||'').slice(0,10)||new Date().toISOString().slice(0,10);
  var filename='fyodor-'+dt, blob;
  if(fmt==='txt'){
    blob=new Blob([content],{type:'text/plain;charset=utf-8'});filename+='.txt';
  }else if(fmt==='md'){
    blob=new Blob([content],{type:'text/markdown;charset=utf-8'});filename+='.md';
  }else{
    var body=escCode(content).replace(/\n/g,'<br>');
    var full='<!DOCTYPE html>\n<html lang="zh"><head><meta charset="UTF-8"><title>Fyodor · '+escCode(dt)+'</title>'+
      '<style>body{font-family:-apple-system,sans-serif;max-width:680px;margin:40px auto;padding:0 24px;line-height:1.8;color:#2a2020;background:#f8f8f6;}'+
      'pre{background:#1e1c1b;color:#c8c0b8;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:13px;}</style></head>'+
      '<body><p>'+body+'</p></body></html>';
    blob=new Blob([full],{type:'text/html;charset=utf-8'});filename+='.html';
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  showToast('已下载 '+filename);
}
function fmtTime(dt){
  if(!dt)return'';
  try{ var d=new Date(dt.replace(' ','T')); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){return'';}
}
function dayKey(dt){
  if(!dt)return'';
  try{ var d=new Date(dt.replace(' ','T')); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }catch(e){return'';}
}
function dayLabel(dt){
  if(!dt)return'';
  try{
    var d=new Date(dt.replace(' ','T')); var t=new Date(); var y=new Date(); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString())return'Today';
    if(d.toDateString()===y.toDateString())return'Yesterday';
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate();
  }catch(e){return'';}
}

// 把 _web_search 返回的定式文本解析成 {answer, sources:[{title,snippet,url}], note}
// 文本格式（后端 gateway._web_search 生成，我两头都控着）：
//   【摘要】...            → answer
//   · 标题 / 缩进正文 / 缩进URL   → 一条来源（Tavily）
//   · 文本                → 一条来源（DDG 降级，无 url）
//   （来源：xxx）          → note
function parseSearchResult(text){
  var lines = String(text||'').split('\n');
  var answer='', note='', sources=[], cur=null;
  function flush(){ if(cur){ sources.push(cur); cur=null; } }
  for(var i=0;i<lines.length;i++){
    var raw = lines[i], t = raw.trim();
    if(!t) continue;
    if(t.indexOf('（来源：')===0){ note = t; continue; }
    var mHead = t.match(/^【(.*?)】\s*(.*)$/);
    if(mHead){ flush(); answer = mHead[2] || mHead[1]; continue; }
    if(t.indexOf('来源：')===0){ if(cur) cur.url = t.slice(3).trim(); continue; }
    if(t.charAt(0)==='·'){ flush(); cur = {title:t.replace(/^·\s*/,''), snippet:'', url:''}; continue; }
    if(cur){
      if(/^https?:\/\//i.test(t)) cur.url = t;
      else cur.snippet = cur.snippet ? cur.snippet+' '+t : t;
    }
  }
  flush();
  return {answer:answer, sources:sources, note:note};
}
function buildSearchCardsHtml(tc){
  var p = parseSearchResult(tc.result);
  if(!p.answer && !p.sources.length) return '';
  var html = '';
  if(p.answer) html += '<div class="ws-answer">'+escHtml(p.answer)+'</div>';
  if(p.sources.length){
    html += '<div class="ws-cards">';
    p.sources.forEach(function(s){
      var host='';
      if(s.url){ try{ host = new URL(s.url).hostname.replace(/^www\./,''); }catch(e){ host=''; } }
      var inner = '<div class="ws-card-title">'+escHtml(s.title||host||'来源')+'</div>'+
        (s.snippet ? '<div class="ws-card-snip">'+escHtml(s.snippet)+'</div>' : '')+
        (host ? '<div class="ws-card-host"><i class="ti ti-external-link"></i>'+escHtml(host)+'</div>' : '');
      html += s.url
        ? '<a class="ws-card" href="'+escHtml(s.url)+'" target="_blank" rel="noopener">'+inner+'</a>'
        : '<div class="ws-card">'+inner+'</div>';

  if(p.note) html += '<div class="ws-src-note">'+escHtml(p.note)+'</div>';
  return html;

function parseLocation(text){

function parseWebpage(text){
  var o={title:'',url:'',shot:'',body:''};
  var lines=String(text||'').split('\n'), i=0;
  for(;i<lines.length;i++){
    var t=lines[i].trim();

    else if(t.indexOf('🔗')===0) o.url=t.replace('🔗','').trim();
    else if(t.indexOf('🖼')===0) o.shot=t.replace('🖼','').trim();
    else if(t==='' && (o.title||o.url)){ i++; break; }
  }
  o.body=lines.slice(i).join('\n').trim();
  return o;
}

    var jc = buildWsJobCardHtml(tc);

  }

    if(ac) return ac;
  }
  if(tc.name==='get_location' && tc.result){

  }

  if((tc.name==='screenshot_chat' || tc.name==='save_to_gallery') && tc.result){
    var shc=buildShotCardHtml(tc);
    if(shc) return shc;
  }
  // web_search 一律试卡片；browse_github 只在"搜索模式"(带 GitHub API 来源注脚)试卡片，
  // 单库详情含 README，可能有 markdown 项目符号，走纯文本避免误判成来源卡。

  return '<div>结果: '+escHtml(res.slice(0,400))+'</div>';
}

function fmtTok(n){
  n = Number(n||0);
  if(!isFinite(n) || n<=0) return '0';
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(Math.round(n));
}
function fmtCost(usd, estimated){
  var n = Number(usd||0);
  if(!isFinite(n) || n<=0) return '';
  var text = n >= 1 ? n.toFixed(2) : n >= 0.01 ? n.toFixed(2) : n.toFixed(3);
  var title = estimated ? '按费率估算，可能与账单略有偏差' : '按中转站账单 quota 换算';
  return '<span class="ci-item ci-cost" title="'+title+'">'+(estimated?'≈':'')+'$'+text+'</span>';
}
function buildCacheInfoHtmlFromData(ci){
  ci = ci || {};
  var read = Number(ci.cache_read||0);
  var created = Number(ci.cache_creation||0);
  var created5m = Number(ci.cache_creation_5m||0);
  var created1h = Number(ci.cache_creation_1h||0);
  var input = Number(ci.input_tokens||0);
  var output = Number(ci.output_tokens||0);
  var elapsed = Number(ci.elapsed_sec||0);
  var promptTotal = input + read + created;
  var activePromptTotal = input + read;
  var pieces = [];
  if(promptTotal>0) pieces.push('<span class="ci-item" title="本轮输入 token，含缓存读回/写入部分">⇧ '+fmtTok(promptTotal)+' tokens</span>');
  if(output>0) pieces.push('<span class="ci-item" title="本轮输出 token">⇩ '+fmtTok(output)+' tokens</span>');
  if(output>0 && elapsed>0) pieces.push('<span class="ci-item" title="输出速度">ϟ '+(output/elapsed).toFixed(1)+' tok/s</span>');
  if(elapsed>0) pieces.push('<span class="ci-item" title="本轮生成耗时">◷ '+elapsed.toFixed(elapsed<10?1:0)+'s</span>');
  if(ci.cache_supported===false){
    pieces.push('<span class="ci-item ci-off" title="当前中转站未稳定返回服务端 prompt cache">无服务端缓存</span>');
  } else if(read>0){
    var pct = activePromptTotal>0 ? Math.round(read/activePromptTotal*100) : 0;
    pieces.push('<span class="ci-item ci-hit" title="从服务端 prompt cache 读回的 token；百分比不把本轮新建缓存计入分母">缓存读回 '+pct+'% ('+fmtTok(read)+')</span>');
    if(created>0){
      var hitBuildParts = [];
      if(created1h>0) hitBuildParts.push('1h '+fmtTok(created1h));
      if(created5m>0) hitBuildParts.push('5m '+fmtTok(created5m));
      if(!hitBuildParts.length) hitBuildParts.push(fmtTok(created));
      pieces.push('<span class="ci-item ci-build" title="本轮同时写入服务端 prompt cache，下一轮可能命中">新建 '+hitBuildParts.join(' / ')+'</span>');
    }
  } else if(created>0){
    var buildParts = [];
    if(created1h>0) buildParts.push('1h '+fmtTok(created1h));
    if(created5m>0) buildParts.push('5m '+fmtTok(created5m));
    if(!buildParts.length) buildParts.push(fmtTok(created));
    pieces.push('<span class="ci-item ci-build" title="本轮写入服务端 prompt cache，下一轮可能命中">建缓存 '+buildParts.join(' / ')+'</span>');
  } else if(ci.cache_supported===true){
    pieces.push('<span class="ci-item ci-miss" title="支持缓存，但本轮未读回缓存">缓存未命中</span>');
  }
  var costHtml = fmtCost(ci.cost_usd, ci.cost_estimated);
  if(costHtml) pieces.push(costHtml);
  return pieces.length ? '<div class="cache-info">'+pieces.join(' · ')+'</div>' : '';
}

// Build message HTML
function buildHtml(list) {
  window.curMsgList = list;
  var html='', lastDay='';
  if(topLoadHint){
    html += '<div class="date-sep">'+escHtml(topLoadHint)+'</div>';
  }
  if(!list.length) return html + '<div class="empty-tip">no messages yet<br>say the first thing</div>';
  var lastAiIdx = -1;
  for(var j=list.length-1; j>=0; j--){ if(isFy(list[j].author)){lastAiIdx=j; break;} }
  list.forEach(function(m,i){
    var dk = dayKey(m.created_at);
    if(dk !== lastDay){ html += '<div class="date-sep">'+dayLabel(m.created_at)+'</div>'; lastDay=dk; }
    if(m.drift){
      var dside = m.drift==='sent' ? 'ha' : 'fy';
      html +=
        '<div class="msg-row '+dside+'" data-idx="'+i+'">' +
          '<div class="bwrap">' +
            '<div class="drift-badge"'+(dside==='ha'?' style="justify-content:flex-end"':'')+'><i class="ti ti-mail-forward"></i> '+(m.drift==='sent'?'漂流瓶 · 已投出':'漂流瓶回信')+'</div>' +
            '<div class="bubble drift'+(dside==='ha'?' sent':'')+'">'+escHtml(m.content)+'</div>' +
            '<div class="msg-time">'+fmtTime(m.created_at)+'</div>' +
          '</div>' +
        '</div>';
      return;
    }
    var fy = isFy(m.author);
    var side = fy?'fy':'ha';
    var hasImg = !!m.image_url;
    var hasTxt = !!(m.content && m.content.trim());
    var imgOnly = hasImg && !hasTxt;
    var thinking = (m.thinking||'').trim();

    var innerHtml = '';
    if(fy && thinking) {
      var tOpen = openThinks.has(String(m.id));
      var tSummary = (m.thinking_summary || '').trim() || ('思考了 '+thinking.length+' 字');
      innerHtml +=
        '<div class="think-wrap" data-mid="'+m.id+'">' +
          '<button class="think-toggle'+(tOpen?' open':'')+'" onclick="toggleThink(this)">' +
            '<i class="ti ti-chevron-right"></i>' +
            '<span class="tl">'+escHtml(tSummary)+'</span>' +
          '</button>' +
          '<div class="think-body'+(tOpen?' open':'')+'">'+escHtml(thinking)+'</div>' +
        '</div>';
    }
    if(fy && m.tool_calls) {
      var tcs = [];
      try { tcs = JSON.parse(m.tool_calls); } catch(e) {}
      if(tcs.length) innerHtml += buildToolCallsHtml(tcs, {});
    }
    if(hasImg) innerHtml += '<img src="'+escHtml(m.image_url)+'" loading="lazy" onclick="openLb(\''+escHtml(m.image_url)+'\')">';
    // 过滤掉content里意外写入的工具调用JSON片段（如{"name":"user_time_v0","input":{}}）
    // 用括号平衡法 strip，正确处理任意深度嵌套的 input 对象
    var displayContent = (function(s){
      var out='', i=0;
      while(i<s.length){
        var st=s.indexOf('{"name":',i);
        if(st===-1){out+=s.slice(i);break;}
        out+=s.slice(i,st);
        var depth=0,j=st;
        while(j<s.length){
          if(s[j]==='{')depth++;
          else if(s[j]==='}'){depth--;if(depth===0){j++;break;}}
          j++;
        }
        var frag=s.slice(st,j);
        try{var p=JSON.parse(frag);if(p&&typeof p.name==='string'&&p.input!==undefined){i=j;continue;}}catch(e){}
        out+=frag;i=j;
      }
      return out.trim();
    })(m.content||'');
    var _isFileMarker = !!m.file_url && /^\[文件[:：]/.test(displayContent);
    if(hasTxt && displayContent && !_isFileMarker) innerHtml += (hasImg?'<div class="img-then-text">':'')+renderContent(displayContent, fy)+(hasImg?'</div>':''  );
    if(m.file_url) innerHtml += buildFileCardHtml(m);
    if(fy && m.choices) innerHtml += buildChoicesHtml(m, list);
    var cacheInfoHtml = '';
    if(fy && m.cache_info){
      try{
        var ci = JSON.parse(m.cache_info);
        cacheInfoHtml = buildCacheInfoHtmlFromData(ci);
      }catch(e){}
    }

    var actHtml;
    if(fy) {
      var branches = [];
      try { if(m.branches) branches = JSON.parse(m.branches); } catch(e) {}
      var branchBar = branches.length > 1
        ? '<span class="branch-bar"><span class="branch-nav" onclick="switchBranch('+m.id+',-1)">&#8249;</span><span class="branch-count">'+((m.branch_idx||0)+1)+'/'+branches.length+'</span><span class="branch-nav" onclick="switchBranch('+m.id+',1)">&#8250;</span></span>'
        : '';
      var regenBtn = (i === lastAiIdx)
        ? '<button class="mac-btn" title="重新生成" onclick="doRegen('+m.id+')"><i class="ti ti-refresh"></i></button>'
        : '';
      actHtml = '<div class="msg-actions">'+regenBtn+'<button class="mac-btn" title="复制" onclick="copyBubble(this)"><i class="ti ti-copy"></i></button><button class="mac-btn" title="下载" onclick="showDlMenu(this,'+m.id+')"><i class="ti ti-download"></i></button></div>';
      html +=
        '<div class="msg-row '+side+'" data-idx="'+i+'" data-mid="'+m.id+'">' +
          '<div class="bwrap">' +
            '<div class="bubble '+side+(imgOnly?' img-only':'')+'">'+innerHtml+'</div>' +
            '<div class="msg-time-row"><span class="msg-time">'+fmtTime(m.created_at)+'</span>'+branchBar+actHtml+cacheInfoHtml+'</div>' +
          '</div>' +
        '</div>';
    } else {
      actHtml = '<div class="msg-actions"><button class="mac-btn" title="编辑" onclick="editMsg(this,'+m.id+')"><i class="ti ti-edit"></i></button></div>';
      html +=
        '<div class="msg-row '+side+'" data-idx="'+i+'" data-mid="'+m.id+'">' +
          '<div class="bwrap">' +
            '<div class="bubble '+side+(imgOnly?' img-only':'')+'">'+innerHtml+'</div>' +
            '<div class="msg-time-row"><span class="msg-time">'+fmtTime(m.created_at)+'</span>'+actHtml+'</div>' +
          '</div>' +
        '</div>';
    }
  });
  return html;
}

function setTopHint(text){
  topLoadHint = text || '';
}

function _toNum(v){
  var n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function _refreshRangeFlags(meta){
  meta = meta || {};
  if(typeof meta.has_more_before === 'boolean') hasMoreBefore = meta.has_more_before;
  if(typeof meta.has_more_after === 'boolean') hasMoreAfter = meta.has_more_after;
}

function _syncCursorFromAllMsgs(){
  oldestLoadedId = allMsgs.length ? _toNum(allMsgs[0].id) : 0;
  newestLoadedId = allMsgs.length ? _toNum(allMsgs[allMsgs.length - 1].id) : 0;
}

function _mergeMsgs(base, incoming, mode){
  base = base || [];
  incoming = incoming || [];
  if(!incoming.length) return base.slice();
  var seen = {};
  base.forEach(function(m){ if(_toNum(m.id)) seen[_toNum(m.id)] = 1; });
  var fresh = incoming.filter(function(m){ var id=_toNum(m.id); return id && !seen[id]; });
  if(!fresh.length) return base.slice();
  var out = (mode === 'prepend') ? fresh.concat(base) : base.concat(fresh);
  out.sort(function(a,b){ return _toNum(a.id) - _toNum(b.id); });
  return out;
}

function _composeListWithDrift(baseList){
  var list = (baseList || []).slice();
  if(!list.length || !driftCache.length) return list;
  var minTs = String(list[0].created_at || '');
  var maxTs = String(list[list.length - 1].created_at || '');
  driftCache.forEach(function(b){
    var t1 = String(b.created_at || '');
    if(t1 >= minTs && t1 <= maxTs){
      list.push({author:'hayana',content:b.content,created_at:b.created_at,drift:'sent'});
    }
    if(b.status === 'found' && b.reply){
      var t2 = String(b.found_at || '');
      if(t2 >= minTs && t2 <= maxTs){
        list.push({author:'fyodor',content:b.reply,created_at:b.found_at,drift:'reply'});
      }
    }
  });
  list.sort(function(a,b){
    var ta = String(a.created_at || '');
    var tb = String(b.created_at || '');
    if(ta !== tb) return ta.localeCompare(tb);
    return _toNum(a.id) - _toNum(b.id);
  });
  return list;
}

async function refreshDrift(force){
  var now = Date.now();
  if(!force && now - driftCacheAt < 8000) return;
  try{
    var rb = await fetch('/api/drift/bottles');
    var db = await rb.json();
    driftCache = db.bottles || [];
    driftCacheAt = now;
    notifyNewDriftReplies(driftCache);
  }catch(e){}
}

function _driftSig(){
  return JSON.stringify((driftCache||[]).map(function(b){
    return [b.id, b.status, b.found_at || '', b.reply || ''];
  }));
}

function _highlightRowByMsgId(id){
  var rows = document.querySelectorAll('#msgs .msg-row');
  for(var i=0;i<rows.length;i++){
    var idx = parseInt(rows[i].getAttribute('data-idx'));
    if(window.curMsgList && window.curMsgList[idx] && window.curMsgList[idx].id == id){
      rows[i].scrollIntoView({behavior:'smooth',block:'center'});
      rows[i].style.transition='background .3s';
      rows[i].style.background='var(--primary-bg)';
      setTimeout((function(el){ return function(){ el.style.background=''; }; })(rows[i]), 1800);
      return true;
    }
  }
  return false;
}

async function renderFromState(opts){
  opts = opts || {};
  if(editingMsgId !== null) return;
  var c = document.getElementById('msgs');
  var oldHeight = c.scrollHeight;
  var oldTop = c.scrollTop;
  var wasAtBottom = oldHeight - oldTop - c.clientHeight < 80;
  var renderList = _composeListWithDrift(allMsgs);
  c.innerHTML = buildHtml(renderList);
  if(opts.preservePrepend){
    c.scrollTop = oldTop + (c.scrollHeight - oldHeight);
  } else if(typeof opts.keepTop === 'number'){
    c.scrollTop = opts.keepTop;
  } else if(opts.scrollToBottom || wasAtBottom){
    c.scrollTop = c.scrollHeight;
  }
}

async function loadInitialWindow(scrollToBottom){
  var r = await fetch('/api/chat/messages?limit=100');
  var d = await r.json();
  allMsgs = d.messages || [];
  _syncCursorFromAllMsgs();
  _refreshRangeFlags(d);
  window.historyMode = false;
  setTopHint(hasMoreBefore ? '' : '———— 已经是最早消息 ————');
  await refreshDrift(true);
  await renderFromState({scrollToBottom: scrollToBottom !== false});
}

async function pollNewMessages(){
  if(streamAbort || pollInFlight || window.historyMode) return;
  if(editingMsgId !== null) return;
  pollInFlight = true;
  try{
    if(!newestLoadedId){
      await loadInitialWindow(true);
      return;
    }
    var prevDriftSig = _driftSig();
    var r = await fetch('/api/chat/messages?after=' + newestLoadedId + '&limit=100');
    var d = await r.json();
    var incoming = d.messages || [];
    await refreshDrift(true);
    var driftChanged = _driftSig() !== prevDriftSig;
    if(incoming.length){
      allMsgs = _mergeMsgs(allMsgs, incoming, 'append');
      _syncCursorFromAllMsgs();
      _refreshRangeFlags(d);
      setTopHint(hasMoreBefore ? '' : '———— 已经是最早消息 ————');
      await renderFromState({});
    }else if(driftChanged){
      await renderFromState({keepTop: document.getElementById('msgs').scrollTop});
    }
  }finally{
    pollInFlight = false;
  }
}

async function loadOlderMessages(){
  if(loadingOlder || !hasMoreBefore || !oldestLoadedId) return;
  loadingOlder = true;
  setTopHint('正在加载更早的消息…');
  await renderFromState({keepTop: document.getElementById('msgs').scrollTop});
  try{
    var r = await fetch('/api/chat/messages?before=' + oldestLoadedId + '&limit=100');
    var d = await r.json();
    var incoming = d.messages || [];
    allMsgs = _mergeMsgs(allMsgs, incoming, 'prepend');
    _syncCursorFromAllMsgs();
    _refreshRangeFlags(d);
    setTopHint(hasMoreBefore ? '' : '———— 已经是最早消息 ————');
    await renderFromState({preservePrepend:true});
  }finally{
    loadingOlder = false;
  }
}

async function loadNewerMessagesInHistory(){
  if(loadingNewer || !hasMoreAfter || !newestLoadedId) return;
  loadingNewer = true;
  try{
    var c = document.getElementById('msgs');
    var keepTop = c.scrollTop;
    var r = await fetch('/api/chat/messages?after=' + newestLoadedId + '&limit=100');
    var d = await r.json();
    var incoming = d.messages || [];
    allMsgs = _mergeMsgs(allMsgs, incoming, 'append');
    _syncCursorFromAllMsgs();
    _refreshRangeFlags(d);
    await renderFromState({keepTop: keepTop});
  }finally{
    loadingNewer = false;
  }
}

async function loadAroundAndFocus(id){
  try{
    var r = await fetch('/api/chat/messages?around=' + id + '&limit=200');
    var d = await r.json();
    allMsgs = d.messages || [];
    _syncCursorFromAllMsgs();
    _refreshRangeFlags(d);
    window.historyMode = true;
    setTopHint(hasMoreBefore ? '' : '———— 已经是最早消息 ————');
    await refreshDrift(true);
    await renderFromState({keepTop: 0});
    setTimeout(function(){ _highlightRowByMsgId(id); }, 100);
  }catch(e){
    showToast('加载失败');
  }
}

async function loadMsgs(isInit){
  if(editingMsgId !== null) return;
  if(!isInit && _suppressLoadMsgs){ _suppressLoadMsgs=false; return; }
  try{
    if(isInit){
      await loadInitialWindow(true);
    }else{
      await pollNewMessages();

var lastUserMsgText = '';
// Kept until gateway confirms a completed reply; retries reuse the same turn id.
var pendingGwUserMessageId = null;
function humanizeError(raw){
  var s = String(raw||'');
  if(/timed out|timeout|超时/i.test(s)) return '⚠ 上游响应超时，请重试';
  if(/HTTPError|API \d{3}|API错误|502|503|504/i.test(s)) return '⚠ AI服务暂时不可用，请重试';
  if(/未配置订阅|CC_TOKEN|token/i.test(s)) return '⚠ 配置异常，请联系费奥多尔检查';
  if(/Connection|ConnectionError|网络/i.test(s)) return '⚠ 网络连接失败，请检查后重试';
  if(/Name or service not known|urlopen error|getaddrinfo|DNS|Errno -2|Errno 111|refused/i.test(s)) return '⚠ 服务器连接失败，请稍后重试';
  if(s.length > 60) return '⚠ 出错了：' + s.slice(0,60) + '…';
  return s ? ('⚠ ' + s) : '⚠ 出错了，请重试';
}
function showErrToast(raw){
  var box = document.getElementById('err-toast');
  document.getElementById('err-toast-text').textContent = humanizeError(raw);

async function send(){
  if(sending||blockedState)return;
  await recoverChatState(true);
  var txt=document.getElementById('txt').value.trim();
  if(!txt&&!pendingFile&&!pendingDoc)return;
  hideErrToast();
  lastUserMsgText = txt;
  sending=true;
  setSendBtn('stop');
  showTyping('正在发送…','sending');
  var fromHayana=(curAuthor==='hayana');
  var fd=new FormData();
  fd.append('author',curAuthor);
  if(txt) fd.append('content',txt);
  if(pendingFile) fd.append('image',pendingFile);
  var docToSend=pendingDoc;
  document.getElementById('txt').value='';
  document.getElementById('txt').style.height='auto';
  removeImg();
  removeDoc();
  try{
    if(docToSend){
      var dfd=new FormData(); dfd.append('file',docToSend);
      var ur=await fetch('/api/chat/upload_file',{method:'POST',body:dfd});
      var ud=await ur.json();
      if(ud&&ud.ok){ fd.append('file_url',ud.file_url); fd.append('file_name',ud.file_name); }
      else { showErrToast((ud&&ud.error)||'文件上传失败'); flashSendStatus('发送失败','error'); sending=false; setSendBtn('send'); return; }
    }
    var sendResp=await fetch('/api/chat/send',{method:'POST',body:fd});
    if(!sendResp.ok) throw new Error('发送失败：HTTP '+sendResp.status);
    var sendData=await sendResp.json();
    pendingGwUserMessageId=sendData.message_id||null;
    setSendStatus('已发送 · 等待回复…','sending');
    await loadMsgs(false);
    if(fromHayana){
      var baseId=0;
      (window.curMsgList||[]).forEach(function(m){ if(typeof m.id==='number'&&m.id>baseId) baseId=m.id; });
      showTyping('正在连接回复…','working');
      var streamErrMsg = null;
      try{
        var fullText='', capturedThink='';
        try{ var _sr=await streamReply(); fullText=(_sr&&_sr.text)||''; capturedThink=(_sr&&_sr.thinkBuf)||''; }
        catch(se){
          if(se && se.displayed){ _suppressLoadMsgs=true; throw se; }
          console.warn('stream failed, checking if reply was already saved before retrying', se);
          await loadMsgs(true);
          var hasNewReply=(window.curMsgList||[]).some(function(m){ return typeof m.id==='number'&&m.id>baseId&&isFy(m.author); });
          if(!hasNewReply){
            try{
              var fallbackBody=pendingGwUserMessageId?{user_message_id:pendingGwUserMessageId}:{};
              var gr=await fetch('/api/gw/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fallbackBody)});
              var gd=await gr.json();
              if(gd.error){ streamErrMsg = gd.error; fullText=''; }
              else { fullText=gd.content||''; streamErrMsg=null; }
            }catch(fe){ streamErrMsg = (fe&&fe.message)||streamErrMsg; }
          } else {
            streamErrMsg = null; // 实际已经存进库了，不是真错误
          }
        }
        await loadMsgs(false);
        if(streamState.cacheRead||streamState.cacheCreate||streamState.cacheSupported!==null) appendCacheInfo();
        if(fullText&&document.hidden) notify('Fyodor',fullText.slice(0,50));
        if(capturedThink&&capturedThink.trim()){
          (async function(){
            try{
              // 阶段3：思考结束时已抢先生成过摘要，直接复用，不再二次调用
              var summary=null;
              if(window._earlyThinkSummary){ try{ summary=await window._earlyThinkSummary; }catch(e){} }
              if(!summary){
                var ac=new AbortController(); var tid=setTimeout(function(){ac.abort();},28000);
                var sumResp=await fetch('/api/think/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thinking:capturedThink.slice(0,3000)}),signal:ac.signal});
                clearTimeout(tid);
                var sumData=await sumResp.json(); summary=(sumData.summary||'').trim();
              }
              if(!summary) return;
              fetch('/api/chat/think_summary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:summary})}).catch(function(){});
              var allTw=document.querySelectorAll('.msg-row.fy .think-wrap');
              var lastTw=allTw[allTw.length-1];
              if(lastTw){var tl=lastTw.querySelector('.tl');if(tl) tl.textContent=summary;}
            }catch(e){}
          })();
        }
      }catch(e){ if(!(e&&e.displayed)) console.error('gateway',e); }
      hideTyping();
    }
  }catch(e){ console.error('send',e); showErrToast(e&&e.message); flashSendStatus('发送失败','error'); }
  sending=false;
  setSendBtn('send');
  document.getElementById('txt').focus();
}

var cmdList=[], cmdCur=null, cmdRaf=null, cmdStartedLocal={};
function cmdFmt(ms){var s=Math.max(0,Math.round(ms/1000));var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
async function cmdPoll(){
  try{ var r=await fetch('/api/commands/pending'); var d=await r.json(); cmdList=d.commands||[]; }
  catch(e){ return; }
  cmdRender();
}
function cmdRender(){
  var f=document.getElementById('cmd-float'); if(!f) return;
  if(!cmdList.length){ cmdCur=null; f.style.display='none'; return; }
  var c=cmdList[0];  // 最早未完成的先做，其余排队
  if(c.started_at) c._startMs=c.started_at;
  else if(cmdStartedLocal[c.id]) c._startMs=cmdStartedLocal[c.id];
  else { c._startMs=Date.now(); cmdStartedLocal[c.id]=c._startMs; fetch('/api/commands/'+c.id+'/started',{method:'POST'}).catch(function(){}); }
  cmdCur=c;
  f.style.display='block';
  document.getElementById('cmd-title').textContent=c.title;
  var q=document.getElementById('cmd-queue');
  if(cmdList.length>1){ q.style.display='block'; q.textContent='+'+(cmdList.length-1); } else q.style.display='none';
  var st=new Date(c._startMs);
  document.getElementById('cmd-sub').textContent=('0'+st.getHours()).slice(-2)+':'+('0'+st.getMinutes()).slice(-2)+' 开始';
  if(!cmdRaf) cmdTick();
}
function cmdTick(){
  cmdRaf=requestAnimationFrame(cmdTick);
  if(!cmdCur){ cmdRaf=null; return; }
  var el=Date.now()-cmdCur._startMs;
  var card=document.getElementById('cmd-card'), t=document.getElementById('cmd-time'), bf=document.getElementById('cmd-barfill');
  var cd=cmdCur.countdown_seconds;
  if(cd){
    var total=cd*1000, remain=total-el;
    if(remain>=0){ card.classList.remove('over'); t.textContent=cmdFmt(remain); bf.style.transform='scaleX('+Math.min(1,el/total)+')'; }
    else{ card.classList.add('over'); t.textContent='+'+cmdFmt(-remain); bf.style.transform='scaleX(1)'; }
  } else { card.classList.remove('over'); t.textContent=cmdFmt(el); bf.style.transform='scaleX(0)'; }
}
async function cmdDone(){
  if(!cmdCur) return; var id=cmdCur.id;
  cmdList=cmdList.filter(function(x){return x.id!==id;});
  cmdRender();
  fetch('/api/commands/'+id+'/done',{method:'POST'}).catch(function(){});
}
async function cmdCancel(){
  if(!cmdCur) return; var id=cmdCur.id;
