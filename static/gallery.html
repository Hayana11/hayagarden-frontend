<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>gallery · 我们家</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F7F1EE">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F7F1EE;--card:#FFFFFF;--text:#4A3F3C;--muted:#8C7B76;
  --primary:#B76E79;--amber:#C08497;--amber-bg:#F9E8EE;--amber-text:#9C3B4A;--border:#F0E6E2;
  --rose:#B76E79;--pink-soft:#F9E8EE;--blue-soft:#E7EFF8;--sand:#D7BA87;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;}
.hd{flex-shrink:0;background:rgba(247,241,238,.97);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;border-bottom:.5px solid var(--border);}
.hd-title{font-family:Georgia,serif;font-size:20px;color:var(--text);letter-spacing:.5px;}
.hd-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.gsearch{width:100%;margin-top:9px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:13px;color:var(--text);font-family:inherit;outline:none;}
.gsearch:focus{border-color:rgba(183,110,121,.45);}
.ph .emo{position:absolute;top:6px;left:6px;background:rgba(192,132,151,.92);color:#fff;font-size:10px;padding:2px 7px;border-radius:9px;}
.ph .star{position:absolute;bottom:6px;right:6px;color:#F3A9BC;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.alb.add{color:var(--amber);border-style:dashed;}
.albums{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 6px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.albums::-webkit-scrollbar{display:none;}
.alb{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s;}
.alb.on{background:var(--amber-bg);border-color:rgba(192,132,151,.5);color:var(--amber-text);font-weight:600;}
.alb .n{opacity:.55;font-size:11px;margin-left:3px;}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 90px;align-content:start;}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;aspect-ratio:3/4;}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.ph .note{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;padding:14px 8px 7px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ph .src{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:1.9;}
.empty .ti{font-size:34px;opacity:.4;display:block;margin-bottom:10px;}
/* photo detail: light post card */
.lb{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(247,241,238,.97);z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);}
.lb.on{display:block;}
.post{max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 10px 30px rgba(183,110,121,.10);overflow:hidden;}
.post-hd{display:flex;align-items:center;padding:12px 12px 10px 14px;}
.post-av{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1.5px solid #E9B9C6;background:var(--pink-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;font-size:17px;}
.post-who{flex:1;min-width:0;margin-left:10px;}
.post-src{font-size:14px;color:var(--rose);font-weight:600;letter-spacing:.3px;}
.post-date{font-size:11.5px;color:var(--muted);margin-top:1px;}
.lb-close{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.post-img{margin:0 10px;border-radius:16px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;min-height:180px;}
.post-img img{display:block;max-width:100%;max-height:68vh;object-fit:contain;border-radius:16px;}
.post-acts{display:flex;align-items:center;padding:10px 8px 2px;}
.pa{border:none;background:none;color:var(--amber);cursor:pointer;font-family:inherit;display:flex;align-items:center;padding:6px 6px;font-size:12px;white-space:nowrap;}
.pa .ti{font-size:23px;}
.pa span{margin-left:3px;color:var(--muted);}
.pa.on{color:#E0607E;}
.pa.del{margin-left:auto;color:#C9A0A6;}
.pa-orig{text-decoration:none;}
.post-body{padding:4px 16px 16px;}
.lb-note{color:var(--text);font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
.lb-note.empty-note{color:var(--muted);font-size:13px;}
.lb-kw{display:flex;flex-wrap:wrap;margin-top:8px;}
.lb-kw span{font-size:11.5px;color:var(--rose);background:var(--pink-soft);padding:3px 10px;border-radius:10px;margin:0 6px 6px 0;}
.lb-meta{color:var(--muted);font-size:11.5px;margin-top:6px;padding-top:8px;border-top:1px solid #F3EBDD;}
/* nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(247,241,238,.97);backdrop-filter:blur(10px);border-top:.5px solid var(--border);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);z-index:50;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b8b0b8;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:2px 0;transition:color .18s;}
.ni.act{color:var(--amber);}
.ni i{font-size:19px;}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-title">Gallery</div>
  <div class="hd-sub" id="hd-sub">收藏的画面</div>
  <input class="gsearch" id="gsearch" type="text" placeholder="搜回忆… 雪 / 向日葵 / 她笑了"
         oninput="onSearch(this.value)">
</div>
<div class="albums" id="albums"></div>
<div class="grid" id="grid"><div class="empty">加载中…</div></div>

<div class="lb" id="lb" onclick="closeLb(event)">
  <article class="post" onclick="event.stopPropagation()">
    <div class="post-hd">
      <div class="post-av"><i class="ti ti-photo" id="lb-av"></i></div>
      <div class="post-who">
        <div class="post-src" id="lb-src">相册</div>
        <div class="post-date" id="lb-date"></div>
      </div>
      <button class="lb-close" aria-label="关闭" onclick="closeLb(event,true)">×</button>
    </div>
    <div class="post-img"><img id="lb-img" src="" alt=""></div>
    <div class="post-acts">
      <button class="pa" id="lb-fav" onclick="lbToggleFav()" aria-label="收藏"><i class="ti ti-heart"></i><span>收藏</span></button>
      <button class="pa" onclick="lbEditNote()" aria-label="编辑备注"><i class="ti ti-pencil"></i><span>备注</span></button>
      <button class="pa" onclick="lbMove()" aria-label="移动相册"><i class="ti ti-folder"></i><span>移动</span></button>
      <a class="pa pa-orig" id="lb-orig" href="#" target="_blank" rel="noopener" aria-label="查看原图"><i class="ti ti-arrows-maximize"></i><span>原图</span></a>
      <button class="pa del" onclick="lbDelete()" aria-label="删除"><i class="ti ti-trash"></i></button>
    </div>
    <div class="post-body">
      <div class="lb-note" id="lb-note"></div>
      <div class="lb-kw" id="lb-kw"></div>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
  </article>
</div>

<nav class="bnav">
  <a class="ni" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni act" href="/gallery"><i class="ti ti-photo"></i><span>gallery</span></a>
  <a class="ni" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>

<script>
var SRC_ICON = {chat:'ti-message-2', screenshot_chat:'ti-message-2', read_webpage:'ti-browser', upload:'ti-upload'};
var SRC_LABEL = {chat:'来自聊天', screenshot_chat:'聊天截图', read_webpage:'来自网页', upload:'上传'};
var curAlbum = null, albums = [], photosCache = [], searchQ = '', searchTimer = null;
var favMode = false, lbPid = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadAlbums(){
  try{
    var r = await fetch('/api/gallery/albums'); var d = await r.json();
    albums = d.albums || [];
  }catch(e){ albums = []; }
  var total = albums.reduce(function(a,b){ return a + (b.n||0); }, 0);
  var allOn = (curAlbum===null && !favMode);
  var html = '<button class="alb'+(allOn?' on':'')+'" onclick="pick(null)">全部<span class="n">'+total+'</span></button>';
  html += '<button class="alb'+(favMode?' on':'')+'" onclick="pickFav()">⭐ 收藏</button>';
  albums.forEach(function(a){
    html += '<button class="alb'+((curAlbum===a.id&&!favMode)?' on':'')+'" onclick="pick('+a.id+')">'+esc(a.name)+'<span class="n">'+(a.n||0)+'</span></button>';
  });
  html += '<button class="alb add" onclick="newAlbum()">＋ 新建</button>';
  document.getElementById('albums').innerHTML = html;
}

async function loadPhotos(){
  var url;
  if(searchQ){ url = '/api/gallery/photos?q=' + encodeURIComponent(searchQ); }
  else if(favMode){ url = '/api/gallery/photos?favorite=1'; }
  else{ url = '/api/gallery/photos' + (curAlbum!==null ? '?album_id='+curAlbum : ''); }
  var grid = document.getElementById('grid');
  try{
    var r = await fetch(url); var d = await r.json();
    photosCache = d.photos || [];
  }catch(e){ photosCache = []; }
  if(!photosCache.length){
    grid.innerHTML = searchQ
      ? '<div class="empty"><i class="ti ti-mood-search"></i>没找到「'+esc(searchQ)+'」相关的回忆</div>'
      : '<div class="empty"><i class="ti ti-photo-off"></i>还没有收藏的画面<br>在聊天里让费佳把喜欢的截图存进来</div>';
    document.getElementById('hd-sub').textContent = searchQ ? '搜索：'+esc(searchQ) : '收藏的画面';
    return;
  }
  document.getElementById('hd-sub').textContent = (searchQ ? '搜到 ' : '') + photosCache.length + ' 张画面';
  grid.innerHTML = photosCache.map(function(p){
    var ic = SRC_ICON[p.source_type] || 'ti-photo';
    var cap = p.summary || p.note || '';
    return '<div class="ph" onclick="openLb(\''+p.pid+'\')">'+
      '<img src="/api/gallery/photo/'+p.pid+'" alt="" loading="lazy">'+
      '<div class="src"><i class="ti '+ic+'"></i></div>'+
      (p.favorite ? '<div class="star">★</div>' : '')+
      (p.emotion ? '<div class="emo">'+esc(p.emotion)+'</div>' : '')+
      (cap ? '<div class="note">'+esc(cap)+'</div>' : '')+
    '</div>';
  }).join('');
}

function onSearch(v){
  searchQ = (v||'').trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadPhotos, 250);
}

function pick(id){ searchQ=''; document.getElementById('gsearch').value=''; favMode=false; curAlbum = id; loadAlbums(); loadPhotos(); }
function pickFav(){ searchQ=''; document.getElementById('gsearch').value=''; favMode=true; curAlbum=null; loadAlbums(); loadPhotos(); }

async function newAlbum(){
  var name = (prompt('新建相册，取个名字（如 她 / 我们 / 雪）') || '').trim();
  if(!name) return;
  await fetch('/api/gallery/album', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})});
  await loadAlbums();
}

function setLbNote(p){
  var el = document.getElementById('lb-note');
  var txt = p ? (p.note || p.summary || '') : '';
  el.textContent = txt || '还没有备注';
  el.className = 'lb-note' + (txt ? '' : ' empty-note');
}
function setLbFav(isFav){
  var favBtn = document.getElementById('lb-fav');
  favBtn.classList.toggle('on', !!isFav);
  favBtn.querySelector('i').className = 'ti ' + (isFav ? 'ti-heart-filled' : 'ti-heart');
  favBtn.querySelector('span').textContent = isFav ? '已收藏' : '收藏';
}
function openLb(pid){
  lbPid = pid;
  var p = photosCache.find(function(x){ return x.pid===pid; });
  var src = '/api/gallery/photo/'+pid;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-orig').href = src;
  var st = p ? p.source_type : '';
  document.getElementById('lb-av').className = 'ti ' + (SRC_ICON[st] || 'ti-photo');
  document.getElementById('lb-src').textContent = SRC_LABEL[st] || '相册';
  document.getElementById('lb-date').textContent = p ? (p.saved_at||'').slice(0,16) : '';
  setLbNote(p);
  var kws = (p && p.keywords) || [];
  document.getElementById('lb-kw').innerHTML = kws.map(function(k){ return '<span>#'+esc(k)+'</span>'; }).join('');
  var meta = document.getElementById('lb-meta');
  var parts = [];
  if(p && p.emotion) parts.push(p.emotion);
  if(p && p.note && p.summary) parts.push(p.summary);
  meta.textContent = parts.join(' · ');
  meta.style.display = parts.length ? '' : 'none';
  setLbFav(p && p.favorite);
  var lb = document.getElementById('lb');
  lb.scrollTop = 0;
  lb.classList.add('on');
}

async function lbToggleFav(){
  if(!lbPid) return;
  var r = await fetch('/api/gallery/photo/'+lbPid+'/favorite', {method:'POST'});
  var d = await r.json();
  setLbFav(d.favorite===1);
  var p = photosCache.find(function(x){ return x.pid===lbPid; });
  if(p) p.favorite = d.favorite;
  loadPhotos();
}
async function lbEditNote(){
  if(!lbPid) return;
  var p = photosCache.find(function(x){ return x.pid===lbPid; });
  var cur = (p && p.note) || '';
  var note = prompt('给这张画面写句备注', cur);
  if(note===null) return;
  await fetch('/api/gallery/photo/'+lbPid+'/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({note:note})});
  if(p){ p.note = note; setLbNote(p); }
  loadPhotos();
}
async function lbMove(){
  if(!lbPid) return;
  var name = (prompt('移动到哪本相册？（输入相册名，不存在会新建）') || '').trim();
  if(!name) return;
  var ar = await fetch('/api/gallery/album', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})});
  var ad = await ar.json();
  if(!ad.album_id) return;
  await fetch('/api/gallery/photo/'+lbPid+'/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({album_id:ad.album_id})});
  document.getElementById('lb').classList.remove('on');
  await loadAlbums(); loadPhotos();
}
async function lbDelete(){
  if(!lbPid) return;
  if(!confirm('删除这张画面？（相册和它的照片记忆都会一起删掉，不可恢复）')) return;
  await fetch('/api/gallery/photo/'+lbPid+'/delete', {method:'POST'});
  document.getElementById('lb').classList.remove('on');
  await loadAlbums(); loadPhotos();
}
function closeLb(e, force){
  if(force || e.target.id==='lb' || (e.target.classList && e.target.classList.contains('lb-close'))){
    document.getElementById('lb').classList.remove('on');
    document.getElementById('lb-img').src = '';
  }
}

loadAlbums();
loadPhotos();
</script>
</body>
</html>
