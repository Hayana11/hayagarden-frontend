<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>gallery · 我们家</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F5F3EE;--card:#FFFFFF;--text:#1A1815;--muted:#9A958B;
  --primary:#7c6a8a;--amber:#d4a574;--amber-bg:#fdf4e7;--amber-text:#412402;--border:#EDE9E0;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;}
.hd{flex-shrink:0;background:rgba(245,243,238,.97);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;border-bottom:.5px solid var(--border);}
.hd-title{font-family:Georgia,serif;font-size:20px;color:var(--text);letter-spacing:.5px;}
.hd-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.gsearch{width:100%;margin-top:9px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:13px;color:var(--text);font-family:inherit;outline:none;}
.gsearch:focus{border-color:rgba(212,165,116,.5);}
.ph .emo{position:absolute;top:6px;left:6px;background:rgba(212,165,116,.92);color:#fff;font-size:10px;padding:2px 7px;border-radius:9px;}
.lb-kw{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.lb-kw span{font-size:11px;color:#d4a574;background:rgba(212,165,116,.16);padding:2px 9px;border-radius:9px;}
.albums{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 6px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.albums::-webkit-scrollbar{display:none;}
.alb{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s;}
.alb.on{background:var(--amber-bg);border-color:rgba(212,165,116,.5);color:var(--amber-text);font-weight:600;}
.alb .n{opacity:.55;font-size:11px;margin-left:3px;}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 90px;align-content:start;}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;aspect-ratio:3/4;}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.ph .note{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;padding:14px 8px 7px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ph .src{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:1.9;}
.empty .ti{font-size:34px;opacity:.4;display:block;margin-bottom:10px;}
/* lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.lb.on{display:flex;}
.lb img{max-width:100%;max-height:80vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);}
.lb-note{color:#eee;font-size:13px;margin-top:14px;text-align:center;max-width:90%;line-height:1.6;}
.lb-meta{color:#999;font-size:11px;margin-top:6px;}
.lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:18px;color:#fff;background:rgba(255,255,255,.15);border:none;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(245,243,238,.97);backdrop-filter:blur(10px);border-top:.5px solid var(--border);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);z-index:50;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b8b0b8;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:2px 0;transition:color .18s;}
.ni.act{color:var(--amber);}
.ni i{font-size:19px;}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-title">Gallery</div>
  <div class="hd-sub" id="hd-sub">收藏的画面</div>
  <input class="gsearch" id="gsearch" type="text" placeholder="搜回忆… 雪 / 向日葵 / 她笑了"
         oninput="onSearch(this.value)">
</div>
<div class="albums" id="albums"></div>
<div class="grid" id="grid"><div class="empty">加载中…</div></div>

<div class="lb" id="lb" onclick="closeLb(event)">
  <button class="lb-close" onclick="closeLb(event,true)">×</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-note" id="lb-note"></div>
  <div class="lb-kw" id="lb-kw"></div>
  <div class="lb-meta" id="lb-meta"></div>
</div>

<nav class="bnav">
  <a class="ni" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni" href="/calendar"><i class="ti ti-calendar"></i><span>calendar</span></a>
  <a class="ni act" href="/gallery"><i class="ti ti-photo"></i><span>gallery</span></a>
  <a class="ni" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>

<script>
var SRC_ICON = {chat:'ti-message-2', screenshot_chat:'ti-message-2', read_webpage:'ti-browser', upload:'ti-upload'};
var curAlbum = null, albums = [], photosCache = [], searchQ = '', searchTimer = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadAlbums(){
  try{
    var r = await fetch('/api/gallery/albums'); var d = await r.json();
    albums = d.albums || [];
  }catch(e){ albums = []; }
  var total = albums.reduce(function(a,b){ return a + (b.n||0); }, 0);
  var html = '<button class="alb'+(curAlbum===null?' on':'')+'" onclick="pick(null)">全部<span class="n">'+total+'</span></button>';
  albums.forEach(function(a){
    html += '<button class="alb'+(curAlbum===a.id?' on':'')+'" onclick="pick('+a.id+')">'+esc(a.name)+'<span class="n">'+(a.n||0)+'</span></button>';
  });
  document.getElementById('albums').innerHTML = html;
}

async function loadPhotos(){
  var url;
  if(searchQ){ url = '/api/gallery/photos?q=' + encodeURIComponent(searchQ); }
  else{ url = '/api/gallery/photos' + (curAlbum!==null ? '?album_id='+curAlbum : ''); }
  var grid = document.getElementById('grid');
  try{
    var r = await fetch(url); var d = await r.json();
    photosCache = d.photos || [];
  }catch(e){ photosCache = []; }
  if(!photosCache.length){
    grid.innerHTML = searchQ
      ? '<div class="empty"><i class="ti ti-mood-search"></i>没找到「'+esc(searchQ)+'」相关的回忆</div>'
      : '<div class="empty"><i class="ti ti-photo-off"></i>还没有收藏的画面<br>在聊天里让费佳把喜欢的截图存进来</div>';
    document.getElementById('hd-sub').textContent = searchQ ? '搜索：'+esc(searchQ) : '收藏的画面';
    return;
  }
  document.getElementById('hd-sub').textContent = (searchQ ? '搜到 ' : '') + photosCache.length + ' 张画面';
  grid.innerHTML = photosCache.map(function(p){
    var ic = SRC_ICON[p.source_type] || 'ti-photo';
    var cap = p.summary || p.note || '';
    return '<div class="ph" onclick="openLb(\''+p.pid+'\')">'+
      '<img src="/api/gallery/photo/'+p.pid+'" alt="" loading="lazy">'+
      '<div class="src"><i class="ti '+ic+'"></i></div>'+
      (p.emotion ? '<div class="emo">'+esc(p.emotion)+'</div>' : '')+
      (cap ? '<div class="note">'+esc(cap)+'</div>' : '')+
    '</div>';
  }).join('');
}

function onSearch(v){
  searchQ = (v||'').trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadPhotos, 250);
}

function pick(id){ searchQ=''; document.getElementById('gsearch').value=''; curAlbum = id; loadAlbums(); loadPhotos(); }

function openLb(pid){
  var p = photosCache.find(function(x){ return x.pid===pid; });
  document.getElementById('lb-img').src = '/api/gallery/photo/'+pid;
  document.getElementById('lb-note').textContent = p ? (p.summary || p.note || '') : '';
  var kws = (p && p.keywords) || [];
  document.getElementById('lb-kw').innerHTML = kws.map(function(k){ return '<span>'+esc(k)+'</span>'; }).join('');
  var meta = p ? (p.saved_at||'').slice(0,16) : '';
  if(p && p.emotion) meta = p.emotion + ' · ' + meta;
  document.getElementById('lb-meta').textContent = meta;
  document.getElementById('lb').classList.add('on');
}
function closeLb(e, force){
  if(force || e.target.id==='lb' || (e.target.classList && e.target.classList.contains('lb-close'))){
    document.getElementById('lb').classList.remove('on');
    document.getElementById('lb-img').src = '';
  }
}

loadAlbums();
loadPhotos();
</script>
</body>
</html>
