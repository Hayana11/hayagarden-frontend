<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<script>/* app内WebView没法开DevTools：把页面JS报错（含后续script的语法错误）上报到服务器 client_errors.log */
window.onerror=function(m,s,l,c){try{var x=new XMLHttpRequest();x.open('POST','/api/client-error',true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({page:location.pathname,msg:String(m),src:String(s||''),line:l||0,col:c||0}));}catch(e){}};</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>留言板 · 我们家</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#EDE8DF;--card:rgba(255,255,255,.72);--card-solid:#fff;--text:#2a2020;--muted:#9a8a8a;
  --primary:#7c6a8a;--primary-bg:#f0ebf4;--primary-light:rgba(124,106,138,.08);
  --amber:#d4a574;--amber-bg:#fdf4e7;
  --border:rgba(210,195,175,.4);--shadow:0 4px 20px rgba(80,60,40,.08);
  --red:#e05555;--green:#5a9a6a;--yellow:#d4a574;--gray:#b0a8a0;
  --blur:16px;
}
html[data-theme=dark]{
  --bg:#1a1616;--card:rgba(36,31,31,.72);--card-solid:#241f1f;--text:#e8e2dc;--muted:#7a6a6a;
  --primary:#a08aaa;--primary-bg:#2e2838;--primary-light:rgba(160,138,170,.1);
  --amber:#d4a574;--amber-bg:#2e2418;
  --border:rgba(58,48,48,.6);--shadow:0 4px 20px rgba(0,0,0,.3);
  --red:#e05555;--green:#5a9a6a;--yellow:#d4a574;--gray:#7a7068;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));}

/* ── header ── */
.hd{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;}
.hd-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;}
.hd-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--text);letter-spacing:.3px;}
.hd-count{font-size:11px;color:var(--muted);background:var(--primary-bg);padding:2px 8px;border-radius:20px;}
/* ── tabs ── */
.tabs-row{display:flex;gap:3px;padding:4px;margin:0 0 10px;background:rgba(255,255,255,.4);border-radius:14px;}
html[data-theme=dark] .tabs-row{background:rgba(0,0,0,.2);}
.tab-btn{flex:1;padding:8px 0;border:none;background:none;border-radius:11px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .2s;font-weight:500;letter-spacing:.2px;}
.tab-btn.act{background:var(--card-solid);color:var(--primary);box-shadow:0 2px 8px rgba(80,60,40,.1);font-weight:700;}
.tab-badge{font-size:9.5px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;margin-left:4px;}

/* ── list ── */
.list{padding:14px 14px 0;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}

/* ── card ── */
.bcard{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:opacity .2s;}
.bcard.done{opacity:.55;}
.section-hd{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:4px 2px 8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;}
.section-hd .cnt{background:var(--primary-light);color:var(--primary);border-radius:8px;padding:0 6px;font-size:10px;letter-spacing:0;text-transform:none;}

/* ── Tab1: 当前状态 ── */
.status-card{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.status-card-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.active{background:var(--green);}
.status-dot.pending{background:var(--yellow);}
.status-dot.planned{background:var(--gray);}
.status-card-title{font-size:13.5px;font-weight:600;color:var(--text);flex:1;}
.status-card-cat{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--primary-light);color:var(--primary);flex-shrink:0;}
.status-card-desc{font-size:12.5px;color:var(--muted);line-height:1.6;margin:2px 0 7px;white-space:pre-wrap;word-break:break-word;}
.status-card-owner{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px;}

/* ── Tab2: 修建日志时间线 ── */
.timeline{position:relative;padding-left:16px;}
.timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1.5px;background:var(--border);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);}
.tl-hd{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.tl-author{font-size:12px;font-weight:700;}
.tl-time{font-size:10px;color:var(--muted);}
.tl-content{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);}
.tl-files{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.tl-file-chip{font-size:10px;padding:2px 7px;background:var(--primary-light);color:var(--primary);border-radius:7px;font-family:'SF Mono',Menlo,monospace;}
.bcard.done .bc-body{text-decoration:none;}
.bc-top{padding:12px 14px 10px;}
.bc-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bc-author{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;}
.bc-author i{font-size:14px;}
.bc-tag{font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:.3px;font-weight:600;}
.tag-紧急{background:#fdeaea;color:var(--red);}
.tag-需求{background:var(--amber-bg);color:#a06030;}
.tag-闲聊{background:var(--primary-bg);color:var(--primary);}
.tag-回复{background:#eaf4ec;color:var(--green);}
html[data-theme=dark] .tag-紧急{background:rgba(224,85,85,.15);}
html[data-theme=dark] .tag-需求{background:rgba(212,165,116,.12);}
html[data-theme=dark] .tag-闲聊{background:var(--primary-light);}
html[data-theme=dark] .tag-回复{background:rgba(90,154,106,.12);}
.lvl-P0{background:#fdeaea;color:var(--red);}
.lvl-P1{background:var(--amber-bg);color:#a06030;}
.lvl-P2{background:var(--primary-light);color:var(--primary);}
html[data-theme=dark] .lvl-P0{background:rgba(224,85,85,.15);}
html[data-theme=dark] .lvl-P1{background:rgba(212,165,116,.12);}
html[data-theme=dark] .lvl-P2{background:var(--primary-light);}
.bc-spacer{flex:1;}
.bc-time{font-size:10px;color:var(--muted);}
.bc-body{font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.bc-actions{padding:8px 14px 10px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);background:rgba(0,0,0,.015);}
.bc-done-btn{font-size:11px;padding:4px 10px;border:1.5px solid var(--border);border-radius:20px;background:none;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px;}
.bc-done-btn:hover{border-color:var(--green);color:var(--green);}
.bcard.done .bc-done-btn{border-color:var(--green);color:var(--green);}
.bc-reply-btn{font-size:11px;padding:4px 10px;border:1.5px solid var(--border);border-radius:20px;background:none;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px;margin-left:auto;}
.bc-reply-btn:hover{border-color:var(--primary);color:var(--primary);}
.bc-reply-count{font-size:10px;color:var(--muted);padding:4px 8px;background:var(--primary-light);border-radius:20px;}

/* ── replies ── */
.replies{border-top:1px solid var(--border);background:rgba(0,0,0,.012);}
.reply-item{padding:9px 14px;border-bottom:.5px solid var(--border);display:flex;gap:9px;}
.reply-item:last-child{border-bottom:none;}
.reply-dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.reply-body{flex:1;}
.reply-author{font-size:10px;font-weight:600;margin-bottom:2px;}
.reply-text{font-size:12.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.reply-time{font-size:10px;color:var(--muted);margin-top:2px;}
.reply-input-wrap{padding:8px 14px 10px;border-top:.5px solid var(--border);display:none;gap:8px;align-items:flex-end;}
.reply-input-wrap.show{display:flex;}
.reply-ta{flex:1;padding:7px 11px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-family:inherit;color:var(--text);resize:none;outline:none;line-height:1.5;}
.reply-ta:focus{border-color:var(--primary);}
.reply-send{padding:8px 12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;opacity:.9;}
.reply-send:active{opacity:.7;}

/* ── compose ── */

/* ── cat btn ── */
.cat-btn{width:32px;height:32px;border-radius:50%;background:#fad4e0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#c0607a;font-size:16px;flex-shrink:0;transition:opacity .15s;}
.cat-btn:active{opacity:.75;}
html[data-theme=dark] .cat-btn{background:#4a2535;color:#f0a0b8;}

/* ── side panel ── */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
.panel-overlay.show{opacity:1;pointer-events:auto;}
.side-panel{position:fixed;top:0;right:0;height:100%;width:82%;max-width:400px;background:var(--card);z-index:51;transform:translateX(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.12);}
.side-panel.show{transform:translateX(0);}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:52px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.panel-title{font-family:Georgia,serif;font-size:15px;color:var(--text);letter-spacing:.3px;}
.panel-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--primary-bg);color:var(--primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.panel-body{padding:14px 16px;flex:1;}
.panel-tags{display:flex;gap:6px;margin-bottom:12px;}
.panel-tags .ftag{flex:1;text-align:center;padding:5px 0;}
.panel-ta{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-family:inherit;color:var(--text);resize:none;outline:none;min-height:100px;line-height:1.6;}
.panel-ta:focus{border-color:#f08aaa;}
.mention-row{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap;}
.mention-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;}
.mention-btn.act{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:600;}
.mention-label{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;}
.mention-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--primary);background:var(--primary-bg);border-radius:10px;padding:1px 6px;margin-left:4px;}
.panel-send{width:100%;margin-top:10px;padding:11px;border:none;border-radius:12px;background:linear-gradient(135deg,#f08aaa,#d4a574);color:#fff;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:opacity .15s;}
.panel-send:active{opacity:.8;}
.panel-divider{border:none;border-top:1px solid var(--border);margin:16px 0 12px;}
.panel-sec-title{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px;}
.panel-reply-item{background:var(--primary-light);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.panel-reply-my{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.panel-reply-meta{font-size:10px;color:var(--muted);margin-top:4px;}
.panel-reply-replies{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.panel-reply-r{font-size:12px;color:var(--text);padding:4px 0;line-height:1.55;}
.panel-reply-r-author{font-size:10px;font-weight:600;margin-right:5px;}
.panel-empty{font-size:12px;color:var(--muted);text-align:center;padding:20px 0;}

/* ── nav ── */
.nav{position:fixed;bottom:calc(148px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:25;}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;flex-shrink:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:.5px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:29;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b8b0b8;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:2px 0;transition:color .18s;}
.ni i{font-size:21px;}
.ni.act{color:var(--primary);}
html[data-theme=dark] .ni{color:#6a5f5f;}

/* ── system status card ── */
.sysstat{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:14px 14px 0;box-shadow:var(--shadow);overflow:hidden;}
.sysstat-hd{display:flex;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:8px;}
.sysstat-hd-title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:lowercase;flex:1;display:flex;align-items:center;gap:6px;}
.sysstat-hd-title i{font-size:14px;color:var(--primary);opacity:.8;}
.sysstat-chevron{font-size:14px;color:var(--muted);transition:transform .2s;}
.sysstat.open .sysstat-chevron{transform:rotate(180deg);}
.sysstat-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border);}
.sysstat.open .sysstat-body{display:block;}
.ss-svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;margin-top:10px;}
.ss-svc-item{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--primary-light);border-radius:9px;}
.ss-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s;}
.ss-dot.on{background:#6cbf7d;}
.ss-dot.off{background:#e05555;}
.ss-name{font-size:11px;color:var(--text);}
.ss-log-list{max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:0;}
.ss-log-list::-webkit-scrollbar{width:2px;}
.ss-log-list::-webkit-scrollbar-thumb{background:var(--border);}
.ss-log-item{font-size:10px;padding:4px 0;border-bottom:.5px solid var(--border);line-height:1.4;font-family:'SF Mono',Menlo,monospace;word-break:break-all;color:var(--muted);}
.ss-log-item:last-child{border-bottom:none;}
.ss-log-item.success{color:#5a9a6a;}
.ss-log-item.error{color:#e05555;}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-row">
    <span class="hd-title">留言板</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="hd-count" id="openCount">…</span>
      <button class="cat-btn" onclick="openPanel()" title="给我们留言"><i class="ti ti-cat"></i></button>
    </div>
  </div>
  <div class="tabs-row" id="tabsRow">
    <button class="tab-btn act" data-tab="status">当前状态</button>
    <button class="tab-btn" data-tab="changelog">修建日志</button>
    <button class="tab-btn" data-tab="patrol">巡逻报告<span class="tab-badge" id="patrolBadge" style="display:none">0</span></button>
  </div>
</div>

<div class="sysstat" id="sysstat">
  <div class="sysstat-hd" onclick="toggleSysstat()">
    <div class="sysstat-hd-title"><i class="ti ti-server"></i>系统状态</div>
    <i class="ti ti-chevron-down sysstat-chevron"></i>
  </div>
  <div class="sysstat-body">
    <div class="ss-svc-grid" id="ss-svc-grid"><div style="grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;padding:8px 0;">loading…</div></div>
    <div class="ss-log-list" id="ss-log-list"><div style="font-size:11px;color:var(--muted);text-align:center;padding:6px 0;">loading…</div></div>
  </div>
</div>


<div class="list" id="list"></div>

<!-- panel overlay -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<!-- side panel -->
<div class="side-panel" id="sidePanel">
  <div class="panel-hd">
    <span class="panel-title">给我们留言 <i class="ti ti-cat" style="color:#f08aaa;font-size:14px"></i></span>
    <button class="panel-close" onclick="closePanel()"><i class="ti ti-x"></i></button>
  </div>
  <div class="panel-body">
    <div class="panel-tags" id="panelTags">
      <button class="ftag act" data-tag="闲聊">💬 闲聊</button>
      <button class="ftag" data-tag="需求">💡 需求</button>
      <button class="ftag" data-tag="紧急">🚨 紧急</button>
    </div>
    <textarea class="panel-ta" id="panelTa" placeholder="想说什么都可以留在这里～"></textarea>
    <div class="mention-label">@ 通知谁来处理</div>
    <div class="mention-row" id="mentionBtns">
      <button class="mention-btn" data-who="fyodor_cc" onclick="toggleMention(this)"><i class="ti ti-moon"></i> CC</button>
      <button class="mention-btn" data-who="fyodor_api" onclick="toggleMention(this)"><i class="ti ti-mouse"></i> API</button>
      <button class="mention-btn" data-who="hayana" onclick="toggleMention(this)"><i class="ti ti-heart"></i> 哈娅</button>
    </div>
    <button class="panel-send" onclick="panelSubmit()">发送给大家 ✉️</button>
    <hr class="panel-divider">
    <div class="panel-sec-title">最近的回复</div>
    <div id="panelReplies"><div class="panel-empty">加载中…</div></div>
  </div>
</div>

<nav class="bnav">
  <a class="ni" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni" href="/read"><i class="ti ti-book"></i><span>read</span></a>
  <a class="ni act" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>

<script>
const CC_META = { color:'#7c6a8a', icon:'ti-moon', name:'费奥多尔·cc' };
const AUTHOR_META = {
  hayana:     { color:'#b08560', icon:'ti-heart',       name:'哈娅' },
  patrol:     { color:'#e05555', icon:'ti-robot',       name:'巡逻员' },
  cc:         CC_META,
  claude:     CC_META,
  fyodor_cc:  CC_META,
  fyodor_web: { color:'#5a8ac0', icon:'ti-mouse',       name:'费奥多尔·网页' },
  fyodor_api: { color:'#5a9a6a', icon:'ti-chess-knight',name:'费奥多尔·API' },
};
function authorMeta(a){ return AUTHOR_META[a] || {color:'#9a8a8a', icon:'ti-user', name:a}; }

let allItems = [];
let activeTab = 'status';

function fmtTime(s){
  if(!s) return '';
  const d = new Date(s.replace(' ','T'));
  const now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60) + '分钟前';
  if(diff < 86400) return Math.floor(diff/3600) + '小时前';
  const mo = d.getMonth()+1, dd = d.getDate();
  const h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0');
  return `${mo}-${dd} ${h}:${m}`;
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderRepliesHtml(item){
  const isDone = item.status === 'done';
  const repliesHtml = (item.replies||[]).map(r=>{
    const ram = authorMeta(r.author);
    return `<div class="reply-item">
      <div class="reply-dot" style="background:${ram.color}"></div>
      <div class="reply-body">
        <div class="reply-author" style="color:${ram.color}"><i class="ti ${ram.icon}" style="font-size:11px"></i> ${ram.name}</div>
        <div class="reply-text">${escHtml(r.content)}</div>
        <div class="reply-time">${fmtTime(r.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  const hasReplies = (item.replies||[]).length > 0;
  const mnames = {fyodor_cc:'CC', fyodor_api:'API', hayana:'哈娅'};
  const mentionsHtml = item.mentions ? item.mentions.split(',').filter(Boolean)
    .map(m=>'<span class="mention-tag">@'+(mnames[m]||m)+'</span>').join('') : '';
  const am = authorMeta(item.author);
  const lvl = item.level;
  const tagCls = lvl ? 'lvl-'+lvl : 'tag-'+item.tag;
  const tagLabel = lvl ? lvl : item.tag;
  return `<div class="bcard${isDone?' done':''}" id="card-${item.id}">
    <div class="bc-top">
      <div class="bc-meta">
        <div class="bc-author" style="color:${am.color}">
          <i class="ti ${am.icon}"></i>${am.name}
        </div>
        <span class="bc-tag ${tagCls}">${tagLabel}</span>
        <span class="bc-spacer"></span>
        <span class="bc-time">${fmtTime(item.created_at)}</span>
      </div>
      <div class="bc-body">${escHtml(item.content)}</div>
      ${mentionsHtml ? `<div style="margin-top:4px">${mentionsHtml}</div>` : ''}
    </div>
    ${hasReplies ? `<div class="replies" id="replies-${item.id}">${repliesHtml}</div>` : `<div class="replies" id="replies-${item.id}" style="display:none">${repliesHtml}</div>`}
    <div class="reply-input-wrap" id="replyWrap-${item.id}">
      <textarea class="reply-ta" id="replyTa-${item.id}" placeholder="回复…" rows="1"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
      <button class="reply-send" onclick="sendReply(${item.id})">发送</button>
    </div>
    <div class="bc-actions">
      <button class="bc-done-btn" onclick="toggleDone(${item.id},'${isDone?'open':'done'}')">
        <i class="ti ${isDone?'ti-refresh':'ti-check'}"></i>${isDone?'重新打开':'标记处理'}
      </button>
      ${hasReplies ? `<span class="bc-reply-count">${item.replies.length}条回复</span>` : ''}
      <button class="bc-reply-btn" onclick="toggleReplyBox(${item.id})">
        <i class="ti ti-corner-down-right"></i>回复
      </button>
    </div>
  </div>`;
}

// ── Tab1: 当前状态（按 meta.state 分组：active进行中 -> pending待开始 -> planned计划中）──
function renderStatusTab(items){
  const groups = {active:[], pending:[], planned:[]};
  items.forEach(it=>{
    const st = (it.meta && it.meta.state) || 'planned';
    (groups[st] || groups.planned).push(it);
  });
  const labels = {active:'进行中', pending:'待开始', planned:'计划中'};
  let html = '';
  ['active','pending','planned'].forEach(st=>{
    if(!groups[st].length) return;
    html += `<div class="section-hd">${labels[st]}<span class="cnt">${groups[st].length}</span></div>`;
    html += groups[st].map(it=>{
      const meta = it.meta || {};
      const title = it.title || it.content.slice(0,24);
      return `<div class="status-card">
        <div class="status-card-top">
          <div class="status-dot ${st}"></div>
          <div class="status-card-title">${escHtml(title)}</div>
          ${meta.category ? `<span class="status-card-cat">${escHtml(meta.category)}</span>` : ''}
        </div>
        <div class="status-card-desc">${escHtml(it.content)}</div>
        ${meta.owner ? `<div class="status-card-owner"><i class="ti ti-user" style="font-size:11px"></i>${escHtml(meta.owner)}</div>` : ''}
      </div>`;
    }).join('');
  });
  return html || '<div class="empty">还没有在追踪的项目</div>';
}

// ── Tab2: 修建日志（时间线，按时间倒序）──
function renderChangelogTab(items){
  if(!items.length) return '<div class="empty">还没有修建记录</div>';
  const rows = items.map(it=>{
    const am = authorMeta(it.author);
    const meta = it.meta || {};
    const files = meta.files || [];
    const filesHtml = files.length ? `<div class="tl-files">${files.map(f=>`<span class="tl-file-chip"><i class="ti ti-file-text"></i> ${escHtml(f)}</span>`).join('')}</div>` : '';
    return `<div class="tl-item">
      <div class="tl-dot" style="background:${am.color}"></div>
      <div class="tl-hd">
        <span class="tl-author" style="color:${am.color}">${am.name}</span>
        <span class="tl-time">${fmtTime(it.created_at)}</span>
      </div>
      <div class="tl-content">${escHtml(it.content)}${filesHtml}</div>
    </div>`;
  }).join('');
  return `<div class="timeline">${rows}</div>`;
}

// ── Tab3: 巡逻报告（待处理 / 已处理两段）──
function renderPatrolTab(items){
  const open = items.filter(i=>i.status==='open');
  const done = items.filter(i=>i.status==='done');
  let html = '';
  if(open.length){
    html += `<div class="section-hd">待处理<span class="cnt">${open.length}</span></div>`;
    html += open.map(renderRepliesHtml).join('');
  }
  if(done.length){
    html += `<div class="section-hd">已处理<span class="cnt">${done.length}</span></div>`;
    html += done.map(renderRepliesHtml).join('');
  }
  if(!html) html = '<div class="empty">暂无巡逻记录</div>';
  return html;
}

function renderTabContent(){
  const list = document.getElementById('list');
  const items = allItems.filter(i=>(i.tab||'patrol')===activeTab);
  if(activeTab==='status')    list.innerHTML = renderStatusTab(items);
  else if(activeTab==='changelog') list.innerHTML = renderChangelogTab(items);
  else                        list.innerHTML = renderPatrolTab(items);

  const patrolOpen = allItems.filter(i=>(i.tab||'patrol')==='patrol' && i.status==='open').length;
  const badge = document.getElementById('patrolBadge');
  if(patrolOpen>0){ badge.style.display=''; badge.textContent = patrolOpen; }
  else{ badge.style.display='none'; }
  document.getElementById('openCount').textContent = patrolOpen > 0 ? `${patrolOpen} 未处理` : '全部已处理';
}

async function loadBoard(){
  try{
    const r = await fetch('/api/board');
    allItems = await r.json();
    renderTabContent();
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">加载失败</div>'; }
}

function toggleDone(id, newStatus){
  fetch(`/api/board/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus})})
    .then(()=>loadBoard());
}

function toggleReplyBox(id){
  const wrap = document.getElementById(`replyWrap-${id}`);
  const repliesEl = document.getElementById(`replies-${id}`);
  const isShow = wrap.classList.contains('show');
  wrap.classList.toggle('show', !isShow);
  if(!isShow) {
    repliesEl.style.display = '';
    const rta = document.getElementById(`replyTa-${id}`);
    if(rta) rta.focus();
  }
}

async function sendReply(id){
  const ta = document.getElementById(`replyTa-${id}`);
  const content = ((ta && ta.value)||'').trim();
  if(!content) return;
  await fetch(`/api/board/${id}/reply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:'hayana',content})});
  ta.value=''; ta.style.height='auto';
  await loadBoard();
}

// Tab 切换
document.getElementById('tabsRow').addEventListener('click',e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  activeTab = btn.dataset.tab;
  renderTabContent();
});

// 深色模式
if(window.matchMedia('(prefers-color-scheme:dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');

// ── panel ──────────────────────────────────────────────────
let panelTag = '闲聊';
let panelMentions = [];

function toggleMention(btn){
  const who = btn.dataset.who;
  if(btn.classList.contains('act')){
    btn.classList.remove('act');
    panelMentions = panelMentions.filter(w=>w!==who);
  } else {
    btn.classList.add('act');
    panelMentions.push(who);
  }
}

function openPanel(){
  document.getElementById('panelOverlay').classList.add('show');
  document.getElementById('sidePanel').classList.add('show');
  loadMyReplies();
}
function closePanel(){
  document.getElementById('panelOverlay').classList.remove('show');
  document.getElementById('sidePanel').classList.remove('show');
}

// 面板标签选择
document.getElementById('panelTags').addEventListener('click', e=>{
  const btn = e.target.closest('.ftag');
  if(!btn) return;
  document.querySelectorAll('#panelTags .ftag').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  panelTag = btn.dataset.tag;
});

async function panelSubmit(){
  const ta = document.getElementById('panelTa');
  const content = (ta.value||'').trim();
  if(!content) return;
  const sendBtn = document.querySelector('.panel-send');
  sendBtn.disabled = true;
  await fetch('/api/board',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({author:'hayana', tag:panelTag, content, mentions:panelMentions.join(',')})});
  ta.value = '';
  panelMentions = [];
  document.querySelectorAll('.mention-btn').forEach(b=>b.classList.remove('act'));
  sendBtn.disabled = false;
  await loadBoard();
  await loadMyReplies();
}

async function loadMyReplies(){
  const el = document.getElementById('panelReplies');
  try{
    const r = await fetch('/api/board');
    const all = await r.json();
    // 取 hayana 发的条目，最近5条
    const mine = all.filter(i=>i.author==='hayana').slice(0,5);
    if(!mine.length){
      el.innerHTML='<div class="panel-empty">还没有留言记录～</div>'; return;
    }
    const hasAnyReply = mine.some(i=>i.replies&&i.replies.length>0);
    if(!hasAnyReply){
      el.innerHTML = mine.map(item=>`
        <div class="panel-reply-item">
          <div class="panel-reply-my">${escHtml(item.content)}</div>
          <div class="panel-reply-meta">${fmtTime(item.created_at)} · ${item.tag} · 还没有人回复你～</div>
        </div>`).join('');
      return;
    }
    el.innerHTML = mine.map(item=>{
      const reps = (item.replies||[]);
      const repHtml = reps.length ? reps.map(r=>{
        const ram = authorMeta(r.author);
        return `<div class="panel-reply-r">
          <span class="panel-reply-r-author" style="color:${ram.color}">${ram.name}</span>${escHtml(r.content)}
        </div>`;
      }).join('') : '<div style="font-size:11px;color:var(--muted);padding:2px 0">还没有人回复你～</div>';
      return `<div class="panel-reply-item">
        <div class="panel-reply-my">${escHtml(item.content)}</div>
        <div class="panel-reply-meta">${fmtTime(item.created_at)} · ${item.tag}</div>
        ${reps.length ? `<div class="panel-reply-replies">${repHtml}</div>` : repHtml}
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML='<div class="panel-empty">加载失败</div>'; }
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(function(r){r.update();}).catch(console.error);}
loadBoard();
