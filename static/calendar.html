<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<script>/* app内WebView没法开DevTools：把页面JS报错（含后续script的语法错误）上报到服务器 client_errors.log */
window.onerror=function(m,s,l,c){try{var x=new XMLHttpRequest();x.open('POST','/api/client-error',true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({page:location.pathname,msg:String(m),src:String(s||''),line:l||0,col:c||0}));}catch(e){}};</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>calendar · 我们家</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f8f8f6;--card:#fff;--text:#2a2020;--muted:#9a8a8a;
  --primary:#7c6a8a;--primary-bg:#f0ebf4;--primary-light:rgba(124,106,138,.08);
  --amber:#d4a574;--amber-bg:#fdf4e7;--amber-text:#412402;
  --border:#ece6e0;--shadow:0 1px 8px rgba(40,20,20,.07);
  --red:#c0444a;--green:#4a9a6a;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.hd{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding:44px 20px 0;}
.hd-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--text);letter-spacing:.3px;padding-bottom:10px;}
.tab-bar{display:flex;gap:0;border-bottom:1.5px solid var(--border);margin:0 -20px;}
.tab-btn{flex:1;padding:9px 0;border:none;background:none;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;font-family:inherit;letter-spacing:.3px;}
.tab-btn.act{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:lowercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title i{font-size:14px;color:var(--primary);opacity:.8;}
.empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:12px 0;}
.hd-cal{padding:20px 0 14px;text-align:center;}
.hd-cal h1{font-size:22px;font-weight:700;letter-spacing:2px;color:var(--text);}
.hd-cal h1 span{color:var(--primary);}
.hd-cal .sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.5px;}
.section{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.section h2{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;flex-shrink:0;}
.section h2 .dot.amber{background:var(--amber);}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-hd-title{font-size:15px;font-weight:700;color:var(--text);}
.cal-nav{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s;}
.cal-nav:hover{background:var(--primary-bg);color:var(--primary);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dh{font-size:11px;color:var(--muted);padding:4px 0;text-align:center;font-weight:500;}
.cal-day{font-size:14px;padding:7px 2px;text-align:center;cursor:pointer;border-radius:8px;transition:background .15s;line-height:1;}
.cal-day:not(:empty):hover{background:var(--primary-bg);}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700;}
.cal-day.sat,.cal-day.sun{color:var(--amber);}
.cd-list{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.cd-list::-webkit-scrollbar{display:none;}
.cd-card{position:relative;flex:0 0 auto;min-width:84px;max-width:120px;background:var(--primary-bg);border-radius:12px;padding:10px 14px 9px;text-align:center;}
.cd-em{font-size:15px;line-height:1;}
.cd-days{font-size:20px;font-weight:800;color:var(--primary);line-height:1.15;margin:3px 0 1px;}
.cd-days small{font-size:10px;font-weight:500;color:var(--muted);margin-left:1px;}
.cd-title{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd-del{position:absolute;top:-1px;right:-1px;width:20px;height:20px;border:none;border-radius:50%;background:none;color:var(--muted);opacity:.4;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;}
.cd-list.editing .cd-del{display:flex;}
.cd-list.editing .cd-card{background:var(--amber-bg);}
.cd-add-mini{flex:0 0 auto;width:64px;border-radius:12px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
.cd-add-mini:active{border-color:var(--primary);color:var(--primary);}
.cd-manage{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;padding:2px 4px;margin-left:auto;}
.cd-manage.act{color:var(--red);}
.pd-heart{position:absolute;bottom:1px;right:2px;font-size:8px;color:var(--amber);line-height:1;}
.ps-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:.5px solid var(--border);}
.ps-row:last-child{border-bottom:none;}
.ps-label{font-size:12px;color:var(--muted);}
.ps-val{font-size:13px;font-weight:600;color:var(--text);}
/* ── cycle hero 周期预测卡 ── */
.cycle-hero{background:linear-gradient(135deg,var(--primary-bg),#fdf0f0);border-radius:14px;padding:16px 16px 14px;margin-bottom:12px;}
.ch-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px;}
.ch-main{font-size:22px;font-weight:800;color:var(--text);line-height:1.2;}
.ch-main .ch-accent{color:var(--primary);}
.ch-main.late{color:var(--red);}
.ch-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.ch-bar{height:7px;background:rgba(124,106,138,.15);border-radius:4px;overflow:hidden;margin-top:12px;}
.ch-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .5s ease;}
.ch-fill.late{background:var(--red);}
.ch-bar-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px;}
.ps-mini{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);}
.ps-mini b{color:var(--text);font-weight:600;}
/* ── todo 分组 ── */
.todo-group-hd{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:12px 0 2px;display:flex;align-items:center;gap:5px;}
.todo-group-hd:first-child{margin-top:0;}
.todo-group-hd.overdue{color:var(--red);}
.todo-group-hd.today-g{color:var(--primary);}
.todo-done-toggle{border:none;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit;padding:8px 0 2px;display:flex;align-items:center;gap:4px;width:100%;}
.todo-done-toggle i{font-size:13px;transition:transform .18s;}
.todo-done-toggle.open i{transform:rotate(90deg);}
/* ── ledger 统计折叠 ── */
.ledger-stats-toggle{display:flex;align-items:center;gap:6px;width:100%;border:none;background:var(--primary-light);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--primary);cursor:pointer;font-family:inherit;margin-bottom:12px;}
.ledger-stats-toggle i.chev{margin-left:auto;transition:transform .18s;font-size:14px;}
.ledger-stats-toggle.open i.chev{transform:rotate(90deg);}
.ledger-stats-body{display:none;}
.ledger-stats-body.show{display:block;}
.ledger-day-hd{font-size:10.5px;color:var(--muted);letter-spacing:1px;margin:10px 0 2px;padding-bottom:3px;border-bottom:.5px solid var(--border);}
.ledger-day-hd:first-child{margin-top:0;}
.pd-btns{display:flex;gap:10px;margin-top:14px;}
.pd-btn{flex:1;padding:11px;border-radius:11px;border:none;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity .15s;}
.pd-btn:active{opacity:.7;}
.pd-btn.period{background:rgba(220,100,100,0.15);color:#b44;}
.pd-btn.sex{background:var(--amber-bg);color:var(--amber-text);}
.dm-rec{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border);font-size:13px;}
.dm-rec:last-child{border-bottom:none;}
.dm-del{border:none;background:none;color:#e05555;font-size:12px;cursor:pointer;font-family:inherit;}
.dm-add-row{display:flex;gap:8px;margin-top:12px;}
.dm-add-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);}
.dm-add-btn:active{background:var(--primary-bg);}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:50;padding:7px 0 calc(7px + env(safe-area-inset-bottom,0px));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b0a0aa;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:4px 0;transition:color .18s;}
.ni i{font-size:21px;}
.ni.act{color:var(--primary);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:flex-end;justify-content:center;}
.mo.show{display:flex;}
.mb{background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(44px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;}
.mb h3{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;color:var(--text);}
.mb select,.mb input{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-family:inherit;color:var(--text);margin-bottom:10px;outline:none;-webkit-appearance:none;}
.mb select:focus,.mb input:focus{border-color:var(--primary);}
.mbtns{display:flex;gap:10px;margin-top:4px;}
.mbtns button{flex:1;padding:12px;border-radius:11px;border:none;font-size:14px;cursor:pointer;font-family:inherit;}
.bcn{background:var(--border);color:var(--muted);}
.bsb{background:var(--primary);color:#fff;}
.cal-day.pd:not(.today){background:rgba(220,100,100,.18);color:#b44;}
.cal-day.pd-pred:not(.today){outline:1.5px dashed rgba(220,100,100,.45);outline-offset:-2px;color:var(--text);}
.cal-day.ovul:not(.today){background:rgba(124,106,138,.25);color:var(--primary);}
.cal-day.fertile:not(.today){background:rgba(124,106,138,.1);}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.cal-legend-item{display:flex;align-items:center;gap:5px;}
.cal-legend-dot{width:13px;height:13px;border-radius:4px;flex-shrink:0;}
.cal-legend-dot.pd{background:rgba(220,100,100,.18);}
.cal-legend-dot.pd-pred{background:transparent;outline:1.5px dashed rgba(220,100,100,.45);outline-offset:-1px;}
.cal-legend-dot.ovul{background:rgba(124,106,138,.25);}
.cal-legend-dot.fertile{background:rgba(124,106,138,.1);}
/* ── to-do list ── */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border);}
.todo-item:last-child{border-bottom:none;}
.todo-cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);background:none;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.todo-cb.checked{background:var(--primary);border-color:var(--primary);}
.todo-cb.checked::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:13px;line-height:1.5;color:var(--text);word-break:break-word;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted);}
.todo-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.todo-due{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--amber-bg);color:var(--amber-text);letter-spacing:.2px;}
.todo-due.overdue{background:rgba(224,85,85,.12);color:var(--red);}
.todo-author{font-size:12px;color:var(--muted);}
.todo-del{background:none;border:none;color:var(--border);cursor:pointer;font-size:13px;padding:2px;flex-shrink:0;transition:color .15s;margin-top:1px;}
.todo-del:hover{color:var(--red);}
.todo-add{margin-top:14px;border-top:.5px solid var(--border);padding-top:14px;}
.todo-add-inp{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-family:inherit;color:var(--text);outline:none;margin-bottom:8px;}
.todo-add-inp:focus{border-color:var(--primary);}
.todo-add-row2{display:flex;gap:8px;align-items:center;}
.todo-date-btn{flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-family:inherit;color:var(--muted);outline:none;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap;}
.todo-date-btn.set{color:var(--text);border-color:var(--primary);}
.cal-day.sel:not(.today){background:var(--primary);color:#fff;}
.todo-authors{display:flex;gap:5px;}
.ta-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s;flex-shrink:0;}
.ta-btn.act{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.todo-add-btn{padding:7px 14px;border:none;border-radius:9px;background:var(--primary);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.cal-day{position:relative;}
.todo-dot{position:absolute;bottom:2px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:.7;}
.expense-dot{position:absolute;bottom:2px;left:3px;width:4px;height:4px;border-radius:50%;background:var(--amber);opacity:.85;}
.ledger-trend{display:flex;align-items:flex-end;gap:5px;height:54px;margin:4px 0 14px;}
.lt-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;}
.lt-bar{width:100%;max-width:22px;background:var(--primary-bg);border-radius:4px 4px 0 0;min-height:2px;transition:height .2s;}
.lt-bar.cur{background:var(--primary);}
.lt-label{font-size:9px;color:var(--muted);margin-top:3px;}
.dm-todo-sep{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:12px 0 6px;padding-top:10px;border-top:.5px solid var(--border);}
.dm-todo-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border);font-size:12.5px;}
.dm-todo-item:last-child{border-bottom:none;}
.dm-todo-cb{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.dm-todo-cb.checked{background:var(--primary);border-color:var(--primary);}
.dm-todo-cb.checked::after{content:'';width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.dm-todo-text{flex:1;color:var(--text);}
.dm-todo-item.done .dm-todo-text{text-decoration:line-through;color:var(--muted);}
/* ── ledger 记账 ── */
.ledger-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ledger-month-title{font-size:15px;font-weight:700;color:var(--text);}
.ledger-summary{display:flex;gap:8px;margin-bottom:14px;}
.ledger-sum-item{flex:1;background:var(--primary-bg);border-radius:10px;padding:10px 6px;text-align:center;}
.ledger-sum-label{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-bottom:3px;}
.ledger-sum-val{font-size:17px;font-weight:800;line-height:1.1;}
.ledger-sum-val.exp{color:var(--red);}
.ledger-sum-val.inc{color:var(--green);}
.ledger-sum-val.bal.pos{color:var(--green);}
.ledger-sum-val.bal.neg{color:var(--red);}
.ledger-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--border);font-size:13px;}
.ledger-row:last-child{border-bottom:none;}
.ledger-date{font-size:11px;color:var(--muted);width:36px;flex-shrink:0;}
.ledger-cat{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--primary-bg);color:var(--primary);flex-shrink:0;}
.ledger-note{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ledger-amt{font-weight:700;flex-shrink:0;}
.ledger-amt.exp{color:var(--red);}
.ledger-amt.inc{color:var(--green);}
.ledger-del{border:none;background:none;color:var(--border);cursor:pointer;font-size:13px;flex-shrink:0;padding:2px;transition:color .15s;}
.ledger-del:hover{color:var(--red);}
.ledger-add{display:block;width:100%;margin-top:14px;padding:11px;border-radius:11px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;}
.ledger-add:hover{border-color:var(--primary);color:var(--primary);}
/* ── wishlist 心愿单 ── */
.wish-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 0;border-bottom:.5px solid var(--border);font-size:13px;}
.wish-row:last-child{border-bottom:none;}
.wish-row.bought{opacity:.4;}
.wish-row.bought .wish-name{text-decoration:line-through;}
.wish-who{font-size:14px;flex-shrink:0;color:var(--primary);width:18px;text-align:center;}
.wish-name{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wish-price{font-weight:700;color:var(--text);flex-shrink:0;font-size:12px;}
.wish-link{color:var(--muted);flex-shrink:0;font-size:13px;}
.wish-reason{flex-basis:100%;padding-left:42px;font-size:11px;color:var(--muted);line-height:1.4;margin-top:-2px;}
.wish-check{border:1.5px solid var(--border);background:none;cursor:pointer;color:var(--border);flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;padding:0;}
.wish-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.wish-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;flex-shrink:0;padding:8px 4px;transition:color .15s;}
.wish-del:hover{color:var(--red);}
.wish-add{display:block;width:100%;margin-top:14px;padding:11px;border-radius:11px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;}
.wish-add:hover{border-color:var(--primary);color:var(--primary);}
.type-toggle{display:flex;border-radius:11px;overflow:hidden;border:1.5px solid var(--border);margin-bottom:10px;}
.type-btn{flex:1;padding:10px;border:none;background:none;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s;}
.type-btn.act.exp{background:#fce8e8;color:var(--red);font-weight:600;}
.type-btn.act.inc{background:#e8f5ee;color:var(--green);font-weight:600;}
/* ── ledger 增强 ── */
.ledger-compare{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 12px;}
.cmp-up{color:var(--red);font-weight:600;}.cmp-down{color:var(--green);font-weight:600;}
.budget-bar-wrap{margin-bottom:14px;}
.budget-bar-hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;}

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Tab 切换 ────────────────────────────────────────────────
var currentTab = 'calendar';
function switchTab(name){
  currentTab = name;
  document.getElementById('tab-calendar').style.display = name==='calendar' ? '' : 'none';
  document.getElementById('tab-ledger').style.display   = name==='ledger'   ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('act', (i===0&&name==='calendar')||(i===1&&name==='ledger'));
  });
  if(name==='ledger'){ loadLedger(); loadWishlist(); }
}

// ── Calendar ────────────────────────────────────────────────
var calYear,calMonth;
(function(){var n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();}());
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS=['Mo','Tu','We','Th','Fr','Sa','Su'];
function pad2(n){return n<10?"0"+n:String(n);}
function renderCal(){
  var today=new Date();var first=new Date(calYear,calMonth,1);var last=new Date(calYear,calMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('cal-title').textContent=MONTHS[calMonth]+' '+calYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(calYear,calMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(calMonth+1),dd=pad2(day),ds=calYear+'-'+mm+'-'+dd;html+='<div class="'+cls+'" data-date="'+ds+'" onclick="openDayModal(\''+ds+'\')">'+'<span>'+day+'</span></div>';}
  document.getElementById('cal-grid').innerHTML=html;
}
function changeMonth(dir){
  calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
  if(typeof refreshPeriod==='function')refreshPeriod();
  loadCalExpenses();
}
renderCal();

// ── Todo date picker ─────────────────────────────────────────
var tdYear, tdMonth, tdSelectedDate=null;
function renderTDCal(){
  var today=new Date();var first=new Date(tdYear,tdMonth,1);var last=new Date(tdYear,tdMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('td-cal-title').textContent=MONTHS[tdMonth]+' '+tdYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(tdYear,tdMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&tdMonth===today.getMonth()&&tdYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(tdMonth+1),dd=pad2(day),ds=tdYear+'-'+mm+'-'+dd;if(ds===tdSelectedDate)cls+=' sel';html+='<div class="'+cls+'" onclick="pickTDDate(\''+ds+'\')"><span>'+day+'</span></div>';}
  document.getElementById('td-cal-grid').innerHTML=html;
}
function changeTDMonth(dir){tdMonth+=dir;if(tdMonth<0){tdMonth=11;tdYear--;}if(tdMonth>11){tdMonth=0;tdYear++;}renderTDCal();}
function openTDPicker(){var now=new Date();if(tdSelectedDate){var p=tdSelectedDate.split('-');tdYear=+p[0];tdMonth=+p[1]-1;}else{tdYear=now.getFullYear();tdMonth=now.getMonth();}renderTDCal();document.getElementById('tdmo').classList.add('show');}
function closeTDPicker(){document.getElementById('tdmo').classList.remove('show');}
function pickTDDate(ds){tdSelectedDate=ds;var p=ds.split('-');var btn=document.getElementById('todo-date-btn');btn.classList.add('set');document.getElementById('todo-date-label').textContent=(+p[1])+'月'+(+p[2])+'日';closeTDPicker();}
function clearTDDate(){tdSelectedDate=null;document.getElementById('todo-date-btn').classList.remove('set');document.getElementById('todo-date-label').textContent='日期';closeTDPicker();}
document.getElementById('tdmo').addEventListener('click',function(e){if(e.target===this)closeTDPicker();});

// ── Countdown date picker ────────────────────────────────────
var cdYear, cdMonth, cdSelectedDate=null;
function renderCDCal(){
  var today=new Date();var first=new Date(cdYear,cdMonth,1);var last=new Date(cdYear,cdMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('cd-cal-title').textContent=MONTHS[cdMonth]+' '+cdYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(cdYear,cdMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&cdMonth===today.getMonth()&&cdYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(cdMonth+1),dd=pad2(day),ds=cdYear+'-'+mm+'-'+dd;if(ds===cdSelectedDate)cls+=' sel';html+='<div class="'+cls+'" onclick="pickCDDate(\''+ds+'\')"><span>'+day+'</span></div>';}
  document.getElementById('cd-cal-grid').innerHTML=html;
}
function changeCDMonth(dir){cdMonth+=dir;if(cdMonth<0){cdMonth=11;cdYear--;}if(cdMonth>11){cdMonth=0;cdYear++;}renderCDCal();}
function openCDPicker(){var now=new Date();if(cdSelectedDate){var p=cdSelectedDate.split('-');cdYear=+p[0];cdMonth=+p[1]-1;}else{cdYear=now.getFullYear();cdMonth=now.getMonth();}renderCDCal();document.getElementById('cddpmo').classList.add('show');}
function closeCDPicker(){document.getElementById('cddpmo').classList.remove('show');}
function pickCDDate(ds){cdSelectedDate=ds;var p=ds.split('-');var btn=document.getElementById('cd-date-btn');btn.classList.add('set');document.getElementById('cd-date-label').textContent=(+p[0])+'年'+(+p[1])+'月'+(+p[2])+'日';closeCDPicker();}
function resetCDDate(){cdSelectedDate=null;document.getElementById('cd-date-btn').classList.remove('set');document.getElementById('cd-date-label').textContent='选择日期';}
document.getElementById('cddpmo').addEventListener('click',function(e){if(e.target===this)closeCDPicker();});

var cdManaging=false;
async function loadCD(){
  try{
    var r=await fetch('/api/countdowns');var d=await r.json();var cds=d.countdowns||[];
    var c=document.getElementById('cd-list');
    var addBtn='<button class="cd-add-mini" onclick="openCD()" title="添加">+</button>';
    if(!cds.length){c.innerHTML=addBtn;return;}
    c.innerHTML=cds.map(function(cd){
      return '<div class="cd-card">'
        +'<button class="cd-del" onclick="deleteCD('+cd.id+')" title="删除"><i class="ti ti-x"></i></button>'
        +'<div class="cd-em">'+(cd.emoji||'📅')+'</div>'
        +'<div class="cd-days">'+cd.days+'<small>'+(cd.type==='countup'?'天了':'天后')+'</small></div>'
        +'<div class="cd-title">'+escHtml(cd.title)+'</div></div>';
    }).join('')+addBtn;
    c.classList.toggle('editing',cdManaging);
  }catch(e){}
}
function toggleCDManage(){
  cdManaging=!cdManaging;
  document.getElementById('cd-list').classList.toggle('editing',cdManaging);
  var b=document.getElementById('cd-manage-btn');
  b.classList.toggle('act',cdManaging);
  b.textContent=cdManaging?'完成':'管理';
}
async function deleteCD(id){
  try{await fetch('/api/countdowns/'+id,{method:'DELETE'});await loadCD();}catch(e){}
}
function openCD(){document.getElementById('cdmo').classList.add('show');}
function closeCD(){document.getElementById('cdmo').classList.remove('show');}
document.getElementById('cdmo').addEventListener('click',function(e){if(e.target===this)closeCD();});
document.getElementById('day-modal').addEventListener('click',function(e){if(e.target===this)closeDayModal();});
async function submitCD(){var t=document.getElementById('cd-title-inp').value.trim();var date=cdSelectedDate;if(!t||!date)return;await fetch('/api/countdowns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,target_date:date,emoji:document.getElementById('cd-emoji').value||'📅',type:document.getElementById('cd-type').value})});document.getElementById('cd-title-inp').value='';document.getElementById('cd-emoji').value='';resetCDDate();closeCD();loadCD();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(function(r){r.update();}).catch(console.error);}
loadCD();

// ── To-Do List ──────────────────────────────────────────────
var TODO_AUTHOR_META = {
  hayana:     {color:'#7c6a8a', icon:'ti-heart'},
  fyodor_web: {color:'#d4a574', icon:'ti-mouse'},
  cc:         {color:'#5a9a6a', icon:'ti-moon'},
  fyodor_api: {color:'#c0956a', icon:'ti-chess-knight'},
};
var todos = [];
var pickedAuthor = '';
function todoAuthorMeta(a){ return TODO_AUTHOR_META[a] || null; }
function pickAuthor(btn){
  var a = btn.getAttribute('data-author');
  if(pickedAuthor === a){ pickedAuthor=''; btn.classList.remove('act'); return; }
  document.querySelectorAll('#todo-authors .ta-btn').forEach(function(b){ b.classList.remove('act'); });
  pickedAuthor = a; btn.classList.add('act');
}
function fmtDue(due){
  if(!due) return '';
  var today = new Date(); var ds = today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
  var cls = due < ds ? 'todo-due overdue' : 'todo-due';
  var parts = due.split('-'); var label = parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
  return '<span class="'+cls+'">'+label+'</span>';
}
var todoDoneOpen = false;
function todoItemHtml(t){
  var am = todoAuthorMeta(t.author);
  var authorHtml = am ? '<i class="ti '+am.icon+'" style="color:'+am.color+';font-size:12px" title="'+t.author+'"></i>' : '';
  var dueHtml = fmtDue(t.due_date);
  var meta = (dueHtml||authorHtml) ? '<div class="todo-meta">'+(dueHtml||'')+authorHtml+'</div>' : '';
  return '<div class="todo-item'+(t.done?' done':'') +'" id="ti-'+t.id+'">'
    +'<div class="todo-cb'+(t.done?' checked':'')+'" onclick="toggleTodo('+t.id+')"></div>'
    +'<div class="todo-body"><div class="todo-text">'+escHtml(t.content)+'</div>'+meta+'</div>'
    +'<button class="todo-del" onclick="deleteTodo('+t.id+')" title="删除"><i class="ti ti-x"></i></button>'
    +'</div>';
}
function renderTodos(){
  var el = document.getElementById('todo-list');
  if(!todos.length){ el.innerHTML = '<div class="empty-hint">还没有待办</div>'; renderCal(); return; }
  var t = new Date(); var ds = t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
  var overdue=[], today=[], upcoming=[], nodate=[], done=[];
  todos.forEach(function(td){
    if(td.done){ done.push(td); }
    else if(!td.due_date){ nodate.push(td); }
    else if(td.due_date < ds){ overdue.push(td); }
    else if(td.due_date === ds){ today.push(td); }
    else{ upcoming.push(td); }
  });
  var html = '';
  function group(cls, label, arr){
    if(!arr.length) return;
    html += '<div class="todo-group-hd '+cls+'">'+label+'</div>' + arr.map(todoItemHtml).join('');
  }
  group('overdue', '已过期 · '+overdue.length, overdue);
  group('today-g', '今天', today);
  group('', '接下来', upcoming);
  group('', '没定日期', nodate);
  if(done.length){
    html += '<button class="todo-done-toggle'+(todoDoneOpen?' open':'')+'" onclick="todoDoneOpen=!todoDoneOpen;renderTodos()">'
      +'<i class="ti ti-chevron-right"></i>已完成 '+done.length+'</button>';
    if(todoDoneOpen) html += done.map(todoItemHtml).join('');
  }
  el.innerHTML = html || '<div class="empty-hint">还没有待办</div>';
  renderCal();
}
async function loadTodos(){
  try{
    var r = await fetch('/api/todos');
    var d = await r.json();
    todos = d.todos || [];
    renderTodos();
  }catch(e){ document.getElementById('todo-list').innerHTML='<div class="empty-hint">加载失败</div>'; }
}
async function addTodo(){
  var inp = document.getElementById('todo-inp');
  var content = inp.value.trim();
  if(!content) return;
  var body = {content: content};
  if(tdSelectedDate) body.due_date = tdSelectedDate;
  if(pickedAuthor) body.author = pickedAuthor;
  try{
    await fetch('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    inp.value=''; clearTDDate();
    pickedAuthor='';
    document.querySelectorAll('#todo-authors .ta-btn').forEach(function(b){ b.classList.remove('act'); });
    await loadTodos();
  }catch(e){}
}
async function toggleTodo(id){
  try{ await fetch('/api/todos/'+id+'/toggle',{method:'POST'}); await loadTodos(); }catch(e){}
}
async function deleteTodo(id){
  try{ await fetch('/api/todos/'+id,{method:'DELETE'}); await loadTodos(); }catch(e){}
}

var _origRenderCal = renderCal;
renderCal = function(){
  _origRenderCal();
  var undone = todos.filter(function(t){ return !t.done && t.due_date; });
  undone.forEach(function(t){
    var cell = document.querySelector('[data-date="'+t.due_date+'"]');
    if(cell && !cell.querySelector('.todo-dot')){
      var dot = document.createElement('div'); dot.className='todo-dot'; cell.appendChild(dot);
    }
  });
};

// ── 大额支出标记 ──────────────────────────────────────────
var EXPENSE_THRESHOLD = 300;
var calExpenseDates = {};
async function loadCalExpenses(){
  try{
    var mstr = calYear+'-'+pad2(calMonth+1);
    var r = await fetch('/api/ledger?month='+mstr);
    var d = await r.json();
    calExpenseDates = {};
    (d.records||[]).forEach(function(rec){
      if(rec.amount < -EXPENSE_THRESHOLD){
        calExpenseDates[rec.date] = true;
      }
    });
    markCalExpenses();
  }catch(e){}
}
function markCalExpenses(){
  Object.keys(calExpenseDates).forEach(function(ds){
    var cell = document.querySelector('[data-date="'+ds+'"]');
    if(cell && !cell.querySelector('.expense-dot')){
      var dot = document.createElement('div'); dot.className='expense-dot'; cell.appendChild(dot);
    }
  });
}
var _origRenderCal2 = renderCal;
renderCal = function(){
  _origRenderCal2();
  markCalExpenses();
};

window.addEventListener('load', function(){
  var real = window.openDayModal;
  window.openDayModal = function(ds){
    if(real) real(ds);
    var dayTodos = todos.filter(function(t){ return t.due_date === ds; });
    var mb = document.querySelector('#day-modal .mb');
    if(!mb) return;
    var existing = document.getElementById('dm-todo-sec');
    if(existing) existing.remove();
    if(!dayTodos.length) return;
    var sec = document.createElement('div'); sec.id='dm-todo-sec';
    sec.innerHTML = '<div class="dm-todo-sep">当天待办</div>'
      + dayTodos.map(function(t){
          return '<div class="dm-todo-item'+(t.done?' done':'')+'">'
            +'<div class="dm-todo-cb'+(t.done?' checked':'')+'" onclick="toggleTodo('+t.id+');loadTodos();var p=this.closest(\'.dm-todo-item\');p.classList.toggle(\'done\');this.classList.toggle(\'checked\')"></div>'
            +'<div class="dm-todo-text">'+escHtml(t.content)+'</div>'
            +'</div>';
        }).join('');
    mb.insertBefore(sec, mb.querySelector('.mbtns'));
  };
  loadTodos();
  loadCalExpenses();
});

// ── Ledger 记账 ─────────────────────────────────────────────
var ledgerYear, ledgerMonth;
(function(){ var n=new Date(); ledgerYear=n.getFullYear(); ledgerMonth=n.getMonth(); }());
var ledgerType = 'exp';

function ledgerMonthStr(){ return ledgerYear+'-'+pad2(ledgerMonth+1); }
var ledgerStatsOpen = false;
function toggleLedgerStats(){
  ledgerStatsOpen = !ledgerStatsOpen;
  document.getElementById('ledger-stats-body').classList.toggle('show', ledgerStatsOpen);
  document.getElementById('ledger-stats-toggle').classList.toggle('open', ledgerStatsOpen);
}
function updateLedgerMonthTitle(){
  document.getElementById('ledger-month-title').textContent = ledgerYear+'年'+(ledgerMonth+1)+'月';
}
function changeLedgerMonth(dir){
  ledgerMonth+=dir; if(ledgerMonth<0){ledgerMonth=11;ledgerYear--;} if(ledgerMonth>11){ledgerMonth=0;ledgerYear++;}
  loadLedger();
}

var CAT_COLORS = {
  '餐饮':'#7c6a8a','购物':'#d4a574','交通':'#5a9a6a',
  '娱乐':'#c0806a','居家':'#6a8ab4','其他':'#a0a0a0'
};
var ledgerBudget = null;
var ledgerBudgetEditing = false;

function renderCompare(prevExp, curExp){
  var el = document.getElementById('ledger-compare');
  prevExp = Math.abs(prevExp||0); curExp = curExp||0;
  if(!prevExp && !curExp){ el.innerHTML=''; return; }
  if(!prevExp){ el.innerHTML='<div class="ledger-compare">上月无数据</div>'; return; }
  var diff = curExp - prevExp;
  var pct = Math.round(Math.abs(diff)/prevExp*100);
  var cls = diff>0?'cmp-up':diff<0?'cmp-down':'';
  var arrow = diff>0?'↑':diff<0?'↓':'—';
  var sign = diff>0?'+':diff<0?'-':'';
  el.innerHTML = '<div class="ledger-compare">比上月 <span class="'+cls+'">'+arrow+' '+sign+'¥'+Math.abs(diff).toFixed(2)+'</span> <span style="color:var(--muted)">('+sign+pct+'%)</span></div>';
}

function renderBudget(curExp){
  var el = document.getElementById('ledger-budget');
  if(ledgerBudgetEditing){
    el.innerHTML = '<div class="budget-inp-row">'
      +'<input class="budget-inp" id="budget-inp-val" type="number" placeholder="月预算金额" value="'+(ledgerBudget||'')+'">'
      +'<button class="budget-inp-save" onclick="saveBudget()">保存</button>'
      +'<button class="budget-inp-save" style="background:var(--border);color:var(--muted)" onclick="cancelBudget()">取消</button>'
      +'</div>';
    return;
  }
  if(!ledgerBudget){
    el.innerHTML = '<button class="budget-set-btn" onclick="startBudgetEdit()">+ 设置月预算</button>';
    return;
  }
  var pct = Math.min(curExp/ledgerBudget*100, 100);
  var fillCls = pct>=100?'over':pct>=80?'warn':'';
  el.innerHTML = '<div class="budget-bar-wrap">'
    +'<div class="budget-bar-hd"><span>月预算</span>'
    +'<button class="budget-edit-btn" onclick="startBudgetEdit()">¥'+ledgerBudget.toFixed(2)+' ✎</button></div>'
    +'<div class="budget-track"><div class="budget-fill '+fillCls+'" style="width:'+pct+'%"></div></div>'
    +'<div class="budget-hint">已用 ¥'+curExp.toFixed(2)+' / ¥'+ledgerBudget.toFixed(2)+' ('+Math.round(curExp/ledgerBudget*100)+'%)</div>'
    +'</div>';
}

function startBudgetEdit(){ ledgerBudgetEditing=true; renderBudget(0); setTimeout(function(){ var inp=document.getElementById('budget-inp-val'); if(inp)inp.focus(); },50); }
function cancelBudget(){ ledgerBudgetEditing=false; loadLedger(); }
async function saveBudget(){
  var val = parseFloat(document.getElementById('budget-inp-val').value);
  if(!val||val<=0){ return; }
  await fetch('/api/ledger/budget',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:ledgerMonthStr(),amount:val})});
  ledgerBudget=val; ledgerBudgetEditing=false; loadLedger();
}

function renderPie(expRecords){
  var el = document.getElementById('ledger-pie');
  if(!expRecords.length){ el.innerHTML=''; return; }
  var cats = {};
  expRecords.forEach(function(r){ var c=r.category||'其他'; cats[c]=(cats[c]||0)+Math.abs(r.amount); });
  var total = Object.values(cats).reduce(function(a,b){return a+b;},0);
  var entries = Object.entries(cats).sort(function(a,b){return b[1]-a[1];});
  var deg = 0;
  var stops = entries.map(function(e){
    var pct = e[1]/total*360;
    var col = CAT_COLORS[e[0]]||'#a0a0a0';
    var s = col+' '+deg+'deg '+(deg+pct)+'deg';
    deg+=pct; return s;
  });
  var gradient = 'conic-gradient('+stops.join(',')+')';
  var legend = entries.map(function(e){
    var col = CAT_COLORS[e[0]]||'#a0a0a0';
    var pct = Math.round(e[1]/total*100);
    return '<div class="pie-leg-row">'
      +'<div class="pie-dot" style="background:'+col+'"></div>'
      +'<span class="pie-leg-name">'+escHtml(e[0])+'</span>'
      +'<span class="pie-leg-amt">¥'+e[1].toFixed(0)+'</span>'
      +'<span class="pie-leg-pct">'+pct+'%</span>'
      +'</div>';
  }).join('');
  el.innerHTML = '<div class="pie-section">'
    +'<div class="pie-section-title">支出分类</div>'
    +'<div class="pie-wrap">'
    +'<div class="pie-el" style="background:'+gradient+'"></div>'
    +'<div class="pie-legend">'+legend+'</div>'
    +'</div></div>';
}

async function loadLedgerTrend(){
  var el = document.getElementById('ledger-trend');
  try{
    var r = await fetch('/api/ledger/trend');
    var data = await r.json();
    var max = Math.max.apply(null, data.map(function(d){return d.expense;}).concat([1]));
    var curMonth = ledgerMonthStr();
    el.innerHTML = data.map(function(d){
      var h = Math.max(2, Math.round(d.expense/max*48));
      var isCur = d.month === curMonth;
      var mm = d.month.slice(5);
      return '<div class="lt-bar-wrap">'
        +'<div class="lt-bar'+(isCur?' cur':'')+'" style="height:'+h+'px" title="¥'+d.expense.toFixed(0)+'"></div>'
        +'<div class="lt-label">'+mm+'月</div>'
        +'</div>';
    }).join('');
  }catch(e){ el.innerHTML=''; }
}
async function loadLedger(){
  updateLedgerMonthTitle();
  // 并行加载记账数据和预算
  try{
    var [r, rb] = await Promise.all([
      fetch('/api/ledger?month='+ledgerMonthStr()),
      fetch('/api/ledger/budget?month='+ledgerMonthStr())
    ]);
    var d = await r.json();
    var bd = await rb.json();
    ledgerBudget = bd.amount || null;
    var sum = d.summary || {};
    var expVal = Math.abs(sum.expense||0);
    var incVal = sum.income||0;
    var bal = sum.balance||0;
    document.getElementById('ledger-summary').innerHTML =
      '<div class="ledger-sum-item"><div class="ledger-sum-label">支出</div><div class="ledger-sum-val exp">¥'+expVal.toFixed(2)+'</div></div>'
      +'<div class="ledger-sum-item"><div class="ledger-sum-label">收入</div><div class="ledger-sum-val inc">¥'+incVal.toFixed(2)+'</div></div>'
      +'<div class="ledger-sum-item"><div class="ledger-sum-label">结余</div><div class="ledger-sum-val bal '+(bal>=0?'pos':'neg')+'">¥'+bal.toFixed(2)+'</div></div>';
    renderCompare(sum.prev_expense||0, expVal);
    renderBudget(expVal);
    loadLedgerTrend();
    var records = d.records || [];
    renderPie(records.filter(function(r){ return r.amount<0; }));
    var el = document.getElementById('ledger-list');
    if(!records.length){ el.innerHTML='<div class="empty-hint">本月还没有记录</div>'; return; }
    // 按日期分组，日期只在组头出现一次
    var byDay = {};
    var dayOrder = [];
    records.forEach(function(rec){
      var d = rec.date || '';
      if(!byDay[d]){ byDay[d]=[]; dayOrder.push(d); }
      byDay[d].push(rec);
    });
    var WD=['日','一','二','三','四','五','六'];
    el.innerHTML = dayOrder.map(function(d){
      var wd = d ? WD[new Date(d+'T00:00:00').getDay()] : '';
      var dayTotal = byDay[d].reduce(function(s,r){ return s+(r.amount<0?r.amount:0); },0);
      var hd = '<div class="ledger-day-hd">'+(+d.slice(5,7))+'月'+(+d.slice(8))+'日 周'+wd
        +(dayTotal<0?' · 支出 ¥'+Math.abs(dayTotal).toFixed(0):'')+'</div>';
      return hd + byDay[d].map(function(rec){
        var isExp = rec.amount < 0;
        return '<div class="ledger-row">'
          +(rec.category?'<span class="ledger-cat">'+escHtml(rec.category)+'</span>':'')
          +'<span class="ledger-note">'+(rec.note?escHtml(rec.note):'')+'</span>'
          +'<span class="ledger-amt '+(isExp?'exp':'inc')+'">'+(isExp?'-':'+')+Math.abs(rec.amount).toFixed(2)+'</span>'
          +'<button class="ledger-del" onclick="deleteLedger('+rec.id+')" title="删除"><i class="ti ti-x"></i></button>'
          +'</div>';
      }).join('');
    }).join('');
  }catch(e){ document.getElementById('ledger-list').innerHTML='<div class="empty-hint">加载失败</div>'; }
}
updateLedgerMonthTitle();

function setLedgerType(t){
  ledgerType = t;
  document.getElementById('ltype-exp').className = 'type-btn'+(t==='exp'?' act exp':'');
  document.getElementById('ltype-inc').className = 'type-btn'+(t==='inc'?' act inc':'');
}
function openLedgerModal(){
  var today = new Date();
  document.getElementById('ledger-date-inp').value = today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
  document.getElementById('ledger-amount-inp').value = '';
  document.getElementById('ledger-note-inp').value = '';
  setLedgerType('exp');
  document.getElementById('ledger-modal').classList.add('show');
}
function closeLedgerModal(){ document.getElementById('ledger-modal').classList.remove('show'); }
document.getElementById('ledger-modal').addEventListener('click',function(e){ if(e.target===this)closeLedgerModal(); });

async function submitLedger(){
  var amtRaw = parseFloat(document.getElementById('ledger-amount-inp').value);
  if(!amtRaw || amtRaw <= 0) return;
  var amount = ledgerType === 'exp' ? -amtRaw : amtRaw;
  var body = {
    amount: amount,
    category: document.getElementById('ledger-cat-inp').value,
    note: document.getElementById('ledger-note-inp').value.trim()||null,
    date: document.getElementById('ledger-date-inp').value||null,
    author: 'hayana'
  };
  try{
    await fetch('/api/ledger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeLedgerModal();
    await loadLedger();
  }catch(e){}
}
async function deleteLedger(id){
  try{ await fetch('/api/ledger/'+id,{method:'DELETE'}); await loadLedger(); }catch(e){}
}

// ── Wishlist 心愿单 ────────────────────────────────────────
var wishWho = 'hayana';
var WISH_ICON = {hayana:'<i class="ti ti-heart"></i>', fyodor:'<i class="ti ti-mouse"></i>', both:'<i class="ti ti-infinity"></i>'};
async function loadWishlist(){
  var el = document.getElementById('wishlist-list');
  try{
    var r = await fetch('/api/wishlist');
    var items = await r.json();
    if(!items.length){ el.innerHTML='<div class="empty-hint">心愿单还是空的</div>'; return; }
    el.innerHTML = items.map(function(it){
      var done = it.status === 'bought';
      var icon = WISH_ICON[it.who] || '';
      return '<div class="wish-row'+(done?' bought':'')+'">'
        +'<button class="wish-check'+(done?' done':'')+'" onclick="toggleWishlist('+it.id+','+(done?'false':'true')+')" title="标记'+(done?'未购':'已购')+'"><i class="ti ti-check"></i></button>'
        +'<span class="wish-who">'+icon+'</span>'
        +'<span class="wish-name">'+escHtml(it.name)+'</span>'
        +(it.price!=null?'<span class="wish-price">¥'+Number(it.price).toFixed(0)+'</span>':'')
        +(it.url?'<a class="wish-link" href="'+escHtml(it.url)+'" target="_blank" title="链接"><i class="ti ti-external-link"></i></a>':'')
        +'<button class="wish-del" onclick="deleteWishlist('+it.id+')" title="删除"><i class="ti ti-x"></i></button>'
        +(it.note?'<span class="wish-reason">'+escHtml(it.note)+'</span>':'')
        +'</div>';
    }).join('');
  }catch(e){ el.innerHTML='<div class="empty-hint">加载失败</div>'; }
}
function pickWishWho(btn){
  wishWho = btn.getAttribute('data-who');
  document.querySelectorAll('#wish-who .ta-btn').forEach(function(b){ b.classList.remove('act'); });
  btn.classList.add('act');
}
function openWishlistModal(){
  document.getElementById('wish-name-inp').value = '';
  document.getElementById('wish-price-inp').value = '';
  document.getElementById('wish-url-inp').value = '';
  document.getElementById('wish-note-inp').value = '';
  wishWho = 'hayana';
  document.querySelectorAll('#wish-who .ta-btn').forEach(function(b,i){ b.classList.toggle('act', i===0); });
  document.getElementById('wishlist-modal').classList.add('show');
}
function closeWishlistModal(){ document.getElementById('wishlist-modal').classList.remove('show'); }
document.getElementById('wishlist-modal').addEventListener('click',function(e){ if(e.target===this)closeWishlistModal(); });
async function submitWishlist(){
  var name = document.getElementById('wish-name-inp').value.trim();
  if(!name) return;
  var body = {
    name: name,
    price: document.getElementById('wish-price-inp').value || null,
    who: wishWho,
    url: document.getElementById('wish-url-inp').value.trim() || null,
    note: document.getElementById('wish-note-inp').value.trim() || null
  };
  try{
    await fetch('/api/wishlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeWishlistModal();
    await loadWishlist();
  }catch(e){}
}
async function toggleWishlist(id, makeDone){
  try{
    await fetch('/api/wishlist/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status: makeDone?'bought':'want'})});
    await loadWishlist();
  }catch(e){}
}
async function deleteWishlist(id){
  try{ await fetch('/api/wishlist/'+id,{method:'DELETE'}); await loadWishlist(); }catch(e){}
}
