<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>calendar · 我们家</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f8f8f6;--card:#fff;--text:#2a2020;--muted:#9a8a8a;
  --primary:#7c6a8a;--primary-bg:#f0ebf4;--primary-light:rgba(124,106,138,.08);
  --amber:#d4a574;--amber-bg:#fdf4e7;--amber-text:#412402;
  --border:#ece6e0;--shadow:0 1px 8px rgba(40,20,20,.07);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.hd{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding:44px 20px 10px;}
.hd-title{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--text);letter-spacing:.3px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:lowercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title i{font-size:14px;color:var(--primary);opacity:.8;}
.empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:12px 0;}
.hd-cal{padding:20px 0 14px;text-align:center;}
.hd-cal h1{font-size:22px;font-weight:700;letter-spacing:2px;color:var(--text);}
.hd-cal h1 span{color:var(--primary);}
.hd-cal .sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.5px;}
.section{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.section h2{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;flex-shrink:0;}
.section h2 .dot.amber{background:var(--amber);}
.soon{text-align:center;padding:28px 0 8px;color:var(--muted);}
.soon i{font-size:32px;color:var(--border);display:block;margin-bottom:10px;}
.soon p{font-size:13px;line-height:1.8;}
.soon .hint{font-size:11px;color:#c0b0b0;margin-top:4px;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-hd-title{font-size:15px;font-weight:700;color:var(--text);}
.cal-nav{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s;}
.cal-nav:hover{background:var(--primary-bg);color:var(--primary);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dh{font-size:11px;color:var(--muted);padding:4px 0;text-align:center;font-weight:500;}
.cal-day{font-size:14px;padding:7px 2px;text-align:center;cursor:pointer;border-radius:8px;transition:background .15s;line-height:1;}
.cal-day:not(:empty):hover{background:var(--primary-bg);}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700;}
.cal-day.sat,.cal-day.sun{color:var(--amber);}
.cd-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cd-card{background:var(--primary-bg);border-radius:12px;padding:14px 12px;text-align:center;}
.cd-em{font-size:18px;}
.cd-days{font-size:24px;font-weight:800;color:var(--primary);line-height:1.1;margin:2px 0;}
.cd-title{font-size:11px;color:var(--muted);}
.cd-add{display:block;width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;}
.cd-add:hover{border-color:var(--primary);color:var(--primary);}
.pd-heart{position:absolute;bottom:1px;right:2px;font-size:8px;color:var(--amber);line-height:1;}
.ps-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:.5px solid var(--border);}
.ps-row:last-child{border-bottom:none;}
.ps-label{font-size:12px;color:var(--muted);}
.ps-val{font-size:13px;font-weight:600;color:var(--text);}
.pd-btns{display:flex;gap:10px;margin-top:14px;}
.pd-btn{flex:1;padding:11px;border-radius:11px;border:none;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity .15s;}
.pd-btn:active{opacity:.7;}
.pd-btn.period{background:rgba(220,100,100,0.15);color:#b44;}
.pd-btn.sex{background:var(--amber-bg);color:var(--amber-text);}
.dm-rec{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border);font-size:13px;}
.dm-rec:last-child{border-bottom:none;}
.dm-del{border:none;background:none;color:#e05555;font-size:12px;cursor:pointer;font-family:inherit;}
.dm-add-row{display:flex;gap:8px;margin-top:12px;}
.dm-add-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);}
.dm-add-btn:active{background:var(--primary-bg);}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:50;padding:7px 0 calc(7px + env(safe-area-inset-bottom,0px));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:none;background:none;cursor:pointer;color:#b0a0aa;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:4px 0;transition:color .18s;}
.ni i{font-size:21px;}
.ni.act{color:var(--primary);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:flex-end;justify-content:center;}
.mo.show{display:flex;}
.mb{background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(44px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;}
.mb h3{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;color:var(--text);}
.mb select,.mb input{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);font-size:14px;font-family:inherit;color:var(--text);margin-bottom:10px;outline:none;-webkit-appearance:none;}
.mb select:focus,.mb input:focus{border-color:var(--primary);}
.mbtns{display:flex;gap:10px;margin-top:4px;}
.mbtns button{flex:1;padding:12px;border-radius:11px;border:none;font-size:14px;cursor:pointer;font-family:inherit;}
.bcn{background:var(--border);color:var(--muted);}
.bsb{background:var(--primary);color:#fff;}
.cal-day.pd:not(.today){background:rgba(220,100,100,.18);color:#b44;}
.cal-day.pd-pred:not(.today){outline:1.5px dashed rgba(220,100,100,.45);outline-offset:-2px;color:var(--text);}
.cal-day.ovul:not(.today){background:rgba(124,106,138,.25);color:var(--primary);}
.cal-day.fertile:not(.today){background:rgba(124,106,138,.1);}
/* ── to-do list ── */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border);}
.todo-item:last-child{border-bottom:none;}
.todo-cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);background:none;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.todo-cb.checked{background:var(--primary);border-color:var(--primary);}
.todo-cb.checked::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:13px;line-height:1.5;color:var(--text);word-break:break-word;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted);}
.todo-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.todo-due{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--amber-bg);color:var(--amber-text);letter-spacing:.2px;}
.todo-due.overdue{background:rgba(224,85,85,.12);color:var(--red);}
.todo-author{font-size:12px;color:var(--muted);}
.todo-del{background:none;border:none;color:var(--border);cursor:pointer;font-size:13px;padding:2px;flex-shrink:0;transition:color .15s;margin-top:1px;}
.todo-del:hover{color:var(--red);}
/* add row */
.todo-add{margin-top:14px;border-top:.5px solid var(--border);padding-top:14px;}
.todo-add-inp{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-family:inherit;color:var(--text);outline:none;margin-bottom:8px;}
.todo-add-inp:focus{border-color:var(--primary);}
.todo-add-row2{display:flex;gap:8px;align-items:center;}
.todo-date-btn{flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-family:inherit;color:var(--muted);outline:none;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap;}
.todo-date-btn.set{color:var(--text);border-color:var(--primary);}
.cal-day.sel:not(.today){background:var(--primary);color:#fff;}
.todo-authors{display:flex;gap:5px;}
.ta-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s;flex-shrink:0;}
.ta-btn.act{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.todo-add-btn{padding:7px 14px;border:none;border-radius:9px;background:var(--primary);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
/* calendar todo dot */
.cal-day{position:relative;}
.todo-dot{position:absolute;bottom:2px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:.7;}
/* day-modal todo section */
.dm-todo-sep{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:12px 0 6px;padding-top:10px;border-top:.5px solid var(--border);}
.dm-todo-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border);font-size:12.5px;}
.dm-todo-item:last-child{border-bottom:none;}
.dm-todo-cb{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;background:none;display:flex;align-items:center;justify-content:center;}
.dm-todo-cb.checked{background:var(--primary);border-color:var(--primary);}
.dm-todo-cb.checked::after{content:'';width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block;}
.dm-todo-text{flex:1;color:var(--text);}
.dm-todo-item.done .dm-todo-text{text-decoration:line-through;color:var(--muted);}

</style>
</head>
<body>

<div class="hd">
  <div class="hd-title">我们家</div>
</div>

<div style="padding:0 16px">

  <div class="hd-cal"><h1>calendar</h1><div class="sub">dates &amp; plans</div></div>

  <div class="section">
    <h2><span class="dot"></span>countdowns</h2>
    <div class="cd-list" id="cd-list"><div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:12px 0;">loading…</div></div>
    <button class="cd-add" onclick="openCD()">+ add countdown</button>
  </div>

  <div class="section">
    <div class="cal-hd">
      <button class="cal-nav" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-hd-title" id="cal-title"></span>
      <button class="cal-nav" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="section">
    <h2><span class="dot amber"></span>cycle tracker</h2>
    <div id="period-stats"><div class="empty-hint">loading…</div></div>
    <div class="pd-btns">
      <button class="pd-btn period" onclick="quickAddPeriod()">+ 经期开始</button>
      <button class="pd-btn sex" onclick="quickAddSex()">♥ 记录爱爱</button>
    </div>
  </div>

  <div class="section">
    <h2><span class="dot amber"></span>to-do list</h2>
    <div id="todo-list"><div class="empty-hint">loading…</div></div>
    <div class="todo-add">
      <input class="todo-add-inp" id="todo-inp" placeholder="添加待办…" onkeydown="if(event.key==='Enter')addTodo()">
      <div class="todo-add-row2">
        <button class="todo-date-btn" id="todo-date-btn" onclick="openTDPicker()"><i class="ti ti-calendar"></i><span id="todo-date-label">日期</span></button>
        <div class="todo-authors" id="todo-authors">
          <button class="ta-btn" data-author="hayana" onclick="pickAuthor(this)" title="哈娅"><i class="ti ti-heart"></i></button>
          <button class="ta-btn" data-author="fyodor_web" onclick="pickAuthor(this)" title="费奥多尔·网页"><i class="ti ti-mouse"></i></button>
          <button class="ta-btn" data-author="cc" onclick="pickAuthor(this)" title="CC"><i class="ti ti-moon"></i></button>
          <button class="ta-btn" data-author="fyodor_api" onclick="pickAuthor(this)" title="费奥多尔·API"><i class="ti ti-chess-knight"></i></button>
        </div>
        <button class="todo-add-btn" onclick="addTodo()">+ 添加</button>
      </div>
    </div>

  </div>

</div>

<nav class="bnav">
  <a class="ni" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni act" href="/calendar"><i class="ti ti-calendar"></i><span>calendar</span></a>
  <a class="ni" href="/read"><i class="ti ti-book"></i><span>read</span></a>
  <a class="ni" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>

<!-- Todo date picker -->
<div class="mo" id="tdmo">
  <div class="mb">
    <div class="cal-hd">
      <button class="cal-nav" onclick="changeTDMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-hd-title" id="td-cal-title"></span>
      <button class="cal-nav" onclick="changeTDMonth(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="td-cal-grid"></div>
    <div class="mbtns" style="margin-top:14px;">
      <button class="bcn" onclick="clearTDDate()">清除</button>
      <button class="bcn" onclick="closeTDPicker()">关闭</button>
    </div>
  </div>
</div>

<!-- Countdown date picker -->
<div class="mo" id="cddpmo">
  <div class="mb">
    <div class="cal-hd">
      <button class="cal-nav" onclick="changeCDMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-hd-title" id="cd-cal-title"></span>
      <button class="cal-nav" onclick="changeCDMonth(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="cd-cal-grid"></div>
    <div class="mbtns" style="margin-top:14px;">
      <button class="bcn" onclick="closeCDPicker()">关闭</button>
    </div>
  </div>
</div>

<!-- Countdown modal -->
<div class="mo" id="cdmo">
  <div class="mb">
    <h3>add countdown</h3>
    <input type="text" id="cd-title-inp" placeholder="title">
    <input type="text" id="cd-emoji" placeholder="emoji (e.g. 🎂)">
    <button class="todo-date-btn" id="cd-date-btn" onclick="openCDPicker()"><i class="ti ti-calendar"></i><span id="cd-date-label">选择日期</span></button>
    <select id="cd-type">
      <option value="countdown">countdown (days until)</option>
      <option value="countup">countup (days since)</option>
    </select>
    <div class="mbtns">
      <button class="bcn" onclick="closeCD()">cancel</button>
      <button class="bsb" onclick="submitCD()">add</button>
    </div>
  </div>
</div>

<!-- Day detail modal -->
<div class="mo" id="day-modal">
  <div class="mb">
    <h3 id="dm-title"></h3>
    <div id="dm-list"></div>
    <div class="dm-add-row">
      <button class="dm-add-btn" onclick="dmAdd('period')">+ 经期</button>
      <button class="dm-add-btn" onclick="dmAdd('sex')">+ 爱爱</button>
    </div>
    <div class="mbtns" style="margin-top:12px;">
      <button class="bcn" onclick="closeDayModal()">关闭</button>
    </div>
  </div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Calendar
var calYear,calMonth;
(function(){var n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();}());
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS=['Mo','Tu','We','Th','Fr','Sa','Su'];
function pad2(n){return n<10?"0"+n:String(n);}
function renderCal(){
  var today=new Date();var first=new Date(calYear,calMonth,1);var last=new Date(calYear,calMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('cal-title').textContent=MONTHS[calMonth]+' '+calYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(calYear,calMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(calMonth+1),dd=pad2(day),ds=calYear+'-'+mm+'-'+dd;html+='<div class="'+cls+'" data-date="'+ds+'" onclick="openDayModal(\''+ds+'\')">'+'<span>'+day+'</span></div>';}
  document.getElementById('cal-grid').innerHTML=html;
}
function changeMonth(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCal();if(typeof refreshPeriod==='function')refreshPeriod();}
renderCal();

// Todo date picker
var tdYear, tdMonth, tdSelectedDate=null;
function renderTDCal(){
  var today=new Date();var first=new Date(tdYear,tdMonth,1);var last=new Date(tdYear,tdMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('td-cal-title').textContent=MONTHS[tdMonth]+' '+tdYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(tdYear,tdMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&tdMonth===today.getMonth()&&tdYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(tdMonth+1),dd=pad2(day),ds=tdYear+'-'+mm+'-'+dd;if(ds===tdSelectedDate)cls+=' sel';html+='<div class="'+cls+'" onclick="pickTDDate(\''+ds+'\')"><span>'+day+'</span></div>';}
  document.getElementById('td-cal-grid').innerHTML=html;
}
function changeTDMonth(dir){tdMonth+=dir;if(tdMonth<0){tdMonth=11;tdYear--;}if(tdMonth>11){tdMonth=0;tdYear++;}renderTDCal();}
function openTDPicker(){var now=new Date();if(tdSelectedDate){var p=tdSelectedDate.split('-');tdYear=+p[0];tdMonth=+p[1]-1;}else{tdYear=now.getFullYear();tdMonth=now.getMonth();}renderTDCal();document.getElementById('tdmo').classList.add('show');}
function closeTDPicker(){document.getElementById('tdmo').classList.remove('show');}
function pickTDDate(ds){tdSelectedDate=ds;var p=ds.split('-');var btn=document.getElementById('todo-date-btn');btn.classList.add('set');document.getElementById('todo-date-label').textContent=(+p[1])+'月'+(+p[2])+'日';closeTDPicker();}
function clearTDDate(){tdSelectedDate=null;document.getElementById('todo-date-btn').classList.remove('set');document.getElementById('todo-date-label').textContent='日期';closeTDPicker();}
document.getElementById('tdmo').addEventListener('click',function(e){if(e.target===this)closeTDPicker();});

// Countdown date picker (mirrors todo date picker)
var cdYear, cdMonth, cdSelectedDate=null;
function renderCDCal(){
  var today=new Date();var first=new Date(cdYear,cdMonth,1);var last=new Date(cdYear,cdMonth+1,0);var startDow=(first.getDay()+6)%7;
  document.getElementById('cd-cal-title').textContent=MONTHS[cdMonth]+' '+cdYear;
  var html='';DAYS.forEach(function(d){html+='<div class="cal-dh">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){var dow=(new Date(cdYear,cdMonth,day).getDay()+6)%7;var cls='cal-day';if(day===today.getDate()&&cdMonth===today.getMonth()&&cdYear===today.getFullYear())cls+=' today';else if(dow===5)cls+=' sat';else if(dow===6)cls+=' sun';var mm=pad2(cdMonth+1),dd=pad2(day),ds=cdYear+'-'+mm+'-'+dd;if(ds===cdSelectedDate)cls+=' sel';html+='<div class="'+cls+'" onclick="pickCDDate(\''+ds+'\')"><span>'+day+'</span></div>';}
  document.getElementById('cd-cal-grid').innerHTML=html;
}
function changeCDMonth(dir){cdMonth+=dir;if(cdMonth<0){cdMonth=11;cdYear--;}if(cdMonth>11){cdMonth=0;cdYear++;}renderCDCal();}
function openCDPicker(){var now=new Date();if(cdSelectedDate){var p=cdSelectedDate.split('-');cdYear=+p[0];cdMonth=+p[1]-1;}else{cdYear=now.getFullYear();cdMonth=now.getMonth();}renderCDCal();document.getElementById('cddpmo').classList.add('show');}
function closeCDPicker(){document.getElementById('cddpmo').classList.remove('show');}
function pickCDDate(ds){cdSelectedDate=ds;var p=ds.split('-');var btn=document.getElementById('cd-date-btn');btn.classList.add('set');document.getElementById('cd-date-label').textContent=(+p[0])+'年'+(+p[1])+'月'+(+p[2])+'日';closeCDPicker();}
function resetCDDate(){cdSelectedDate=null;document.getElementById('cd-date-btn').classList.remove('set');document.getElementById('cd-date-label').textContent='选择日期';}
document.getElementById('cddpmo').addEventListener('click',function(e){if(e.target===this)closeCDPicker();});

async function loadCD(){try{var r=await fetch('/api/countdowns');var d=await r.json();var cds=d.countdowns||[];var c=document.getElementById('cd-list');if(!cds.length){c.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:12px 0;">no countdowns yet</div>';return;}c.innerHTML=cds.map(function(cd){return'<div class="cd-card"><div class="cd-em">'+(cd.emoji||'📅')+'</div><div class="cd-days">'+cd.days+'</div><div class="cd-title">'+escHtml(cd.title)+'</div></div>';}).join('');}catch(e){}}
function openCD(){document.getElementById('cdmo').classList.add('show');}
function closeCD(){document.getElementById('cdmo').classList.remove('show');}
document.getElementById('cdmo').addEventListener('click',function(e){if(e.target===this)closeCD();});
document.getElementById('day-modal').addEventListener('click',function(e){if(e.target===this)closeDayModal();});
async function submitCD(){var t=document.getElementById('cd-title-inp').value.trim();var date=cdSelectedDate;if(!t||!date)return;await fetch('/api/countdowns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,target_date:date,emoji:document.getElementById('cd-emoji').value||'📅',type:document.getElementById('cd-type').value})});document.getElementById('cd-title-inp').value='';document.getElementById('cd-emoji').value='';resetCDDate();closeCD();loadCD();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(console.error);}
loadCD();

// ── To-Do List ──────────────────────────────────────────────
var TODO_AUTHOR_META = {
  hayana:     {color:'#7c6a8a', icon:'ti-heart'},
  fyodor_web: {color:'#d4a574', icon:'ti-mouse'},
  cc:         {color:'#5a9a6a', icon:'ti-moon'},
  fyodor_api: {color:'#c0956a', icon:'ti-chess-knight'},
};
var todos = [];
var pickedAuthor = '';

function todoAuthorMeta(a){ return TODO_AUTHOR_META[a] || null; }

function pickAuthor(btn){
  var a = btn.getAttribute('data-author');
  if(pickedAuthor === a){ pickedAuthor=''; btn.classList.remove('act'); return; }
  document.querySelectorAll('#todo-authors .ta-btn').forEach(function(b){ b.classList.remove('act'); });
  pickedAuthor = a; btn.classList.add('act');
}

function fmtDue(due){
  if(!due) return '';
  var today = new Date(); var ds = today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
  var cls = due < ds ? 'todo-due overdue' : 'todo-due';
  var parts = due.split('-'); var label = parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
  return '<span class="'+cls+'">'+label+'</span>';
}

function renderTodos(){
  var el = document.getElementById('todo-list');
  if(!todos.length){ el.innerHTML = '<div class="empty-hint">还没有待办</div>'; return; }
  el.innerHTML = todos.map(function(t){
    var am = todoAuthorMeta(t.author);
    var authorHtml = am ? '<i class="ti '+am.icon+'" style="color:'+am.color+';font-size:12px" title="'+t.author+'"></i>' : '';
    var dueHtml = fmtDue(t.due_date);
    var meta = (dueHtml||authorHtml) ? '<div class="todo-meta">'+(dueHtml||'')+authorHtml+'</div>' : '';
    return '<div class="todo-item'+(t.done?' done':'') +'" id="ti-'+t.id+'">'
      +'<div class="todo-cb'+(t.done?' checked':'')+'" onclick="toggleTodo('+t.id+')"></div>'
      +'<div class="todo-body"><div class="todo-text">'+escHtml(t.content)+'</div>'+meta+'</div>'
      +'<button class="todo-del" onclick="deleteTodo('+t.id+')" title="删除"><i class="ti ti-x"></i></button>'
      +'</div>';
  }).join('');
  // re-render cal to update dots
  renderCal();
}

async function loadTodos(){
  try{
    var r = await fetch('/api/todos');
    var d = await r.json();
    todos = d.todos || [];
    renderTodos();
  }catch(e){ document.getElementById('todo-list').innerHTML='<div class="empty-hint">加载失败</div>'; }
}

async function addTodo(){
  var inp = document.getElementById('todo-inp');
  var content = inp.value.trim();
  if(!content) return;
  var due = tdSelectedDate;
  var body = {content: content};
  if(due) body.due_date = due;
  if(pickedAuthor) body.author = pickedAuthor;
  try{
    await fetch('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    inp.value=''; clearTDDate();
    pickedAuthor='';
    document.querySelectorAll('#todo-authors .ta-btn').forEach(function(b){ b.classList.remove('act'); });
    await loadTodos();
  }catch(e){}
}

async function toggleTodo(id){
  try{
    await fetch('/api/todos/'+id+'/toggle',{method:'POST'});
    await loadTodos();
  }catch(e){}
}

async function deleteTodo(id){
  try{
    await fetch('/api/todos/'+id,{method:'DELETE'});
    await loadTodos();
  }catch(e){}
}

// ── Calendar todo dot integration ───────────────────────────
var _origRenderCal = renderCal;
renderCal = function(){
  _origRenderCal();
  // add dots for days with pending todos
  var undone = todos.filter(function(t){ return !t.done && t.due_date; });
  undone.forEach(function(t){
    var cell = document.querySelector('[data-date="'+t.due_date+'"]');
    if(cell && !cell.querySelector('.todo-dot')){
      var dot = document.createElement('div'); dot.className='todo-dot';
      cell.appendChild(dot);
    }
  });
};

// ── Day modal todo integration ───────────────────────────────
var _origOpenDayModal = typeof openDayModal === 'function' ? openDayModal : null;

function openDayModalWithTodos(ds){
  if(_origOpenDayModal) _origOpenDayModal(ds);
  // append todos for this day
  var dayTodos = todos.filter(function(t){ return t.due_date === ds; });
  var mb = document.querySelector('#day-modal .mb');
  if(!mb) return;
  var existing = document.getElementById('dm-todo-sec');
  if(existing) existing.remove();
  if(!dayTodos.length) return;
  var sec = document.createElement('div'); sec.id='dm-todo-sec';
  sec.innerHTML = '<div class="dm-todo-sep">当天待办</div>'
    + dayTodos.map(function(t){
        return '<div class="dm-todo-item'+(t.done?' done':'')+'">'
          +'<div class="dm-todo-cb'+(t.done?' checked':'')+'" onclick="toggleTodo('+t.id+');this.closest(\'.dm-todo-item\').classList.toggle(\'done\');this.classList.toggle(\'checked\');loadTodos()"></div>'
          +'<div class="dm-todo-text">'+escHtml(t.content)+'</div>'
          +'</div>';
      }).join('');
  mb.insertBefore(sec, mb.querySelector('.mbtns'));
}

// Override openDayModal globally after period.js also loads
window.addEventListener('load', function(){
  var real = window.openDayModal || _origOpenDayModal;
  window.openDayModal = function(ds){
    if(real) real(ds);
    var dayTodos = todos.filter(function(t){ return t.due_date === ds; });
    var mb = document.querySelector('#day-modal .mb');
    if(!mb) return;
    var existing = document.getElementById('dm-todo-sec');
    if(existing) existing.remove();
    if(!dayTodos.length) return;
    var sec = document.createElement('div'); sec.id='dm-todo-sec';
    sec.innerHTML = '<div class="dm-todo-sep">当天待办</div>'
      + dayTodos.map(function(t){
          return '<div class="dm-todo-item'+(t.done?' done':'')+'">'
            +'<div class="dm-todo-cb'+(t.done?' checked':'')+'" onclick="toggleTodo('+t.id+');loadTodos();var p=this.closest(\'.dm-todo-item\');p.classList.toggle(\'done\');this.classList.toggle(\'checked\')"></div>'
            +'<div class="dm-todo-text">'+escHtml(t.content)+'</div>'
            +'</div>';
        }).join('');
    mb.insertBefore(sec, mb.querySelector('.mbtns'));
  };
  loadTodos();
});

</script>
