<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>文档库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#FAF6F1;--card:#fff;--text:#2a2020;--muted:#9a8a8a;--border:#EDE9E0;--amber:rgba(212,165,116,.95);--amber-bg:rgba(212,165,116,.14);}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;padding-bottom:80px;}
.hd{display:flex;align-items:center;padding:14px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5;}
.back{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;display:flex;}
.hd-title{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:700;flex:1;}
.hd-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:9px;cursor:pointer;font-family:inherit;}
.hd-btn.on{color:var(--amber);border-color:var(--amber);}
.list{padding:4px 12px;}
.empty{color:var(--muted);text-align:center;padding:50px 0;font-size:13px;}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;padding:11px 12px;display:flex;align-items:center;cursor:pointer;}
.fcheck{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;margin-right:10px;flex-shrink:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.manage .fcheck{display:flex;}
.fcard.sel .fcheck{background:var(--amber);border-color:var(--amber);}
.ficon{width:36px;height:36px;border-radius:9px;background:var(--amber-bg);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;margin-right:10px;}
.finfo{flex:1;min-width:0;}
.fname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fmeta{font-size:10.5px;color:var(--muted);margin-top:2px;}
.delbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;display:none;align-items:center;justify-content:space-between;}
.delbar.show{display:flex;}
.delbar .cnt{font-size:13px;color:var(--muted);}
.delbar .del{background:#c0645a;color:#fff;border:none;padding:8px 18px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;}
.delbar .del:disabled{opacity:.4;cursor:default;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;}
.ov.show{display:flex;flex-direction:column;}
.ov-hd{display:flex;align-items:center;padding:12px 14px;background:var(--card);}
.ov-hd .t{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-hd .x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}
.ov-body{flex:1;background:#fff;overflow:auto;}
.ov-body iframe{width:100%;height:100%;border:none;}
.ov-body pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);}
</style>
</head>
<body>
<div class="hd">
  <button class="back" onclick="location.href='/chat'"><i class="ti ti-chevron-left"></i></button>
  <div class="hd-title">文档库</div>
  <button class="hd-btn" id="mng" onclick="toggleManage()">管理</button>
</div>
<div class="list" id="list"><div class="empty">加载中…</div></div>
<div class="delbar" id="delbar">
  <span class="cnt" id="cnt">已选 0</span>
  <button class="del" id="delbtn" onclick="delSelected()" disabled>删除</button>
</div>
<div class="ov" id="ov">
  <div class="ov-hd"><span class="t" id="ovt"></span><button class="x" onclick="closeOv()">×</button></div>
  <div class="ov-body" id="ovb"></div>
</div>
<script>
var FILES=[], manage=false, sel={};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTime(dt){var s=String(dt||'');return s.slice(0,16).replace('T',' ');}
function libKey(f){return f.library_key || ('upload:'+f.id);}
function typeLabel(f){
  var src=f.source||'user_upload';
  var t=String(f.artifact_type||f.file_type||'').toLowerCase();
  if(src==='assistant_artifact'){
    if(t==='html') return 'HTML';
    if(t==='markdown'||t==='md') return 'Markdown';
    if(t==='docx') return 'Word';
    return (t||'Artifact').toUpperCase();
  }
  if(t==='html'||t==='htm') return 'HTML';
  if(t==='md'||t==='markdown') return 'Markdown';
  return (t||'文件').toUpperCase();
}
function whoLabel(f){
  if((f.source||'')==='assistant_artifact') return '费佳 · 生成';
  return '哈娅 · 上传';
}
function iconFor(f){
  var t=String(f.artifact_type||f.file_type||'').toLowerCase();
  if(t==='html'||t==='htm') return 'ti-brand-html5';
  if(t==='markdown'||t==='md') return 'ti-markdown';
  if(t==='docx') return 'ti-file-word';
  return 'ti-file-text';
}
function load(){
  fetch('/api/files/list').then(function(r){return r.json();}).then(function(d){
    FILES=(d&&d.files)||[]; render();
  }).catch(function(){document.getElementById('list').innerHTML='<div class="empty">加载失败</div>';});
}
function render(){
  var box=document.getElementById('list');
  if(!FILES.length){box.innerHTML='<div class="empty">还没有文件</div>';box.className='list';return;}
  box.className='list'+(manage?' manage':'');
  var html='';
  FILES.forEach(function(f){
    var key=libKey(f);
    var selCls=sel[key]?' sel':'';
    html+='<div class="fcard'+selCls+'" data-key="'+esc(key)+'">'+
      '<div class="fcheck"><i class="ti ti-check"></i></div>'+
      '<div class="ficon"><i class="ti '+iconFor(f)+'"></i></div>'+
      '<div class="finfo"><div class="fname">'+esc(f.file_name||'文件')+'</div>'+
        '<div class="fmeta">'+esc(typeLabel(f)+' · '+whoLabel(f)+' · '+fmtTime(f.created_at))+'</div></div>'+
    '</div>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('.fcard'), function(el){
    el.onclick=function(){ onCard(el.getAttribute('data-key')); };
  });
}
function toggleManage(){
  manage=!manage; sel={};
  document.getElementById('mng').className='hd-btn'+(manage?' on':'');
  document.getElementById('mng').textContent=manage?'完成':'管理';
  updateBar(); render();
}
function findByKey(key){
  for(var i=0;i<FILES.length;i++){ if(libKey(FILES[i])===key) return FILES[i]; }
  return null;
}
function onCard(key){
  if(manage){
    if(sel[key]) delete sel[key]; else sel[key]=true;
    updateBar(); render();
  } else {
    var f=findByKey(key);
    if(f) openItem(f);
  }
}
function updateBar(){
  var n=Object.keys(sel).length;
  document.getElementById('delbar').className='delbar'+(manage?' show':'');
  document.getElementById('cnt').textContent='已选 '+n;
  document.getElementById('delbtn').disabled=(n===0);
}
function delSelected(){
  var keys=Object.keys(sel);
  if(!keys.length) return;
  var hasArtifact=keys.some(function(k){return k.indexOf('artifact:')===0;});
  var msg='删除选中的 '+keys.length+' 个文件？\n聊天记录正文会保留。';
  if(hasArtifact){
    msg+='\n\n删除 AI 生成文件后，历史聊天里的对应 Artifact 卡片可能无法再次打开。';
  }
  if(!confirm(msg)) return;
  fetch('/api/files/delete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({keys:keys})
  }).then(function(r){return r.json();}).then(function(){
    sel={}; manage=false; toggleManageReset(); load();
  });
}
function toggleManageReset(){
  document.getElementById('mng').className='hd-btn';
  document.getElementById('mng').textContent='管理';
  updateBar();
}
function openItem(f){
  var src=f.source||'user_upload';
  var t=String(f.artifact_type||f.file_type||'').toLowerCase();
  // DOCX Artifact: download only (server preview returns 400).
  if(src==='assistant_artifact' && t==='docx'){
    location.href=f.download_url||('/api/artifacts/'+f.id+'/download');
    return;
  }
  var url=f.preview_url||'';
  if(!url){
    document.getElementById('ovt').textContent=f.file_name||'文件';
    document.getElementById('ovb').innerHTML='<pre>无预览地址</pre>';
    document.getElementById('ov').className='ov show';
    return;
  }
  document.getElementById('ovt').textContent=f.file_name||'文件';
  var body=document.getElementById('ovb');
  body.innerHTML='';
  var ifr=document.createElement('iframe');
  ifr.setAttribute('referrerpolicy','no-referrer');
  // Outer frame stays trusted same-origin so server preview shell can
  // fetch(/.../content). Untrusted HTML is sandboxed only inside that shell.
  body.appendChild(ifr);
  ifr.src=url;
  document.getElementById('ov').className='ov show';
}
function closeOv(){ document.getElementById('ov').className='ov'; document.getElementById('ovb').innerHTML=''; }
load();
</script>
</body>
</html>
