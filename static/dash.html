<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我们家</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f8f8f6;--card:#fff;--text:#2a2020;--muted:#9a8a8a;
  --primary:#7c6a8a;--amber:#d4a574;--border:#ece6e0;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%;text-size-adjust:100%;}

/* Header */
.hd{padding:44px 20px 16px;text-align:center;}
.hd h1{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;letter-spacing:1px;}
.hd h1 .fy{color:var(--primary);}
.hd h1 .amp{color:var(--amber);font-weight:400;}
.hd h1 .ha{color:var(--amber);}
.hd .sub{font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.5px;}

/* Stat cards — flex gap unsupported on Chrome <84 WebView */
.stats{display:flex;padding:6px 20px 4px;}
.stats .stat + .stat{margin-left:10px;}
.stat{flex:1;background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:16px 14px;text-align:center;}
.stat .n{font-size:28px;font-weight:800;line-height:1.1;}
.stat .n.p{color:var(--primary);}
.stat .n.a{color:var(--amber);}
.stat .l{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.4px;}

/* Miss button */
.miss-wrap{padding:14px 20px 6px;text-align:center;}
.miss-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:50px;padding:14px 0;font-size:15px;cursor:pointer;font-family:inherit;transition:transform .15s;box-shadow:0 2px 12px rgba(124,106,138,.3);letter-spacing:.5px;}
.miss-btn:active{transform:scale(.96);}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.miss-btn.beating{animation:beat .3s ease;}
.miss-info{font-size:12px;color:var(--muted);margin-top:8px;}

/* Memory grid — grid gap OK on Chrome 66+ */
.sec{padding:16px 20px 4px;}
.sec-t{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mcard{background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:15px 16px;cursor:pointer;transition:transform .12s;}
.mcard:active{transform:scale(.97);}
.mcard i{font-size:19px;}
.mcard .n{font-size:24px;font-weight:800;margin-top:6px;line-height:1.1;}
.mcard .l{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.4px;}
.mcard.p i,.mcard.p .n{color:var(--primary);}
.mcard.a i,.mcard.a .n{color:var(--amber);}
.mcard.diary{background:#fdf9f4;border:1px solid rgba(212,165,116,.3);}

/* Heatmap */
.heat{margin:14px 20px 0;background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:16px;}
.heat-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.heat-hd .m{font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:700;letter-spacing:.5px;}
.heat-hd .hint{font-size:10px;color:var(--muted);}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hwd{font-size:9px;color:var(--muted);text-align:center;padding:2px 0;letter-spacing:.5px;}
.hcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:8px;color:var(--text);}
.hcell.today{background:var(--primary);color:#fff;font-weight:700;}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--muted);}
.heat-legend .sq{width:12px;height:12px;border-radius:3px;border:.5px solid var(--border);margin-left:4px;}
.heat-legend .sq:first-of-type{margin-left:4px;}

/* Diary generate button */
.act-btn{display:block;margin:14px 20px 0;width:calc(100% - 40px);padding:13px;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity .18s;letter-spacing:.3px;text-align:center;background:var(--amber);box-shadow:0 2px 10px rgba(212,165,116,.25);}
.act-btn:active{opacity:.82;}
.act-btn:disabled{opacity:.6;}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:50;padding:7px 0 calc(7px + env(safe-area-inset-bottom,0px));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;text-decoration:none;border:none;background:none;cursor:pointer;color:#b0a0aa;font-size:10px;letter-spacing:.4px;font-family:inherit;padding:4px 0;transition:color .18s;}
.ni i{font-size:21px;margin-bottom:3px;}
.ni.act{color:var(--primary);}

/* Modals */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;padding:24px;}
.mo.show{display:flex;}
.mb{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:72vh;display:flex;flex-direction:column;}
.mb h3{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text);}
.mb textarea{width:100%;min-height:120px;padding:12px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;color:var(--text);resize:none;outline:none;}
.mb textarea:focus{border-color:var(--amber);}
.d-send{margin-top:12px;padding:12px;border:none;border-radius:11px;background:var(--amber);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:.3px;}
.d-send:active{opacity:.85;}
.l-body{overflow-y:auto;}
.li{padding:11px 0;border-bottom:.5px solid var(--border);}
.li:last-child{border-bottom:none;}
.li-hd{display:flex;justify-content:space-between;margin-bottom:4px;}
.li-a{font-size:12px;font-weight:600;}
.li-a.p{color:var(--primary);}
.li-a.a{color:var(--amber);}
.li-t{font-size:11px;color:var(--muted);}
.li-c{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;}
.empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}
</style>
</head>
<body>

<div class="hd">
  <h1><span class="fy">Fyodor</span> <span class="amp">&amp;</span> <span class="ha">Haya</span></h1>
  <div class="sub" id="hd-sub">together · loading…</div>
</div>

<div class="stats">
  <div class="stat"><div class="n p" id="s-fy">—</div><div class="l">记忆与日记</div></div>
  <div class="stat"><div class="n a" id="s-miss">—</div><div class="l">missing you</div></div>
</div>

<div class="miss-wrap">
  <button class="miss-btn" id="miss-btn" onclick="pressMiss()">missing you</button>
  <div class="miss-info" id="miss-info"></div>
</div>

<div class="sec">
  <div class="sec-t">memory</div>
  <div class="grid2">
    <div class="mcard p" onclick="window.location.href='/core'"><i class="ti ti-bookmark"></i><div class="n" id="m-core">—</div><div class="l">core · 核心</div></div>
    <div class="mcard p" onclick="window.location.href='/long-term'"><i class="ti ti-archive"></i><div class="n" id="m-long">—</div><div class="l">long-term · 长期</div></div>
    <div class="mcard a" onclick="window.location.href='/recent'"><i class="ti ti-clock"></i><div class="n" id="m-recent">—</div><div class="l">recent · 近期</div></div>
    <div class="mcard a diary" onclick="openDiary()"><i class="ti ti-moon"></i><div class="n" id="m-diary">—</div><div class="l">white-night · 白夜</div></div>
  </div>
</div>

<div class="heat">
  <div class="heat-hd"><span class="m" id="heat-month">—</span><span class="hint">颜色越深，记忆越多</span></div>
  <div class="heat-grid" id="heat-grid"></div>
  <div class="heat-legend">少
    <span class="sq" style="background:rgba(124,106,138,.10)"></span>
    <span class="sq" style="background:rgba(124,106,138,.25)"></span>
    <span class="sq" style="background:rgba(124,106,138,.45)"></span>
    <span class="sq" style="background:rgba(124,106,138,.70)"></span>
  多</div>
</div>


<nav class="bnav">
  <a class="ni act" href="/dash"><i class="ti ti-layout-dashboard"></i><span>dash</span></a>
  <a class="ni" href="/chat"><i class="ti ti-message-2"></i><span>chat</span></a>
  <a class="ni" href="/read"><i class="ti ti-book"></i><span>read</span></a>
  <a class="ni" href="/board"><i class="ti ti-clipboard-list"></i><span>board</span></a>
</nav>


<!-- Read-only list modal -->
<div class="mo" id="lmo">
  <div class="mb">
    <h3 id="l-title"></h3>
    <div class="l-body" id="l-body"></div>
  </div>
</div>

<script>
var posts=[];
var TOGETHER_SINCE=new Date('2023-12-24');
var MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];

function isFy(a){return['fyodor','claude','assistant'].includes(String(a).toLowerCase());}

function fmtDate(dt){
  if(!dt)return'';
  var d=new Date(dt.replace(' ','T'));
  return(d.getMonth()+1)+'.'+d.getDate()+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function postDate(p){return p.created_at?new Date(p.created_at.replace(' ','T')):null;}

async function load(){
  try{
    var r=await fetch('/api/posts');
    var d=await r.json();
    posts=d.posts||[];
    updateStats(); renderHeat();
  }catch(e){console.error(e);}
}

function updateStats(){
  var days=Math.floor((new Date()-TOGETHER_SINCE)/864e5);
  document.getElementById('hd-sub').textContent='together '+days+' days · love-style.xyz';
  var fyMem=posts.filter(p=>isFy(p.author)&&(p.type==='MEMORY'||p.type==='DIARY'));
  var ms=posts.filter(p=>p.type==='MISS');
  document.getElementById('s-fy').textContent=fyMem.length;
  document.getElementById('s-miss').textContent=ms.length;
  if(ms.length>0){
    var last=ms[ms.length-1];
    document.getElementById('miss-info').textContent=ms.length+' 次 · 最近 '+fmtDate(last.created_at);
  }
  var mems=posts.filter(p=>p.type==='MEMORY');
  document.getElementById('m-core').textContent=mems.filter(p=>p.layer==='core').length;
  document.getElementById('m-long').textContent=mems.filter(p=>p.layer==='long-term').length;
  var wk=Date.now()-7*864e5;
  document.getElementById('m-recent').textContent=posts.filter(function(p){
    var d=postDate(p); return d&&d.getTime()>=wk;
  }).length;
  document.getElementById('m-diary').textContent=posts.filter(p=>p.type==='DIARY').length;
}

function renderHeat(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  document.getElementById('heat-month').textContent=MONTHS[m]+' '+y;
  var counts={};
  posts.forEach(function(p){
    var d=postDate(p);
    if(d&&d.getFullYear()===y&&d.getMonth()===m)counts[d.getDate()]=(counts[d.getDate()]||0)+1;
  });
  var first=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var html='';
  ['S','M','T','W','T','F','S'].forEach(function(w){html+='<div class="hwd">'+w+'</div>';});
  for(var i=0;i<first;i++)html+='<div></div>';
  for(var day=1;day<=dim;day++){
    var c=counts[day]||0;
    var op=c===0?0:c===1?0.10:c===2?0.25:c===3?0.45:0.70;
    var isToday=day===now.getDate();
    var style=(op>0&&!isToday)?' style="background:rgba(124,106,138,'+op+')"':'';
    html+='<div class="hcell'+(isToday?' today':'')+'"'+style+'>'+day+'</div>';
  }
  document.getElementById('heat-grid').innerHTML=html;
}

var LISTS={
  core:{title:'core · 核心记忆',filter:function(p){return p.type==='MEMORY'&&p.layer==='core';}},
  long:{title:'long-term · 长期记忆',filter:function(p){return p.type==='MEMORY'&&p.layer==='long-term';}},
  recent:{title:'recent · 近 7 天',filter:function(p){var d=postDate(p);return d&&d.getTime()>=Date.now()-7*864e5;}}
};

function openList(kind){
  var cfg=LISTS[kind];
  var list=posts.filter(cfg.filter);
  document.getElementById('l-title').textContent=cfg.title;
  var html=list.length?list.map(function(p){
    var f=isFy(p.author);
    return '<div class="li"><div class="li-hd">' +
      '<span class="li-a '+(f?'p':'a')+'">'+(f?'Fyodor':'Haya')+'</span>' +
      '<span class="li-t">'+fmtDate(p.created_at)+'</span></div>' +
      '<div class="li-c">'+escHtml(p.content)+'</div></div>';
  }).join(''):'<div class="empty">nothing here yet</div>';
  document.getElementById('l-body').innerHTML=html;
  document.getElementById('lmo').classList.add('show');
}

function openDiary(){window.location.href='/static/white-night.html';}


async function pressMiss(){
  var btn=document.getElementById('miss-btn');
  btn.classList.add('beating');
  setTimeout(function(){btn.classList.remove('beating');},350);
  await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:'MISS',content:'missing you',author:'hayana'})});
  await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:'hayana',content:'*悄悄按了一下 missing you*'})});
  try{
    var r=await fetch('/api/gw/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    var d=await r.json();
    if(d.content) notify('Fyodor', d.content.slice(0,80));
  }catch(e){}
  await load();
}


var swReg=null;
async function notify(title,body){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') await Notification.requestPermission();
  if(Notification.permission!=='granted')return;
  if(swReg&&swReg.active) swReg.active.postMessage({type:'NOTIFY',title,body});
  else new Notification(title,{body,icon:'/icon-192.png'});
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(function(r){swReg=r;r.update();}).catch(console.error);
}

document.querySelectorAll('.mo').forEach(function(o){
  o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
});

load();
</script>
<script src="/static/smart-quote.js"></script>
</body>
</html>
