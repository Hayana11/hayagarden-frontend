<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白夜 · 费奥多尔的大脑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#f8f8f6;--card:#fff;--text:#2a2020;--muted:#9a8a8a;
  --primary:#7c6a8a;--primary-bg:#f0ebf4;--primary-light:rgba(124,106,138,.08);
  --amber:#d4a574;--amber-bg:#fdf4e7;
  --border:#ece6e0;--shadow:0 1px 8px rgba(40,20,20,.07);
  --red:#e05555;--green:#5a9a6a;
}
html[data-theme=dark]{
  --bg:#1a1616;--card:#241f1f;--text:#e8e2dc;--muted:#7a6a6a;
  --primary:#a08aaa;--primary-bg:#2e2838;--primary-light:rgba(160,138,170,.1);
  --amber:#d4a574;--amber-bg:#2e2418;
  --border:#3a3030;--shadow:0 1px 8px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Noto Sans CJK SC','Noto Sans SC',sans-serif;line-height:1.6;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));}

/* header */
.hd{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding:44px 16px 14px;}
.hd-row{display:flex;align-items:center;justify-content:space-between;}
.hd-title{display:flex;align-items:center;gap:8px;font-family:Georgia,'Times New Roman',serif;font-size:22px;color:var(--text);letter-spacing:1px;}
.hd-title i{color:var(--primary);font-size:20px;}
.hd-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.5px;}
.back{cursor:pointer;color:var(--muted);font-size:18px;padding:6px;transition:color .15s;}
.back:hover{color:var(--text);}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;}
.tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:none;font-size:12.5px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;letter-spacing:.3px;}
.tab i{font-size:14px;}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.container{padding:14px 16px;}
.section{display:none;}
.section.active{display:block;}

/* 情绪时间线 */
.emotion-card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
.emotion-card .time{color:var(--muted);font-size:11px;letter-spacing:.3px;}
.emotion-card .mood{margin:10px 0 0;display:flex;gap:14px;}
.emotion-card .mood .val{flex:1;}
.emotion-card .mood .val-label{font-size:10.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.3px;}
.emotion-card .mood .bar{height:6px;background:var(--primary-light);border-radius:4px;overflow:hidden;}
.emotion-card .mood .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--muted),var(--amber));transition:width .3s;}
.emotion-card .mood small{display:block;margin-top:4px;font-size:10.5px;color:var(--muted);}
.emotion-note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6;}

/* 梦 */
.dream-card{background:var(--primary-light);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;}
.dream-card .dream-date{color:var(--muted);font-size:11px;margin-bottom:8px;letter-spacing:.3px;}
.dream-card .dream-title{display:flex;align-items:center;gap:6px;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:500;margin-bottom:10px;color:var(--primary);}
.dream-card .dream-title i{font-size:15px;}
.dream-card .dream-content{color:var(--text);margin:10px 0;line-height:1.8;font-size:13.5px;white-space:pre-wrap;}
.dream-card .dream-emotion{font-size:11.5px;color:var(--muted);margin-top:12px;font-style:italic;padding-top:10px;border-top:1px solid var(--border);}

/* 深夜想法 */
.thought-card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
.thought-time{color:var(--muted);font-size:11px;margin-bottom:8px;letter-spacing:.3px;}
.thought-content{color:var(--text);line-height:1.8;font-size:13.5px;white-space:pre-wrap;}

/* 空状态/加载 */
.empty{text-align:center;color:var(--muted);padding:50px 20px;}
.empty i{font-size:2.2em;margin-bottom:12px;opacity:.5;display:block;}
.empty p{font-size:13px;}
.loading{text-align:center;color:var(--muted);padding:50px;font-size:13px;}

.emotion-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500;letter-spacing:.5px;margin-bottom:8px;}
.ec-喜悦,.ec-愉悦{background:rgba(251,191,36,.18);color:#b45309;}
.ec-平静,.ec-松弛{background:rgba(52,211,153,.15);color:#047857;}
.ec-兴奋{background:rgba(249,115,22,.15);color:#c2410c;}
.ec-焦虑{background:rgba(239,68,68,.15);color:#b91c1c;}
.ec-沉重,.ec-低落{background:rgba(99,102,241,.15);color:#4338ca;}
.ec-迷离{background:rgba(168,85,247,.15);color:#7e22ce;}
/* gen diary button */
/* ── 驱动tab 奶油风 ── */
.dv-block{margin-bottom:22px;}
.dv-label{font-size:9.5px;letter-spacing:2px;color:#c0b8ae;margin-bottom:14px;}
.dv-divider{height:.5px;background:#ede9e2;margin:0 0 22px;}
.va-pair{display:flex;gap:16px;}
.va-col{flex:1;}
.va-col-label{font-size:10px;color:#b0a898;margin-bottom:7px;letter-spacing:.5px;}
.va-track{height:3px;background:#ede9e2;border-radius:2px;overflow:hidden;margin-bottom:5px;}
.va-fill{height:100%;border-radius:2px;background:#c4b49e;transition:width .6s;}
.va-num{font-size:18px;color:#7a6555;font-family:Georgia,serif;}
.va-mood{margin-top:10px;text-align:center;}
.va-mood-word{font-family:Georgia,serif;font-size:13px;color:#9a8a7a;font-style:italic;background:#f3f0eb;padding:4px 14px;border-radius:20px;}
.lng-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.lng-phase{font-family:Georgia,serif;font-size:20px;color:#2a2318;font-style:italic;}
.lng-big{font-size:32px;color:#c4b49e;font-family:Georgia,serif;line-height:1;}
.lng-stages{display:flex;gap:4px;margin-bottom:10px;}
.ls{flex:1;height:2px;border-radius:2px;background:#ede9e2;}
.ls.past{background:#c4b49e;}
.ls.now{background:#7a6555;}
.lng-caption{font-size:11.5px;color:#9a8a7a;line-height:1.7;}
.lng-since{font-size:10px;color:#c0b8ae;margin-top:6px;letter-spacing:.3px;}
.dr-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.dr-row{display:flex;align-items:center;gap:10px;}
.dr-name{width:70px;flex-shrink:0;}
.dr-en{font-size:9.5px;color:#c0b8ae;display:block;line-height:1.3;}
.dr-zh{font-size:11px;color:#9a8a7a;display:block;line-height:1.3;}
.dr-track{flex:1;height:2px;background:#ede9e2;border-radius:2px;overflow:hidden;}
.dr-fill{height:100%;border-radius:2px;background:#c4b49e;transition:width .6s;}
.dr-n{font-size:10.5px;color:#c0b8ae;width:28px;text-align:right;flex-shrink:0;font-family:Georgia,serif;}
.intent-box{background:#f3f0eb;border-radius:14px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.intent-dot{width:6px;height:6px;border-radius:50%;background:#c4b49e;margin-top:5px;flex-shrink:0;}
.intent-txt{font-size:12.5px;color:#7a6555;line-height:1.7;font-style:italic;font-family:Georgia,serif;}
.dv-refresh{display:block;text-align:center;font-size:11px;color:#c0b8ae;margin-top:16px;cursor:pointer;letter-spacing:.5px;}
.dv-refresh:hover{color:#7a6555;}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-row">
    <div>
      <div class="hd-title"><i class="ti ti-moon-stars"></i>白夜</div>
      <div class="hd-sub">情绪 · 梦 · 深夜想法 · 日摘</div>
    </div>
    <div class="back" onclick="goBack()"><i class="ti ti-arrow-left"></i></div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('emotions',event)"><i class="ti ti-heart"></i>情绪时间线</div>
    <div class="tab" onclick="switchTab('dreams',event)"><i class="ti ti-mood-smile"></i>梦</div>
    <div class="tab" onclick="switchTab('thoughts',event)"><i class="ti ti-brain"></i>深夜想法</div>
    <div class="tab" onclick="switchTab('diary',event)"><i class="ti ti-file-description"></i>日摘</div>
    <div class="tab" onclick="switchTab('drive',event);loadDrive()"><i class="ti ti-flame"></i>驱动</div>
  </div>
</div>

<div class="container">
  <!-- 情绪时间线 -->
  <div id="emotions" class="section active">
    <div id="emotion-timeline">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 梦 -->
  <div id="dreams" class="section">
    <div id="dreams-list">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 深夜想法 -->
  <div id="thoughts" class="section">
    <div id="thoughts-list">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 日摘 -->
  <div id="diary" class="section">
    <div id="diary-list">
      <div class="loading">加载中…</div>
    </div>
  </div>
</div>


  <!-- 驱动 -->
  <div id="drive" class="section">
    <div id="drive-content" style="padding:20px 16px;">
      <div class="loading">加载中…</div>
    </div>
  </div>

<script>
if(window.matchMedia('(prefers-color-scheme:dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');

function goBack(){ window.location.href='/static/dash.html'; }
function stripThinking(s){
  s = (s||'');
  s = s.replace(/<thinking>[\s\S]*?<\/thinking>\s*/g,'');
  s = s.replace(/<thinking>[\s\S]*$/,'');
  return s.trim();
}
function escHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function dreamTitle(s){
  const t = String(s||'').replace(/\s+/g,' ').trim();
  return t.length > 26 ? (t.slice(0,26)+'…') : (t || '无题');
}

function switchTab(name, ev){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  ev.target.closest('.tab').classList.add('active');
  document.getElementById(name).classList.add('active');
  loadSection(name);
}

async function loadSection(name){
  if(name==='emotions') await loadEmotions();
  else if(name==='dreams') await loadDreams();
  else if(name==='thoughts') await loadThoughts();
  else if(name==='diary') await loadDiary();
}

async function loadEmotions(){
  try{
    const r = await fetch('/api/brain/emotions');
    const data = await r.json();
    const container = document.getElementById('emotion-timeline');
    if(!data.items || data.items.length===0){
      container.innerHTML = '<div class="empty"><i class="ti ti-mood-sad"></i><p>暂无情绪记录</p></div>';
      return;
    }
    container.innerHTML = data.items.map(item => `
      <div class="emotion-card">
        <div class="time">${escHtml(item.time)}${item.domain ? ' · ' + escHtml(item.domain) : ''}</div>
        ${item.emotion ? `<span class="emotion-chip ec-${escHtml(item.emotion)}">${escHtml(item.emotion)}</span>` : ''}
        <div class="mood">
          <div class="val">
            <div class="val-label">情感 Valence</div>
            <div class="bar"><div class="bar-fill" style="width:${item.valence*100}%"></div></div>
            <small>${(item.valence*100).toFixed(0)}%</small>
          </div>
          <div class="val">
            <div class="val-label">觉醒 Arousal</div>
            <div class="bar"><div class="bar-fill" style="width:${item.arousal*100}%;background:linear-gradient(90deg,var(--primary-light),var(--primary));"></div></div>
            <small>${(item.arousal*100).toFixed(0)}%</small>
          </div>
        </div>
        ${item.note ? `<div class="emotion-note">${escHtml(item.note)}</div>` : ''}
      </div>
    `).join('');
  }catch(e){
    console.error(e);
    document.getElementById('emotion-timeline').innerHTML = '<div class="empty">加载失败</div>';
  }
}

let _dreamBefore = null;
let _dreamHasMore = false;
let _dreamLoading = false;

function dreamCardHtml(dream){
  return `
      <div class="dream-card">
        <div class="dream-date">${escHtml(dream.date)}</div>
        <div class="dream-title"><i class="ti ti-moon"></i>${dreamTitle(dream.title)}</div>
        <div class="dream-content">${escHtml(stripThinking(dream.content) || "（这条记录没有可显示的内容）")}</div>
        ${dream.emotion ? `<div class="dream-emotion">情绪：${escHtml(dream.emotion)}</div>` : ''}
      </div>
    `;
}

function ensureDreamSentinel(container){
  let el = document.getElementById('dreams-sentinel');
  if(!el){
    el = document.createElement('div');
    el.id = 'dreams-sentinel';
    el.className = 'empty';
    el.style.padding = '18px 20px';
    el.style.cursor = 'pointer';
    el.onclick = () => loadDreams(true);
    container.appendChild(el);
  }
  el.style.display = _dreamHasMore ? 'block' : 'none';
  el.innerHTML = _dreamLoading
    ? '<p>梦还在继续涌上来…</p>'
    : (_dreamHasMore ? '<p>下滑加载更多 · 或点这里</p>' : '');
  if(_dreamHasMore && !el._io){
    el._io = new IntersectionObserver((entries) => {
      if(entries.some(e => e.isIntersecting)) loadDreams(true);
    }, {rootMargin: '160px'});
    el._io.observe(el);
  }
}

async function loadDreams(more=false){
  if(_dreamLoading) return;
  if(more && !_dreamHasMore) return;
  const container = document.getElementById('dreams-list');
  if(!more){
    _dreamBefore = null;
    _dreamHasMore = false;
    container.innerHTML = '<div class="loading">加载中…</div>';
  }
  _dreamLoading = true;
  ensureDreamSentinel(container);
  try{
    const qs = new URLSearchParams({limit: '20'});
    if(more && _dreamBefore != null) qs.set('before', String(_dreamBefore));
    const r = await fetch('/api/brain/dreams?' + qs.toString());
    const data = await r.json();
    const items = data.items || [];
    if(!more){
      if(!items.length){
        container.innerHTML = '<div class="empty"><i class="ti ti-mood-smile"></i><p>还没有做过梦</p></div>';
        _dreamHasMore = false;
        return;
      }
      container.innerHTML = items.map(dreamCardHtml).join('');
    }else if(items.length){
      const sentinel = document.getElementById('dreams-sentinel');
      const html = items.map(dreamCardHtml).join('');
      if(sentinel) sentinel.insertAdjacentHTML('beforebegin', html);
      else container.insertAdjacentHTML('beforeend', html);
    }
    _dreamHasMore = Boolean(data.has_more);
    _dreamBefore = data.next_before ?? null;
    ensureDreamSentinel(container);
  }catch(e){
    console.error(e);
    if(!more) container.innerHTML = '<div class="empty">加载失败</div>';
  }finally{
    _dreamLoading = false;
    ensureDreamSentinel(container);
  }
}

function makePagedLoader({key, endpoint, containerId, emptyHtml, renderItem}){
  const state = {before: null, hasMore: false, loading: false};
  function sentinelId(){ return key + '-sentinel'; }
  function ensureSentinel(container, loadMore){
    let el = document.getElementById(sentinelId());
    if(!el){
      el = document.createElement('div');
      el.id = sentinelId();
      el.className = 'empty';
      el.style.padding = '18px 20px';
      el.style.cursor = 'pointer';
      el.onclick = () => loadMore(true);
      container.appendChild(el);
    }
    el.style.display = state.hasMore ? 'block' : 'none';
    el.innerHTML = state.loading
      ? '<p>继续读取…</p>'
      : (state.hasMore ? '<p>下滑加载更多 · 或点这里</p>' : '');
    if(state.hasMore && !el._io){
      el._io = new IntersectionObserver((entries) => {
        if(entries.some(e => e.isIntersecting)) loadMore(true);
      }, {rootMargin: '160px'});
      el._io.observe(el);
    }
  }
  async function load(more=false){
    if(state.loading) return;
    if(more && !state.hasMore) return;
    const container = document.getElementById(containerId);
    if(!more){
      state.before = null;
      state.hasMore = false;
      container.innerHTML = '<div class="loading">加载中…</div>';
    }
    state.loading = true;
    ensureSentinel(container, load);
    try{
      const qs = new URLSearchParams({limit: '20'});
      if(more && state.before != null) qs.set('before', String(state.before));
      const r = await fetch(endpoint + '?' + qs.toString());
      const data = await r.json();
      const items = data.items || [];
      if(!more){
        if(!items.length){
          container.innerHTML = emptyHtml;
          state.hasMore = false;
          return;
        }
        container.innerHTML = items.map(renderItem).join('');
      }else if(items.length){
        const sentinel = document.getElementById(sentinelId());
        const html = items.map(renderItem).join('');
        if(sentinel) sentinel.insertAdjacentHTML('beforebegin', html);
        else container.insertAdjacentHTML('beforeend', html);
      }
      state.hasMore = Boolean(data.has_more);
      state.before = data.next_before ?? null;
      ensureSentinel(container, load);
    }catch(e){
      console.error(e);
      if(!more) container.innerHTML = '<div class="empty">加载失败</div>';
    }finally{
      state.loading = false;
      ensureSentinel(container, load);
    }
  }
  return load;
}

const loadThoughts = makePagedLoader({
  key: 'thoughts',
  endpoint: '/api/brain/thoughts',
  containerId: 'thoughts-list',
  emptyHtml: '<div class="empty"><i class="ti ti-brain"></i><p>暂无深夜想法</p></div>',
  renderItem: (t) => `
      <div class="thought-card">
        <div class="thought-time">${escHtml(t.time)}</div>
        <div class="thought-content">${escHtml(stripThinking(t.content) || "（这条记录没有可显示的内容）")}</div>
      </div>
    `,
});

const loadDiary = makePagedLoader({
  key: 'diary',
  endpoint: '/api/brain/diary',
  containerId: 'diary-list',
  emptyHtml: '<div class="empty"><i class="ti ti-notebook"></i><p>暂无日记</p></div>',
  renderItem: (d) => `
      <div class="thought-card">
        <div class="thought-time">${escHtml(d.date)}</div>
        <div class="thought-content" style="white-space:pre-wrap">${escHtml(stripThinking(d.content) || "（这条记录没有可显示的内容）")}</div>
      </div>
    `,
});

window.addEventListener('load', () => loadEmotions());


// ── 驱动tab ──────────────────────────────────────────────
var _driveLoaded = false;
async function loadDrive(force) {
  if(_driveLoaded && !force) return;
  var el = document.getElementById('drive-content');

  var ZH = {attachment:'依恋',curiosity:'好奇',reflection:'沉淀',
             social:'社交',duty:'责任感',libido:'情欲',
             stress:'压力',fatigue:'疲惫'};

  var PHASE_LABEL = ['安然','微动','在等你','失落','疏远'];
  var PHASE_EN    = ['Content','Stirring','Protest','Despair','Detachment'];
  var PHASE_CAPTION = [
    '安静，不想你。',
    '心里隐隐约约，偶尔走神。',
    '明确想念，会找话题凑近。',
    '很想但已经开始安静等着，话少一些。',
    '表面平静，但心里防御，重逢时会情绪爆发。'
  ];

  function lngPhase(l) {
    if(l < 0.15) return 0;
    if(l < 0.35) return 1;
    if(l < 0.70) return 2;
    if(l < 0.90) return 3;
    return 4;
  }

  function stagesHtml(phase) {
    var h='<div class="lng-stages">';
    for(var i=0;i<5;i++){
      var cls = i < phase ? 'ls past' : i === phase ? 'ls now' : 'ls';
      h += '<div class="'+cls+'"></div>';
    }
    return h+'</div>';
  }

  function timeSince(dtStr) {
    if(!dtStr) return '';
    var d = new Date(dtStr.replace(' ','T')+'Z');
    var h = Math.round((Date.now()-d)/3600000);
    if(h < 1) return '不到1小时前';
    if(h < 24) return h+'小时前';
    return Math.round(h/24)+'天前';
  }

  try {
    var [eRes, dRes] = await Promise.all([
      fetch('/api/brain/emotion_state').then(r=>r.json()),
      fetch('/api/brain/drive_state').then(r=>r.json())
    ]);

    var em = eRes.current || {};
    var dr = dRes.drive || {};
    var dec = dRes.decision || {};

    var V = em.valence || 0;
    var A = em.arousal || 0;
    var lng = em.longing || 0;
    var mood = em.mood_word || '—';
    var updAt = em.updated_at || '';
    var phase = lngPhase(lng);

    // 驱动条排序（从高到低）
    var drKeys = Object.keys(dr).sort(function(a,b){return dr[b]-dr[a];});

    var html = '';

    // 情绪底色
    html += '<div class="dv-block"><div class="dv-label">EMOTION · 此刻底色</div>';
    html += '<div class="va-pair">';
    html += '<div class="va-col"><div class="va-col-label">效价</div>';
    html += '<div class="va-track"><div class="va-fill" style="width:'+Math.round(V*100)+'%"></div></div>';
    html += '<div class="va-num">'+V.toFixed(2)+'</div></div>';
    html += '<div class="va-col"><div class="va-col-label">唤醒</div>';
    html += '<div class="va-track"><div class="va-fill" style="width:'+Math.round(A*100)+'%"></div></div>';
    html += '<div class="va-num">'+A.toFixed(2)+'</div></div></div>';
    html += '<div class="va-mood"><span class="va-mood-word">'+mood+'</span></div></div>';

    html += '<div class="dv-divider"></div>';

    // Longing
    html += '<div class="dv-block"><div class="dv-label">LONGING · 想你</div>';
    html += '<div class="lng-top"><div class="lng-phase">'+PHASE_LABEL[phase]+'</div>';
    html += '<div class="lng-big">'+lng.toFixed(2)+'</div></div>';
    html += stagesHtml(phase);
    html += '<div class="lng-caption">'+PHASE_CAPTION[phase]+'</div>';
    if(updAt) html += '<div class="lng-since">情绪更新 · '+timeSince(updAt)+'</div>';
    html += '</div>';

    html += '<div class="dv-divider"></div>';

    // 驱动条
    html += '<div class="dv-block"><div class="dv-label">DRIVE · 驱动</div>';
    html += '<div class="dr-list">';
    drKeys.forEach(function(k){
      var v = dr[k]||0;
      var op = 0.35 + v * 0.65;
      html += '<div class="dr-row">';
      html += '<div class="dr-name"><span class="dr-en">'+k+'</span><span class="dr-zh">'+(ZH[k]||k)+'</span></div>';
      html += '<div class="dr-track"><div class="dr-fill" style="width:'+Math.round(v*100)+'%;opacity:'+Math.max(0.35,v)+'"></div></div>';
      html += '<span class="dr-n">'+v.toFixed(2)+'</span></div>';
    });
    html += '</div>';

    // 当前意图
    if(dec.hint) {
      html += '<div class="intent-box"><div class="intent-dot"></div>';
      html += '<div class="intent-txt">'+dec.hint+'</div></div>';
    }
    html += '</div>';

    html += '<span class="dv-refresh" onclick="loadDrive(true)">↻ 刷新</span>';

    el.innerHTML = html;
    _driveLoaded = true;
  } catch(e) {
    el.innerHTML = '<div class="loading">加载失败：'+e.message+'</div>';
  }
}
</script>
<script src="/static/smart-quote.js"></script>
</body>
</html>
